version = 1
doc = "A generated callback panic discards the callback's unfinished output, disables only that mod's callback for that hook for the session, and produces a named error log and client diagnostic toast. Other eligible listeners continue from the last accepted output. An ordinary phase or output refusal is reported each time without disabling the listener. Failed registration and chunk-disk work does not publish."
