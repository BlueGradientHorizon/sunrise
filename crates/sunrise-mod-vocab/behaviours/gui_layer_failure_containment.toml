version = 1
doc = "When a registered HUD layer painter or wrapper fails by refusal or panic, its lexical draw scopes close any open clips, completed primitives stay in the HUD batch without rolling back or replaying earlier bodies, the failure is reported (and a panic disables only that callback for the session, leaving a disabled wrapper to delegate directly to its previous body), and subsequent HUD hooks and layers still run independently."
tests = [
    "crates/sunrise-client/src/game/modding/gui_layer_tests.rs::failed_gui_layer_keeps_completed_paint_and_isolates_following_layers",
    "crates/sunrise-client/src/game/modding/gui_layer_tests.rs::a_gui_wrapper_panic_is_contained_but_delegated_engine_paint_is_fatal",
]
