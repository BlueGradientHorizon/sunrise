version = 1
doc = "A mod collider that turns, with or without a translation, shoves overlapping bodies by the minimum separation at its final pose. Its boxes are resolved once in index order against a scratch body and applied in one world-collided Carried move; no rotational path is swept. Pure translation keeps its swept advance. After an actual mod-collider shove, only velocity pointing into the shove is cancelled, following Create's ContraptionCollider.collideEntities; an upward shove leaves the collider's vertical speed. The server shoves non-player entities and never a player, a client predicts its own player's shove, riders are not shoved again, and vanilla pistons and shulkers are unchanged."
tests = [
  "crates/sunrise-core/src/geometry/oriented.rs::minimum_separation_uses_the_least_axis_at_the_final_pose",
  "crates/sunrise-core/src/geometry/oriented.rs::minimum_separation_resolves_each_box_against_the_moved_body",
  "crates/sunrise-client/src/game/blocks/piston_push/shoving_tests.rs::a_turning_collider_shoves_a_body_and_cancels_only_inward_velocity",
  "crates/sunrise-client/src/game/blocks/piston_push/shoving_tests.rs::a_combined_turn_and_translation_shoves_at_the_final_pose",
  "crates/sunrise-client/src/game/blocks/piston_push/shoving_tests.rs::a_turning_collider_shove_stops_at_a_wall_and_keeps_tangential_velocity",
  "crates/sunrise-client/src/game/blocks/piston_push/shoving_tests.rs::a_cancelled_turning_shove_leaves_velocity_alone",
  "crates/sunrise-client/src/game/blocks/piston_push/shoving_tests.rs::an_upward_shove_leaves_the_colliders_vertical_speed",
  "crates/sunrise-client/src/game/blocks/piston_push/shoving_tests.rs::a_server_side_turning_shove_never_moves_the_local_player",
  "crates/sunrise-client/src/game/blocks/piston_push/shoving_tests.rs::a_client_side_turning_shove_moves_the_local_player",
  "crates/sunrise-client/src/game/blocks/piston_push/shoving_tests.rs::a_rider_on_a_turning_collider_is_carried_and_not_shoved_again",
  "crates/sunrise-client/src/game/blocks/piston_push/shoving_tests.rs::a_vanilla_piston_shove_leaves_the_players_velocity_alone",
]
