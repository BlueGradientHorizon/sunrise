ids = ["handle:LevelRef::entities_in"]
why = "Spatial queries visit readable matches in the existing order and stop when the visitor asks, without building a list first. A refused query reports a typed error before calling the visitor."
migrate = "Replace `level.entities_in(host, min, max)` with `level.visit_entities_in(host, min, max, &mut |entity| { /* use entity */ core::ops::ControlFlow::Continue(()) })`. Store a match in a captured variable and return `core::ops::ControlFlow::Break(())` if you only need the first one. If you need a list, push into your own `Vec` in the visitor. Replace `Some` with `Ok(Continue(()))` on completion (including empty) or `Ok(Break(()))` on early stop. Replace `None` handling with `Err(LevelReadError::Stale)` for an old handle or `Err(LevelReadError::Unavailable)` for invalid bounds, a level not in place, or unavailable world access."
