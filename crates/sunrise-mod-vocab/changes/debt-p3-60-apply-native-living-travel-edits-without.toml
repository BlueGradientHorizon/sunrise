ids = ["hook:living_travel"]
why = "living_travel now applies edited input, velocity and cancellation independently through vanilla LivingEntity.travel, LivingEntity.travelInAir, Player.travel, Entity.moveRelative, Entity.getInputVector and Entity.setDeltaMovement, removing the synthetic [-1, 1] input and ±64 velocity caps, the output_validator rollback pipeline and its cancellation latch."
migrate = "Remove any assumption that writing an out-of-range or non-finite component rolls back the other vector or cancellation. Velocity writes now follow Entity.setDeltaMovement (finite vectors apply directly; non-finite vectors are ignored by the physical velocity write), input flows through Entity.getInputVector / Entity.moveRelative (vectors with squared length above 1.0 normalize), and #[listener(receive_cancelled)] listeners may set event.cancelled = false."
