why = """
A resident server block entity can be read and edited in place without a payload snapshot, reply,
or per-listener savepoint. This follows vanilla 26.3's Level.tickBlockEntities and BlockEntityTicker;
NeoForge adds no ticker event. Taking the Host and borrowing the subject are sequential; a later
loan checks that the original entity still occupies the same level and state. Every successful
storage write follows one save-mark rule.

Commit replays vanilla 26.3's LevelChunk.setBlockState: preRemoveSideEffects uses the row as it stood
at replacement, before removeBlockEntity and neighbor effects. In keeping with NeoForge's
SnapshotJournal.onClose, only abort restores the first-write snapshot. ItemEntityRef::set_stack still
uses ItemEntity.setItem and now joins the ambient transaction.
"""
migrate = """
- Change `fn block_entity_tick(&self, host, event: &mut BlockEntityTickEvent)` to
  `fn block_entity_tick(&self, event: &mut BlockEntityTickEvent<'_>)`. Instead of reading a handle
  through `host` or modifying `event.entity` and setting `event.reply`, call
  `event.subject.with_view(|mut subject| { ... })`. Use `subject.set_data_slot` for existing menu data,
  `set_data_slots` to initialize or resize it, `set_item_slot` for internal stacks, and `set_nbt` for
  saved fields. Menu-data writes through a handle now mark the chunk unsaved just like the view does;
  those slots remain transient and are not serialized.
- For Part state, get `event.subject.with_view(|view| view.handle())` and pass that handle and
  `event.subject.host()` to `edit_state`. To use another object, return any owned input from the view
  closure, then borrow `event.subject.host()`. Reborrow using `with_view` and handle `None` instead
  of writing to the replacement.
- A tick no longer commits a reply or opens a transaction for you. Replace proposed dropped-item
  writes in the tick reply with `item.set_stack(tick.host(), stack)`. To commit those writes or
  neighbor writes with the subject edits, put them in `event.subject.transaction(|tick, _| { ... })`,
  recheck source values after taking the Host, and return `Err` on a stale subject or failed write.
  `ItemEntityRef::set_stack` is visible immediately but rolls back on abort when a transaction is open;
  without a transaction it does not roll back.
"""
