why = """
A resident server block entity can be read and edited in place without a payload snapshot, reply, or per-listener savepoint. Taking the Host and borrowing the subject are sequential operations. Each loan checks the live block against the entity type (`LevelChunk.setBlockState`, `BoundTickingBlockEntity.tick`, `BlockEntityType.isValid`) rather than pinning the tick-start state.
Menu data slots have no synthetic 256-slot cap, matching vanilla `AbstractContainerMenu.addDataSlots`/`broadcastChanges`. Block-backed sync uses the nonnegative signed-short index range of vanilla `ClientboundContainerSetDataPacket`. The separate blockless payload uses the existing opening negotiation (like NeoForge's `ServerPlayer.openMenu` and `NetworkRegistry` payload negotiation) and now syncs every declared index. `MenuScreenOpen.data_slots` reports the declared count, or `0` for dynamic stock menus, not a hardcoded capacity.
Neither ticker-view writes nor handle menu-data writes mark the chunk unsaved; persisted changes require an explicit `set_changed` call, as in vanilla `BlockEntity.setChanged` and `AbstractFurnaceBlockEntity.serverTick`. `Items` belongs to the inventory codec only for an inventory holder (vanilla `BlockEntity.loadAdditional`/`saveAdditional` and `ContainerHelper.loadAllItems`/`saveAllItems`, as used by `AbstractFurnaceBlockEntity`); slotless mod holders save and load it as mod-owned NBT without reordering its list rows.
"""
migrate = """
`block_entity_tick` bumps to `hook_version = 3`. Change `fn block_entity_tick(&self, host, event: &mut BlockEntityTickEvent)` to `fn block_entity_tick(&self, event: &mut BlockEntityTickEvent<'_>)`. Instead of reading a handle through `host` or modifying `event.entity` and setting `event.reply`, call `event.subject.with_view(|mut subject| { ... })`. Reborrow after an in-place property update to get the live `subject.state()`; removal, replacement, or an invalid block still returns `None`. Keep `subject.handle()` only for later calls. To use another object, return any owned input from the view closure, then borrow `event.subject.host()`.
Use `subject.set_data_slot` for existing menu data and `subject.set_data_slots` to initialize or resize it; replace result handling for `subject.set_data_slots` with a direct `bool` test. Remove `BlockEntityDataError::TooManySlots` match arms. `BlockEntityRef::set_data_slots` still returns `Result<bool, BlockEntityDataError>` for `Stale` and `Unavailable`, with no 256-slot cap. Use `subject.set_item_slot` for internal stacks and `subject.set_nbt` for saved fields. On a holder where `item_slots() == 0`, use `subject.set_nbt("Items", ...)` to write or remove mod-owned NBT; `subject.nbt()` returns that field verbatim after a chunk reload, including its original list order. Neither the ticker view nor the handle menu-data setters automatically dirty the chunk: after a persisted change, call `handle.set_changed(host)` explicitly. To commit subject edits and neighbor or dropped-item edits together, use `event.subject.transaction`, recheck source values after taking the Host, and return `Err` on a stale subject or failed write. A tick no longer commits a reply or starts a transaction for you.
In `MenuScreenFactory::create`, don't treat `MenuScreenOpen.data_slots` as received data (or `0` as no dynamic stock data). Use `frame.data.get(index)` as values arrive. Keep synchronized indices in `0..=i16::MAX` for a block-backed menu. For blockless menus, pass one initial `i32` per declared index to `PlayerRef::open_mod_menu` and use `MenuRef::set_data_slot` unchanged; both initial values and committed updates now reach indices above 65,535 as well. Use a client that supports the new blockless data layout; otherwise `open_mod_menu` returns `OpenMenuError::PlayerUnavailable` without closing the old menu.
"""
