why = "A resident server block entity can be read and edited in place without a payload snapshot, reply, or per-listener savepoint. Taking the Host and borrowing the subject are sequential operations. On each `with_view` loan, the engine verifies the live block against the block entity's type (`LevelChunk.setBlockState`, `BoundTickingBlockEntity.tick`, `BlockEntityType.isValid`) instead of pinning the tick-start state, so valid in-place block-state updates remain borrowable with the updated live `BlockState`. Menu data slots have no synthetic 256-slot cap and `BlockEntityDataError::TooManySlots` is removed, matching vanilla `AbstractContainerMenu.addDataSlots`/`setData` and `ClientboundContainerSetDataPacket` (wire indices `0..=i16::MAX` for stock `ContainerSetData` sync); `MenuScreenOpen.data_slots` now reports the declared count for custom mod menu types and `0` for dynamic stock menu openings instead of a hardcoded 256-slot capacity. Neither ticker-view writes nor handle menu-data writes automatically mark the chunk unsaved; persisted changes require an explicit `set_changed` call, matching vanilla `BlockEntity.setChanged` and `AbstractFurnaceBlockEntity.serverTick`. `BlockEntityView::set_nbt` and the known-block load path reserve `\"Items\"` only when the block declares engine-managed container slots, allowing slotless block entities to store and reload `\"Items\"` verbatim in NBT."
migrate = "`block_entity_tick` bumps to `hook_version = 3`. Change `fn block_entity_tick(&self, host, event: &mut BlockEntityTickEvent)` to `fn block_entity_tick(&self, event: &mut BlockEntityTickEvent<'_>)`. Instead of reading a handle through `host` or modifying `event.entity` and setting `event.reply`, call `event.subject.with_view(|mut subject| { ... })`. Use `subject.set_data_slot` for existing menu data, `subject.set_data_slots` to initialize or resize it (now returning `bool` directly with no 256-slot cap), `subject.set_item_slot` for internal stacks, and `subject.set_nbt` for saved fields (on slotless block entities where `item_slots() == 0`, `set_nbt(\"Items\", ...)` writes or removes the NBT field directly and reloads verbatim instead of being rejected or decoded into `items`). Remove `BlockEntityDataError::TooManySlots` match arms; `BlockEntityRef::set_data_slots` still returns `Result<bool, BlockEntityDataError>` for `Stale` and `Unavailable`, with no 256-slot cap. In `MenuScreenFactory::create`, `MenuScreenOpen.data_slots` is the declared count for custom mod menu types and `0` for dynamic stock menu openings; stock screen code must read arriving values from `MenuScreenFrame::data` rather than treating `open.data_slots == 0` as meaning no data will arrive. To use another object, return any owned input from the view closure, then borrow `event.subject.host()`. Reborrow using `with_view`: in-place updates to another valid block state for the block entity's type (`BlockEntityType.isValid`) succeed and expose the live `BlockState` from `subject.state()`, while removal, replacement, or an invalid block returns `None`. Neither ticker-view writes nor handle menu-data writes (`set_data_slot`/`set_data_slots`) automatically mark the chunk unsaved; call `handle.set_changed(host)` explicitly when persisted state changes. To commit both subject and neighbor or dropped-item edits together, wrap the sequence in `event.subject.transaction`, recheck any source values after taking the Host, and return `Err` on a stale subject or failed write. Keep `subject.handle()` only for later calls. A tick no longer commits a reply or opens a transaction for you."
