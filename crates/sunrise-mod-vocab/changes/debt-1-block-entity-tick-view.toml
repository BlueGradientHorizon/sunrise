why = "A resident server block entity can be read and edited in place without a payload snapshot, reply, or per-listener savepoint. Taking the Host and borrowing the subject are sequential operations; any later subject loan verifies that the original entity still occupies the same level and state. Every successful storage write follows one save-mark rule. Menu data slots have no synthetic 256-slot cap and BlockEntityDataError::TooManySlots is removed, matching vanilla AbstractContainerMenu.addDataSlots/setData and ClientboundContainerSetDataPacket."
migrate = "Change `fn block_entity_tick(&self, host, event: &mut BlockEntityTickEvent)` to `fn block_entity_tick(&self, event: &mut BlockEntityTickEvent<'_>)`. Instead of reading a handle through `host` or modifying `event.entity` and setting `event.reply`, call `event.subject.with_view(|mut subject| { ... })`. Use `subject.set_data_slot` for existing menu data, `set_data_slots` to initialize or resize it (returning `bool` directly), `set_item_slot` for internal stacks, and `set_nbt` for saved fields. Remove `BlockEntityDataError::TooManySlots` match arms; `BlockEntityRef::set_data_slots` still returns `Result<bool, BlockEntityDataError>` for `Stale` and `Unavailable`. To use another object, return any owned input from the view closure, then borrow `event.subject.host()`. Reborrow using `with_view` and handle `None` instead of writing to the replacement. To commit both subject and neighbor or dropped-item edits together, wrap the sequence in `event.subject.transaction`, recheck any source values after taking the Host, and return `Err` on a stale subject or failed write. Keep `subject.handle()` only for later calls. A tick no longer commits a reply or opens a transaction for you. Menu-data writes through a handle now mark the chunk unsaved just like the view does; those slots remain transient and are not serialized."
