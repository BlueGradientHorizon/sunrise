why = "Start and tick now address the exact running task. A delayed reply cannot finish a different task or peer, and successful completion advances the queue only after commit publishes deferred sends. Task capabilities and errors stay in-process."
migrate = "In start and tick, use event.context.has_channel(host, channel) and event.context.send_payload(host, channel, bytes) in place of event.connection calls. Replace connection.finish(host, task_type), host.configuration_finish(connection, task_type), and event.finished = true with event.context.finish(); replace connection.fail(host, reason) and host.configuration_fail(connection, reason) with event.context.fail(reason). Direct host.configuration_send_payload takes event.context.instance() instead of a connection. Keep event.task_type to identify the registered type and leave event.connection.has_channel unchanged in registration. For delayed completion, save event.context.instance() locally per peer and use context.finish_configuration_task(instance) on the receiving server main-thread configuration handler; use context.reply(channel, bytes) instead of connection.send_payload for its reply. Implement finish_configuration_task on any custom IPayloadContext, returning WrongContext where no server main-thread configuration journal is available. Replace WrongType matches with StaleTask and handle WrongConnection, WrongContext and Disconnected as distinct refusals; missing journal is WrongContext instead of NotRunning. Do not put ConfigurationConnection, ConfigurationTaskRef, ConfigurationTaskContext or ConfigurationTaskError in Wire values."
