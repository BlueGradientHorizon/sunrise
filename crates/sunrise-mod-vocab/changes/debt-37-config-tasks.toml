why = "Each connection owns its tasks, so the same object holds state between start and tick and other mods no longer receive either callback. Empty or duplicate types refuse registration and admission. A delayed reply cannot finish a different task or peer, and successful completion advances the queue only after commit publishes deferred sends. Tasks, capabilities and errors stay in-process."
migrate = "Replace event.tasks.push(ConfigurationTask::new(id)) in register_configuration_tasks with event.register(MyTask { id, ... }); handle ConfigurationTaskRegistrationError (EmptyType or DuplicateType) knowing that any refusal fails admission. The registration event still has connection, player and name. Implement ConfigurationTask for MyTask (Send + 'static); implement task_type(&self) -> &Identifier by returning &self.id. Move the bodies of configuration_task_start and configuration_task_tick into ConfigurationTask::start and optional ConfigurationTask::tick with (&mut self, host: &mut dyn ServerHost, context: &mut ConfigurationTaskContext<'_>). Read self.id instead of event.task_type and keep per-task state on self. In the callbacks use context.has_channel(host, channel) and context.send_payload(host, channel, bytes) in place of event.connection calls. Replace connection.finish(host, task_type), host.configuration_finish(connection, task_type), and event.finished = true with context.finish(); replace connection.fail(host, reason) and host.configuration_fail(connection, reason) with context.fail(reason). Direct host.configuration_send_payload takes context.instance() instead of a connection. Leave event.connection.has_channel unchanged in registration. For delayed completion, save context.instance() locally per peer and use context.finish_configuration_task(instance) on the receiving server main-thread configuration handler; use context.reply(channel, bytes) instead of connection.send_payload for its reply. Implement finish_configuration_task on any custom IPayloadContext, returning WrongContext where no server main-thread configuration journal is available. Replace WrongType matches with StaleTask and handle WrongConnection, WrongContext and Disconnected as distinct refusals; missing journal is WrongContext instead of NotRunning. Do not put ConfigurationTask, ConfigurationConnection, ConfigurationTaskRef, ConfigurationTaskContext or their local errors in Wire values."
