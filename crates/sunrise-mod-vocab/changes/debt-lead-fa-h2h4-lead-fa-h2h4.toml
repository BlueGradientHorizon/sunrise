ids = [
    "trait:Registrar",
    "hook:consume_effect",
    "trait:ConsumeEffectsRegistrar",
    "method:ConsumeEffectsRegistrar::register_consume_effect_type",
    "type:ConsumeEffectType",
    "handle:ConsumeEffectType::new",
]
why = "Vanilla 26.3 ConsumeEffect.CODEC admits the registered type's saved fields before applying the effect; ConsumeEffect.STREAM_CODEC writes the registry ID and that type's stream form. NeoForgeRegistriesSetup syncs this registry and RegistryManager.applySnapshot installs the server's ID map by name. Sunrise validates and retains the admitted Wire value and exact saved fields, and uses the peer's configured ID map, including for stack hashes. A gameplay listener switch does not unload a registered codec."
migrate = "For each custom kind used in a synchronized stack, derive Wire on a struct for its values. In Hooks::register, call register_consume_effect_type(id, ConsumeEffectType::new::<T>(load, save)) on the engine's Registrar. Any direct implementation of Registrar must also implement ConsumeEffectsRegistrar. The type ID must use your mod's owned, non-reserved namespace. load is fn(&Compound) -> Result<T, String> and validates the saved fields at admission; save is fn(&T) -> Result<Compound, String> and returns the canonical NBT fields, whose exact types the effect hook retains. Neither function handles the type dispatch key. Install the mod on both sides; use the same identifier and saved fields in on_consume_effects or death_effects and keep the existing server-side consume_effect listener. Do not send another payload to mirror the effect."
