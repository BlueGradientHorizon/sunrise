ids = ["hook:living_damage_post", "hook:living_death", "hook:living_death_post", "hook:player_died", "hook:player_totem"]
why = "A server player's landing hurt now settles death or totem protection and Post before returning to the block and finishing the landing. This follows vanilla Entity.checkFallDamage and LivingEntity.checkFallDamage, HoneyBlock.fallOn and FarmlandBlock.fallOn, and NeoForge's LivingEntity.causeFallDamage patch and LivingDamageEvent.Post inside the hurt. A trample still happens before the original farmland's superclass damage call."
migrate = "Keep the existing living_damage_post, living_death, living_death_post, player_died and player_totem signatures unchanged. Read the acting body in your death or protection listener if you need the landing position or accumulated fall distance. The distance has not reset yet: HIT_GROUND and the reset now follow Post, before the next accepted move."
