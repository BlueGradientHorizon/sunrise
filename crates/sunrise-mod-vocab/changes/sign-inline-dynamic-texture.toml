ids = ["hook:substitute_inline_images"]
why = """A sign draws the dynamic texture a listener names in substitute_inline_images, as chat and screens do, instead of leaving the sign's text alone: the same one lookup rule (a live dynamic texture of the id, then the GUI atlas) on both faces. The glyph is a quad of its own with that texture bound for its run, lit as the sign's text is and white unless the span has a colour; a texture released after the sign's text was laid out draws the missing texture until the text is laid out again, and one updated in place shows on the next frame without the text being laid out again. hook_version stays 2: version 2 is the meaning that first lets this hook name a dynamic texture, which no release has carried, and this completes it for signs."""
migrate = "Nothing to migrate: a proposal that named a dynamic texture id for a sign run was ignored before and now draws it."
