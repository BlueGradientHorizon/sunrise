why = "Draw, button presses and tooltips belong to the one screen the client window built, not to separate parts attached to a menu type. Replacing or closing that opening drops the callbacks and their state."
migrate = """
Remove screen_draw, screen_click and screen_tooltip from the MenuPart. On the MenuScreen returned by your registered factory, replace screen_draw with .with_draw(move |host, frame, draw| { ... }), screen_click with .with_click(move |host, frame, right| { ... }), and screen_tooltip with .with_tooltip(move |host, frame, slot, lines| { ... }). Use draw instead of event.draw. Read event.origin, event.pointer, event.gui_size, event.at and event.data as frame.origin, frame.pointer, frame.gui_size, frame.at and frame.data. Use the right, slot and lines arguments instead of event.right, event.slot and event.lines. A click still returns Some(button_id) to consume the press and send it to the menu's server, or None to pass. Keep menu_button and menu_button_valid on your server MenuPart.

Read event.menu, event.block and event.pos from open.menu, open.block and open.pos in the factory. Decode open.extra there, and move owned copies of what the callbacks need into them. The frame borrows live integer menu data; it does not carry opening bytes. Omit any builder you do not need. If the MenuPart only handled the old presentation methods, remove the part's registration too.
"""
