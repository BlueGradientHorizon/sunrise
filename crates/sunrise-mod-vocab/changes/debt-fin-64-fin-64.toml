ids = ["hook:render_level_stage"]
why = """
`RenderLevelStage::AfterSky` now fires once immediately after the sky that draws, including a
classic shader pack's replacement sky. This follows vanilla 26.3 `LevelRenderer.addSkyPass`
and NeoForge's `RenderLevelStageEvent.AfterSky` call at the end of that pass, whether the
engine or a custom sky renderer drew it. The classic pack still imports the prepared world
before its sky draws. `AfterLevel` stays after the pack's world passes and before composition
and the engine hand overlay, the counterpart of NeoForge's `AfterLevel` in
`GameRenderer.renderLevel`. The pack's own hand and its `depthtex1` and `depthtex2` inputs
are unchanged (classic shader-pack specification §2.1). Bump `render_level_stage` to version 3.
"""
migrate = """
Keep `Hooks::render_level_stage` and the `RenderLevelStage::AfterSky` match arm as written for
sky-completion work. The arm also runs with a replacement sky, after `prepare_render_buffers`,
and still has `StagePass::None`. Move any early per-view buffer preparation from that arm into
`Hooks::prepare_render_buffers`; it still runs before pass-bearing stages, even without a sky.
No call changes are needed for `AfterLevel`; do not use it as a pre-hand notification for a
pack-owned hand.
"""
