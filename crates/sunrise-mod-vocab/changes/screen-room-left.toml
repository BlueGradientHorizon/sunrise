ids = ["hook:screen_room.left"]
why = "screen_room takes room on both sides of the open container's window: ScreenRoomEvent gains `left` beside `right`, and the window and the recipe book move right by half the left room less half the right room when all of it fits. A left room is measured from the open recipe book's selected tab."
migrate = "Rebuild against this SDK. A mod that only reserves the right keeps writing `event.right`; a mod with a panel left of the window writes `event.left = event.left.max(width)`. Code constructing ScreenRoomEvent or calling fire_screen_room passes the new `left` too."
