why = "ResourceHandler now follows NeoForge’s preferred slot-less overload names. Indexed insert/extract become insert_at/extract_at; insert_any/extract_any become insert/extract. Transfer helpers and stock wrappers live in resource_util, and writes accept an optional enclosing transaction."
migrate = "Rename indexed calls and impl methods to insert_at/extract_at, and slot-less calls and overrides from insert_any/extract_any to insert/extract. Import mod_api::resource_util::move_resources and pass Some(tx) for an enclosing transaction or None to open one. Rebuild native and wasm mods against the updated SDK."

