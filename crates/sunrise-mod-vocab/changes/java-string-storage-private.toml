ids = ["type:JavaString.0"]
why = "JavaString keeps short strings inline and can borrow static UTF-16 units instead of allocating. Its storage is now private; NBT and Wire encodings have not changed."
migrate = "Use units() to read the former .0 field, units_mut() to mutate it, and into_units() to move it out as a Vec<u16>. Replace the tuple constructor JavaString(v) with JavaString::from(v). Conversion from &str and to_string()/to_string_lossy() are unchanged. Published uses.json lists recording JavaString.0 can fail strict fit even for mods that never read it. Regenerate those lists with the corrected SDK use scanner."
