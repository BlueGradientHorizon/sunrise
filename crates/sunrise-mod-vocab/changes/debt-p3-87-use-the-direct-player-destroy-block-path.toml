ids = ["behaviour:player_destroy_block_direct"]
why = "Use the main hand and the checks of vanilla 26.3 ServerPlayerGameMode.destroyBlock and NeoForge CommonHooks.fireBlockBreak, not the packet checks of ServerPlayerGameMode.handleBlockBreakAction. Remove Sunrise's fixed nesting limit. If a break listener already removed the target, do not apply its removal effects again. Each call owns its own drop collection."
migrate = "Keep player.destroy_block(host, pos, into_inventory) and the same break_block signature. Do not use this call to decide whether a mining packet would pass spawn protection, reach or the mining-progress checks: it destroys the target directly, even bedrock in survival, subject to the main-hand item, game mode, game-master permissions and the break_block veto. Do not use false as a nesting-limit signal; callbacks that call destroy_block again on a live target must guard their own reentry. If a listener removes the target, the original call returns false because it did not remove a block itself."
