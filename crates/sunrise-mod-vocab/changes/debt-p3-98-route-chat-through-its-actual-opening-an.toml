ids = ["method:NetworkClientHost::open_chat", "method:NetworkClientHost::send_chat", "hook:chat_recipient"]
why = "Vanilla Gui.setScreen (the screen lifecycle behind Minecraft.setScreenAndShow) and NeoForge ScreenEvent.Opening/Closing govern chat opening, even over an existing screen. LocalPlayer and ChatScreen apply interactive chat restrictions, while ClientPacketListener.sendChat/sendCommand use the ordinary play connection and chat session. PlayerList.broadcastChatMessage logs and delivers through ServerPlayer.sendChatMessage; recipient filtering follows that delivery, rather than suppressing nested messages or relaying a source player's copy as command feedback. NeoForge ServerChatEvent still corresponds to the separate server_chat submission event. A panicking recipient listener is reported and disabled without losing other listeners' decisions."
migrate = "Replace 'close the old screen, wait for Playing, then host.open_chat(text)' with 'host.open_chat(text)'; screen hooks can still veto or replace it. Call host.send_chat(text) for a direct signed send (leading slash selects a command) or host.open_chat(text) for player-controlled input. If you depended on implicit trimming or local visibility refusal from send_chat, trim explicitly or use the screen instead. Keep implementing Hooks::chat_recipient with the same signature (hook version 2); return Flow::Cancel to omit a copy. Only players eligible for player chat are asked, and nested public messages are asked normally. Distinguish your nested message from the one that triggered it rather than expecting a nested command to fail. Public /say and /me no longer appear in the source player's captured command feedback."
