why = "Related menu, live player, entity, block-entity and chunk reads now resolve their handle once (following NeoForge PlayerContainerEvent.getContainer, vanilla AbstractContainerMenu, ServerPlayer/Player via ServerPlayerGameMode.getGameModeForPlayer, Player.isCreative/isSpectator/mayBuild/getAbilities/getFoodData/canEat/getXpNeededForNextLevel and FoodData.needsFood/hasEnoughFood, Entity.position/blockPosition/getYRot/getXRot/getType, BlockEntity.getType/getBlockPos/getLevel, and LevelChunk/ChunkAccess with PalettedContainer.maybeHas) instead of reopening the handle on every getter. Menu reads use the same slot rules as their click route, including the offered stack's component maximum (vanilla Slot.getMaxStackSize(ItemStack)) and the guest's item-part decision for armor (vanilla ArmorSlot.mayPlace and NeoForge IItemExtension.canEquip). A stale handle never lends a replacement window, player, entity, block entity or chunk, and displaced or offline players never lend a live view. BlockEntityRef::with_view reuses the concrete BlockEntityView<'a> read-only (no second view trait), with kind() added and state()/data_slots()/nbt() returning Option so vanilla and mod block entities share one type alongside the mutable resident mod ticker loan. ChunkRef::with_view lends a ChunkView for any resident column (including boundary columns outside the 30 million block bound) and for any valid unloaded in-world chunk without loading it, with is_slime_chunk() returning Option<bool> to keep the world-bound check. Clients keep separate access to menu layout geometry, slot kinds and synchronized merchant offers, and lend a player view only for the local player. Writes, offline UUID settings and OriginalPlayerRef reads are unchanged."
migrate = """Move `menu.container_id(host)`, `menu.kind(host)`, `menu.slot_count(host)`, `menu.slot(host, index)`, `menu.carried(host)`, `menu.slot_backing(host, index)`, `menu.slot_holds(host, index, &stack)`, and `menu.slot_gives(host, index)` into one `menu.with_view(host, |view| { ... })`. Invoke `view.container_id()`, `view.kind()`, `view.slot_count()`, `view.slot(index)`, `view.carried()`, `view.slot_backing(index)`, `view.slot_holds(index, &stack)` and `view.slot_gives(index)` without the host there. A single optional getter needs one `.flatten()` after `with_view` to combine its unavailable case with a stale or unavailable menu; do not flatten the inner empty stack. `view.kind()` returns `Option<&str>` (`None` for the inventory menu, missing registry metadata, or a client view); to retain an owned kind, use `menu.with_view(host, |view| view.kind().map(str::to_owned))`. Copy any borrowed data in the closure and write only after it returns.
Replace `menu.slot_boxes(host)` and `menu.slot_kinds(host)` with `menu.with_client_view(host, |view| view.slot_boxes()).ok().flatten().flatten()` and `menu.with_client_view(host, |view| view.slot_kinds()).ok().flatten().flatten()` to keep the previous Option behavior. Instead of `menu.merchant_offers(host)?`, use `menu.with_client_view(host, |view| view.merchant_offers())?.transpose()?.flatten()` to propagate phase/backend and offer-projection refusals while retaining an empty merchant as `Some(vec![])`. `with_client_view` also inherits the shared `MenuView` reads; its outer `Ok(None)` means the menu did not resolve.
Group `player.game_mode(host)`, `player.is_creative(host)`, `player.is_spectator(host)`, `player.may_build(host)`, `player.abilities(host)`, `player.food(host)`, `player.needs_food(host)`, `player.has_enough_food(host)`, `player.can_eat(host, always)`, `player.experience(host)` and `player.xp_needed_for_next_level(host)` in `player.with_view(host, |view| { ... })`. Inside, call `view.game_mode()`, `view.is_creative()`, `view.is_spectator()`, `view.may_build()`, `view.abilities()`, `view.food()`, `view.needs_food()`, `view.has_enough_food()`, `view.can_eat(always)`, `view.experience()` and `view.xp_needed_for_next_level()` without a host. For a standalone flag or XP read, `player.with_view(host, |view| view.is_creative())` (or the corresponding getter) returns the old `Option`; those getters are plain values once the player resolves. Use one `.flatten()` outside the scope for a standalone `game_mode`, `abilities`, `food`, `needs_food`, `has_enough_food` or `can_eat` read to combine the unavailable-data and unavailable-player cases. `OriginalPlayerRef::experience`, the pickup cooldown, inventory, offline settings and all writes are unchanged.
Move `entity.position(host)`, `entity.block_position(host)`, `entity.rotation(host)` and `entity.kind(host)` into one `entity.with_view(host, |view| (view.position(), view.block_position(), view.rotation(), view.kind()))` (return only the fields you use). For a standalone position read, write `entity.with_view(host, |view| view.position()).flatten()`; for each of the other fields use the corresponding getter and the same `.flatten()`. A stale or unavailable entity never calls the closure; a partial view returns `None` only for the fields it lacks. Rotation stays `[yaw, pitch]` in degrees; block coordinates still floor each component. Compare a `kind()` key directly or call `key.id(host)` (`Option<RegistryName>`) for its name. Read UUIDs, riding, attachments and collections as before; do any writes after the view's closure returns.
Block-entity handle loans (`BlockEntityRef::with_view`): move `entity.kind(host)`, `entity.position(host)`, `entity.level(host)` and `entity.data_slots(host)` into one `entity.with_view(host, |view| { ... })`, which borrows the concrete `BlockEntityView<'_>` read-only for both vanilla and mod block entities. Inside, read `view.kind()`, `view.position()`, `view.level()`, `view.id()`, `view.state()`, `view.data_slots()`, `view.nbt()`, `view.item_slots()` and `view.item_slot(slot)`. On a handle loan, `view.state()` returns `Some(state)` for both vanilla and mod block entities whenever the world block state projects into the mod API (`None` only when unavailable or in a test fake without block state), while `view.data_slots()` and `view.nbt()` return `Some` for mod block entities and `None` for vanilla block entities (whose `view.item_slots()` is `0` and `view.item_slot(_)` is `None`). For a standalone `kind` or `data_slots` read, write `entity.with_view(host, |view| view.kind()).flatten()` or `entity.with_view(host, |view| view.data_slots().map(<[i32]>::to_vec)).flatten()`. Saved NBT snapshots (`data`), locks, names, viewers, item reads and all writes on `BlockEntityRef` are unchanged.
Resident mod ticker loans (`BlockEntityPart::block_entity_tick`, `event.subject.with_view(|mut view| { ... })`): `BlockEntityTickScope::with_view` still lends `BlockEntityView<'_>` mutably only for a resident mod block entity and declines the loan (returning `None` without calling the closure) if the level is not in place, the chunk is unloaded, the block state changed or cannot project into the mod API, or the generation changed. Because `BlockEntityView` is shared with read-only handle loans, `view.state()`, `view.data_slots()` and `view.nbt()` now return `Option` (always `Some` on a live ticker loan). Update ticker calls: replace `let state = view.state();` with `let Some(state) = view.state() else { return; };`; replace `let slots = view.data_slots();` or `view.data_slots().get(i)` with `let slots = view.data_slots().unwrap_or(&[]);` or `view.data_slots().and_then(|slots| slots.get(i).copied())`; replace `let nbt = view.nbt();` or `view.nbt().get("key")` with `let Some(nbt) = view.nbt() else { return; };` or `view.nbt().and_then(|nbt| nbt.get("key"))`.
Move `chunk.loaded(host)`, `chunk.status(host)`, `chunk.is_slime_chunk(host)` and `chunk.sections_with_block(host, block)` into one `chunk.with_view(host, |view| { ... })`. Inside, call `view.loaded()`, `view.status()`, `view.is_slime_chunk()` and `view.sections_with_block(block)` without a host. For a standalone `loaded` check, use `chunk.with_view(host, |view| view.loaded()).unwrap_or(false)`; for `status`, `is_slime_chunk` or `sections_with_block`, append `.flatten()` (`chunk.with_view(host, |view| view.is_slime_chunk()).flatten()` keeps `Option<bool>`, returning `None` for a resident boundary column outside the 30 million block bound). Any resident column and any valid unloaded in-world chunk in an open server level lend a `ChunkView` (an unloaded chunk has `loaded() == false`, `status() == None` and `sections_with_block(_) == None`) so `is_slime_chunk()` never loads the chunk. Watchers, tickets, `resend` and attachments are unchanged."""
