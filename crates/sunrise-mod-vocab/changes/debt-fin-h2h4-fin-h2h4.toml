ids = ["handle:ConsumeEffectType::new", "type:StackWriteError", "hook:consume_effect"]
why = "Vanilla 26.3 ConsumeEffect.STREAM_CODEC resolves the type in the active registry, and ItemStackTemplate.MAP_CODEC and STREAM_CODEC apply the same component patch inside a template. NeoForge syncs consume effect types in NeoForgeRegistriesSetup and applies the server's IDs by key in RegistryManager.applySnapshot. Keep typed values across reconfiguration and use the admitted effects for menu hashes, with the authoritative correction in ServerGamePacketListenerImpl.handleContainerClick. New content and edits reject bad nested payloads. When an existing save is reopened, contain codec failure to the effect and keep the original item and NBT; a panicking codec uses the existing mod-named diagnostics and is disabled for the session."
migrate = "No calls or signatures change. Keep registering each custom kind with register_consume_effect_type(id, ConsumeEffectType::new::<T>(load, save)). Supply valid fields for every registered effect, including those in nested stack templates: a bad nested value now yields StackWriteError::InvalidEffectPayload on a typed write, just as a bad top-level value does. Fix the saved fields or remove the effect before retrying the edit. Returning Err refuses that value without disabling the codec; when reopening an existing save the item is kept, but a refused effect does not run."
