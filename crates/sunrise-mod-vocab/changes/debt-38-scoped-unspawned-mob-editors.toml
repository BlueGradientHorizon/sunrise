- `PendingChildrenRef`, `UnattachedMob`, and `UnspawnedMobRef` are removed and have no `Wire` substitute (they were scoped in-process handles, not serializable payloads); if a mod serialized fields from them, pass owned plain data instead. Remove match arms for `UnspawnedMobError::Expired`, `Ownership`, `Capacity`, and `Budget`, and remove any `Wire` usage of `UnspawnedMobError` or `PendingMobSpec` (and any `NoBackend` reliance on `UnspawnedMobError`). Any `UnspawnedMob` not attached to a slot or list is discarded automatically on drop.\
