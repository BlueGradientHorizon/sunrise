why = """\
Pending-child lease IDs (`PendingChildrenRef`, `UnattachedMob`, `UnspawnedMobRef`), the `PendingChildren` slot arena, per-listener `LISTENER_SERIAL` expiry tracking, parent-staleness aborts, `SPLIT_CAPACITY` (64) / `MAX_SLOTS` / `MAX_DEPTH` caps, and the `UnspawnedMobEdits` / `PendingChildrenEdits` traits (along with `Game::lent_mobs`) were replaced by plain Rust scoped borrows (`UnspawnedMobView<'_>`, `UnspawnedMobEditor<'_>`, `PendingChildEditor<'_>`, `BabyEntitySpawnChild<'_>`, `MobSplitChildren<'_>`) and RAII-owned `UnspawnedMob` values. This matches vanilla 26.3 (`Animal.spawnChildFromBreeding`, `Fox.FoxBreedGoal.breed`, `AbstractCubeMob.remove`, `Mob.finalizeSpawn`, `Mob.checkSpawnRules`, `Mob.getMaxSpawnClusterSize`) and NeoForge (`BabyEntitySpawnEvent.getChild`/`setChild`, `MobSplitEvent.getChildren`, `FinalizeSpawnEvent`, `MobSpawnEvent.PositionCheck`): breeding lends a single optional `AgeableMob` (or `Fox`) child slot (resetting both parents to age 6000 and in-love 0 only on cancel, snapping an accepted child to the live parent at yaw/pitch 0, and skipping finalization without resetting parents on an uncanceled empty slot), mob splitting lends an unbounded ordered child list (including an empty list for primed sulfur cubes above size 1, constructing all surviving children before joining them in order), detached `UnspawnedMob` values carry all unpublished state (UUID, constructor attachments, initialization marker) off-table and clean up on normal Rust drop without an arena or between-listener sweep, and `UnspawnedMobError` and `PendingMobSpec` are no longer `Wire` types.\
"""
