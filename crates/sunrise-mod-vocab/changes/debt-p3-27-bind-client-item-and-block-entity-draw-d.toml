why = "NeoForge's RegisterClientExtensionsEvent.registerItem and ClientExtensionsManager.register report duplicate providers at the registration call. A failed call now leaves other valid models, textures and providers installed. Model identifiers need not belong to the mod that registers them, and binding a native equipment tree has no depth cap, as in vanilla's EntityModelSet.bakeLayer and ModelPart.render. Vanilla's EquipmentLayerRenderer.renderLayers and DyedItemColor.getOrDefault read the worn stack and layer directly, as do NeoForge's IClientItemExtensions dye, tint and texture callbacks. Sunrise now lends those draw inputs: the default dye query reads just the stored override, and resource load binds only the atlas sprites requested by mods. The layer types and render references are local to a draw or resource load, so they no longer implement Wire. A draw refusal affects only that draw; a panic disables that mod's callback for the item for the session. Vanilla's SubmitNodeCollector.submitBlockModel takes an already-resolved BlockState rather than reparsing property pairs each frame; BlockEntityDrawContext::block now takes BlockState directly."
migrate = '''
Rebuild native mods that listen to `register_client_item_extensions` for version 2. Registration method signatures are unchanged. Handle each `Err` from `event.extensions.register_model`, `register_texture` or `client_item_extensions` at that call; do not assume an error undoes earlier successful registrations. Duplicate item registrations name both providers and keep the first. Model names can use a namespace other than the registering mod's.

Keep registering models, textures and providers on each resource load. A stale reference is reported on each use and selects the default for that layer. A refused draw falls back to vanilla for that piece without disabling the provider. If the provider panics, fix the callback and restart the session; reloading resources will not reactivate that mod's provider for that item.

In `armor_layer_model`, `default_dye_color`, `armor_layer_tint_color` and `armor_texture`, replace `stack: &ItemStack` with `stack: &ItemStackView<'_>`. Replace `stack.get(&descriptor)` on the owned callback input with the same call on the view for one stored override. To replace `stack.components()` when you need the whole patch, call `stack.project()`, handle `None` with the callback's default result, then call `owned.components()` on the `ItemStack` you obtained. `get` does not read item defaults. For other borrowed stack views, replace `view.project()?.get(&descriptor)` with `view.get(&descriptor)`.

Replace `layer: &EquipmentLayer` with `layer: &EquipmentLayer<'_>`. `layer.texture` is now the asset's borrowed texture name, not a texture reference; compare it to a name. In `armor_texture`, replace the final argument `default: ArmorTextureRef` with `default_texture: &str` to inspect the renderer's choice, and replace `return default` with `return ArmorTextureRef::DEFAULT` to keep it. To override it, return the reference from `event.extensions.register_texture(name)` for this load. Do not register default textures merely to inspect them. Do not derive or call Wire with `EquipmentLayerType`, `EquipmentLayer<'_>`, `ArmorModelRef` or `ArmorTextureRef`; keep draw inputs in the callback and reacquire texture and model references on reload.

The engine-only `Attached::__client_item_extensions` binding and its `enabled()` method are removed; mods attach providers through `event.extensions.client_item_extensions(item, Arc::new(provider))` as before.

In `BlockEntityDrawContext::block`, replace `draw.block(block_key, &[("prop", "val")])` with `draw.block(state)` using a resolved `BlockState`. Resolve static states once via `BlockState::of(&host.block_states(), block_key, &[StateConstraint::new("prop", "val")])` (or pass `event.state` directly when drawing the block entity's own state).
'''
