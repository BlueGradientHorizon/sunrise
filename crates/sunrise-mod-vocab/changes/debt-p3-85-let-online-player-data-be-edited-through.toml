why = """
Vanilla 26.3 Player.setLastDeathLocation and getEnderChestInventory, Inventory.setItem and setSelectedSlot, LivingEntity.setItemInHand, ItemCooldowns.addCooldown and removeCooldown, GiveCommand.giveItem and ServerPlayer.setRespawnPosition operate on the resident player without a liveness check. NeoForge's LivingEntity.setItemSlot and ServerPlayer.setRespawnPosition retain their equip and spawn callbacks. The shared borrow now checks availability, not health. EntityRef::game_event and LevelRef::game_event can emit with a dead resident player as source (Entity.gameEvent and ServerLevel.gameEvent); ItemPlace::on_crafted_by can write a processed map back to that player's menu slot or cursor (ItemStack.onCraftedBy). Actual menu clicks still check liveness at ServerGamePacketListenerImpl.handleContainerClick.

Vanilla PlayerList.respawn and NeoForge's PlayerRespawnPositionEvent decide the destination with the old player before installing the replacement. ServerPlayer.restoreFrom keeps last-death location and the ender chest, and copies the inventory and its selection only with keepInventory or in spectator mode. The replacement starts with fresh item cooldowns and no experience pickup delay. ClientPacketListener.handleRespawn creates a new local inventory, and the carried-slot packet synchronizes it with the server. NeoForge's PlayerRespawnEvent runs after the death Respawn packet for the final destination, including a redirect across levels.
"""
migrate = """
Remove `PlayerDataRefusal::Dead` and `PlayerWorldRefusal::Dead` match arms. Keep handling `Stale` for missing, stale or temporarily unavailable players. If a payload encoded `PlayerDataRefusal` directly, replace it with a mod-defined Wire type and convert explicitly. If you encode `PlayerWorldRefusal` in a payload, rebuild both sides for its new shape without `Dead`.

Keep calling the same setters and operations on the resident player, including `set_last_death_location(host, Some(pos))` or `None`, hand and inventory writes, `give_stack`, and the cooldown setters. Death no longer causes these calls to refuse. `EntityRef::game_event`, `LevelRef::game_event` with a player source, and `ItemPlace::on_crafted_by` also no longer refuse just because that player is dead. If you used a false, empty or refused result as a liveness check, first require `player.living().alive(host) == Some(true)` before performing your own action.

Use `player_respawn_position` to choose the destination; it always sees the old body on death, even if chunks had to load. Move writes intended for the replacement (such as an inventory slot, item cooldown or experience pickup delay) from `player_respawn_position` to `player_respawned`. The latter runs once the final destination is in place and sent, so a redirect no longer delivers a second respawn that clears the new cooldown. If your manifest pins either hook, request `hook_version = 2` for that hook. `PlayerRef::respawn` still requests a respawn; observe its completion in `player_respawned` rather than assuming the destination was already loaded when the request returned.
"""
