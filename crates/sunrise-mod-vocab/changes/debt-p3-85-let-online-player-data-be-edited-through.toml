why = "Vanilla 26.3 Player.setLastDeathLocation and getEnderChestInventory, Inventory.setItem and setSelectedSlot, LivingEntity.setItemInHand, ItemCooldowns.addCooldown and removeCooldown, GiveCommand.giveItem and ServerPlayer.setRespawnPosition operate on the player without a liveness check. NeoForge's LivingEntity.setItemSlot and ServerPlayer.setRespawnPosition retain their equip and spawn callbacks. A resident player can be edited during death while real action checks such as ServerGamePacketListenerImpl.handleContainerClick still apply. ServerPlayer.restoreFrom copies last-death location and the ender chest, and copies inventory only with keepInventory or for a spectator; the replacement player starts with fresh cooldowns. The borrow now checks availability, not health."
migrate = """
Remove `PlayerDataRefusal::Dead` and `PlayerWorldRefusal::Dead` match arms. Keep handling `Stale` for missing, stale or temporarily unavailable players; death alone is not a refusal. `PlayerDataRefusal` is in-process only: if your own payload encoded it directly, define a Wire type for the fields and cases you want to send and convert to it explicitly.

Use the same setter calls (including `set_last_death_location(host, Some(pos))` or `None` to clear) on the current player; do not wait for respawn just to bypass the former dead-player refusal. Use `with_inventory` or `with_ender_chest` to observe the edit; writes to a hand are writes to the selected hotbar slot or offhand. To set an item or a cooldown on the replacement regardless of death's copy policy, write it in `player_respawned` instead. Remove any reliance on `false` or `None` to detect death from these methods; check liveness separately when your own action needs it. Real gameplay admission and player identity checks still apply.
"""
