ids = [
    "method:prelude::WorldEditServerHost::read_columns",
    "type:ColumnBlocks",
    "type:ColumnBlocks.tints",
    "type:ColumnBlocks.water_colors",
]
why = """
In vanilla Minecraft 26.3, the grass, foliage, and dry-foliage colormaps are client-only resources
loaded by GrassColorReloadListener, FoliageColorReloadListener, and DryFoliageColorReloadListener
from assets/minecraft/textures/colormap/{grass,foliage,dry_foliage}.png (which server.jar does not
ship), while BiomeSpecialEffects.waterColor (JSON water_color) is server-side biome data. Vanilla
resolves blended biome tints on the client in ClientLevel.getBlockTint / calculateBlockTint (and
BiomeColors.getAverageGrassColor / getAverageFoliageColor / getAverageDryFoliageColor /
getAverageWaterColor), with NeoForge posting RegisterColorHandlersEvent.ColorResolvers in
ColorResolverManager.init and installing client caches for registered resolvers in
ColorResolverManager.registerBlockTintCaches.

ServerHost::read_columns previously returned colormap-derived grass and foliage tints alongside
water colours in ColumnBlocks::tints (3 entries per column), forcing the server to load client
colormap PNGs and exposing unblended tints that disagreed with what players see. ColumnBlocks now
carries only water_colors (one 0xRRGGBB biome JSON water colour per column, 0 where unloaded), the
server loads biomes without requiring colormap textures, and client mods read blended tints through
the existing client tint APIs: BlockAndTintGetter::block_tint in block tint callbacks and
ClientHost::block_tint_color for drawn block and fluid faces in other client hooks.
"""
migrate = """
- Replace reads of `column_blocks.tints[i * 3 + 2]` with `column_blocks.water_colors[i]` (`0xRRGGBB`,
  `0` where the column is not loaded).
- Remove server-side reads of grass and foliage tints from `ColumnBlocks::tints[i * 3]` and
  `tints[i * 3 + 1]`. On the client:
  - Inside `BlockTintSource` callbacks (`color_in_world`, `color_as_terrain_particle`), call
    `level.block_tint(pos, ColorResolver::Grass)`, `ColorResolver::Foliage`,
    `ColorResolver::DryFoliage`, `ColorResolver::Water`, or a mod `ColorResolver` registered in
    `register_color_resolvers` (`BlockAndTintGetter::block_tint`, opaque ARGB `0xFF00_0000 | rgb`
    blended over the biome blend radius).
  - In other client hooks (World phase), call `host.block_tint_color(state, tint_index, pos)` on
    `ClientHost` for a drawn block or fluid face's `0xRRGGBB` tint (for example, a face's
    `FaceSprite::tint_index` or tint index `0` on `minecraft:grass_block`, `minecraft:oak_leaves`,
    `minecraft:leaf_litter`, or `minecraft:water`), which applies biome blending together with
    active resource pack `biome_colors` and Polytone colormaps.
- Update any literal construction or exhaustive destructuring of `ColumnBlocks` to use
  `water_colors` instead of `tints`.
"""
