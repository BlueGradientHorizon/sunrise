why = "Profile and server reads lend the current text instead of copying it. The profile retains login order, and the server retains only a redacted display address for mods. The applied language code is a shared snapshot that can outlive a language change."
migrate = """
`player.profile(host)` returns `Option<GameProfile<'_>>`. Compare `profile.name` directly with a string literal, and replace `profile.properties.iter()` or iteration over the old `Vec` with `profile.properties()`. For indexing, use `profile.properties().nth(index)`; for a count, use `profile.properties().len()`. Each `ProfileProperty<'_>` has `name: &str`, `value: &str` and `signature: Option<&str>`, so compare `signature` directly instead of calling `.as_deref()`. The UUID is unchanged. To retain the profile, copy its name and collect `profile.properties().map(|p| (p.name.to_owned(), p.value.to_owned(), p.signature.map(str::to_owned))).collect::<Vec<_>>()` while the host is borrowed. Replace `GameProfile::new` and `ProfileProperty::new` in mod-owned fixtures or data with your own owned records; only the game creates the borrowed profile view.
`host.client_session().client_server()` returns `Option<ClientServer<'_>>`. Use `server.name`, `server.address` and `server.save_folder` as `Option<&str>` directly instead of calling `.as_deref()`, or use `.map(str::to_owned)` on a field to keep it after the host borrow. In a literal for a borrowed `ClientServer<'_>`, pass `Some("name")` or `Some(name.as_str())` instead of `Some(String)`.
`host.client_session().client_language()` returns `Option<Arc<str>>`, not `Option<String>`. Use `.as_deref()` to compare the option with a string literal, keep the `Arc` for an immutable snapshot, or convert with `.map(|code| code.to_string())` when an owned `String` is required.
`GameProfile`, `ProfileProperty` and `ClientServer` no longer implement `Wire`; to send any of this data in a typed payload, copy just the needed fields into a mod-owned `#[derive(Wire)]` payload type.
"""
