why = "The player-health hook chooses a renderer instead of returning buffered commands. The renderer draws in the answering mod's scope between layer Pre and Post, and a rejected group falls back to vanilla without leaving partial draws."
migrate = "Change Hooks::health_hud to take &dyn ClientHost and &mut HealthHudEvent<'_> and return Option<HealthHudReplacement> instead of Option<Vec<GuiDraw>>. Keep returning None to defer. At setup, create HealthHudReplacement::new(|host, inputs, canvas| { ... }) and keep it with your listener. Replace the old GuiDraw pushes with calls on canvas, propagating errors with ?; move any per-frame reads into the callback or capture owned shared state at setup. Keep using event.wi and event.hi in selection, or use canvas.size() while drawing. Return Some(self.renderer.clone().with_status_top(top)) if the status rows have a highest logical GUI y coordinate that should reserve overlay space. Return Some(self.renderer.clone()) without a declared top to reserve nothing. Replace Some(Vec::new()) with a replacement whose callback returns Ok(()) without drawing; returning Err instead rolls back and draws vanilla."
