ids = ["hook:player_commands_sent", "type:PlayerCommandsSentEvent", "method:Hooks::player_commands_sent", "type:CommandTreeFilter", "method:CommandTreeFilter::root_names", "method:CommandTreeFilter::hide_where", "type:CommandTreeSelection", "fn:sunrise_client_lib::lan::hub::Hub::set_mod_commands", "fn:sunrise_client_lib::lan::hub::Hub::send_permission_level"]
why = "Vanilla Commands.sendCommands and fillUsableCommands build the usable tree from the live ServerPlayer just before sending it; ClientboundCommandsPacket.enumerateNodes numbers the outgoing graph. NeoForge Commands.sendCommands uses CommandHelper.mergeCommandNode for redirects, not a filter event. Sunrise now lends the recipient and the actual permission-filtered tree on every send, rather than retaining last-send names. It omits selected branches and aliases to them without changing the executable dispatcher."
migrate = "Change Hooks::player_commands_sent to take &dyn Host and &mut PlayerCommandsSentEvent<'_> and return Option<CommandTreeSelection>. Use event.player.uuid() instead of the old UUID and event.player.name(host) instead of event.name. Replace event.names.retain(|name| keep(name)) with returning event.tree.hide_where(|name| !keep(name)); return None for no exclusions. Use event.tree.root_names() to inspect the ordered permitted roots. Do not cache a previous answer: every send is filtered independently. Installs targeting the unstable Hub::set_mod_commands must move to the operation they intend to observe: use Hub::send_permission_level for the permission event; use game::native_hooks::base::Game::native_player_commands_sent for the per-player tree filter. Report installation no longer sends packets and is not a replacement point."
