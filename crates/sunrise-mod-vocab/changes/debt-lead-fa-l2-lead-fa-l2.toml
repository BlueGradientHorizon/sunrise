why = "A configuration send keeps its exact Configuration epoch rather than binding to Play after ServerConfigurationPacketListenerImpl.handleConfigurationFinished; task completion does not gate sends, as in startNextTask and NeoForge ICustomConfigurationTask.start. Client startup and resource reload preflight the generation before running any listener applies (vanilla SimpleReloadInstance's preparation barrier). Model and atlas publication occurs at the model manager anchor, following vanilla ModelManager.apply and NeoForge's ModelManager.apply patch calling ClientHooks.onModelBake after installing the new models. World open and live content-mod reload report the same complete, cycle-safe cause chain as /reload (vanilla WorldLoader.load and NeoForge's WorldLoader patch preserve the resource load failure)."
migrate = """
- Keep `context.send_payload(host, &channel, bytes)` and `host.configuration_send_payload(connection, &channel, bytes)` during Configuration, including after the task finishes. If a saved `ConfigurationConnection` has advanced to Play, handle `ConfigurationTaskError::Disconnected`; to send in Play, call `player.send_payload(host, &channel, bytes)` with the admitted player's `PlayerRef` instead.
- Keep `register_client_item_extensions`'s signature (v2). Register against the candidate sprites, before any listener applies; do not read data that the same reload's apply will publish. Refused preparation discards the candidate without applying listeners on either side of the model manager.
- Keep `texture_atlas_stitched` and `model_baking_completed`'s signatures (both v2). These hooks fire at `VanillaClientListeners::model_manager()` during initial load and later reloads, before an apply explicitly ordered after that anchor. Resolve model/sprite handles at these hooks as before. If your hook needs work that used to run in an after-model listener's apply, use its prepared data, or consume the published result in `client_setup` or `client_resources_reloaded` as appropriate. Listener dependencies still target `VanillaClientListeners::model_manager()` and retain the all-prepares-success barrier.
"""
