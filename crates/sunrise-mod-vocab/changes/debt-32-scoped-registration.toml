ids = ["hook:component_types", "hook:component_types.types", "method:Hooks::component_types", "type:ComponentTypesEvent", "type:ComponentTypesEvent.types", "handle:ComponentTypesEvent::register"]
why = "Component registration appends through the event method instead of exposing the staging vector. Earlier declarations cannot be edited by another listener, and a phase refusal drops only the refused listener's additions. Startup ID validation and freezing are unchanged."
migrate = "In Hooks::component_types, replace event.types.push(id) with event.register(id) and pass the same owned String (for example, event.register(\"mymod:charge\".into())). To submit several IDs, call event.register(id) for each in order. Reading, replacing or removing earlier entries has no replacement."
