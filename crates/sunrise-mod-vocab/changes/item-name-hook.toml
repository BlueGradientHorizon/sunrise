ids = ["hook:item_name", "type:ItemNameEvent"]
why = "Adds the both-sides ItemPart item_name hook, version 1: vanilla's Item.getName(ItemStack) for a mod item, so one item names each stack from its components (Hostile Neural Networks' data models and predictions, filled containers). An answer replaces the default name (the item_name component, else the item's), a custom_name still wins, and every place that names a stack reads it: tooltips, the held item's name, command feedback, the anvil, stats, recipe screens and Host::hover_name."
migrate = "Nothing to migrate. Attach an ItemPart to the item and implement item_name: set event.name to Some(Text::translatable(...)) from the stack's components. Writing minecraft:item_name into each stack the mod builds can go."
