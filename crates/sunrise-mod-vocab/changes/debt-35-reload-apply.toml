ids = [
    "trait:ReloadApply",
    "method:ReloadApply::apply",
    "handle:ReloadApply::new",
    "trait:ServerReloadListener",
    "method:ServerReloadListener::prepare",
    "trait:ClientReloadListener",
    "method:ClientReloadListener::prepare",
]
why = "Prepared reload work is now an owned action, not a shared listener object. The runner consumes it once on the owning thread in the same order, after all prepares succeed. A failed prepare discards pending actions; a refusal after apply cannot undo their effects."
migrate = "In either reload listener's prepare method, replace `Result<Box<dyn ReloadApply>, ReloadResourceError>` with `Result<Box<dyn FnOnce() + Send + 'static>, ReloadResourceError>`, and replace `Ok(<dyn ReloadApply>::new(move || { ... }))` with `Ok(Box::new(move || { ... }))`. Remove the ReloadApply import. If you implemented ReloadApply for a struct, move the prepared struct into a closure and perform its publication there. In tests that invoke a returned action directly, replace `action.apply()` with `action()`; this consumes it."
