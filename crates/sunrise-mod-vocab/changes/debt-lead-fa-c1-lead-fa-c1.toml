ids = ["type:EntityRenderAttachments", "type:EntityRenderState.attachments", "handle:EntityRenderAttachments::get", "method:prelude::ModStateHost::attachments"]
why = "Following vanilla ChunkMap.addEntity, ServerEntity.addPairing and ClientPacketListener.handleBundlePacket and NeoForge AttachmentSync.syncInitialEntityAttachments and syncEntityUpdate, a viewer held for proxy handoff receives initial pairings even between tracking passes, and receives changes and removals for entities and other players it tracks. Vanilla PacketDecoder, Connection.exceptionCaught and PacketBundlePacker, and NeoForge SyncAttachmentsPayload.STREAM_CODEC, reject a malformed attachment envelope whether or not it is bundled. Sunrise stages valid attachment values through the same NbtIo.readAnyTag decoder used for eager values, retaining runs of empty compounds and one shared array backing instead of charging the expanded maps or retaining extra copies of large arrays. Attachment send refusals are logged on each occurrence, not suppressed for the rest of the connection. Main payloads use the same epoch check and refusal handling inside and outside a bundle, following NeoForge MainThreadPayloadHandler and ClientPayloadContext.enqueueWork."
migrate = "No call or wire format changes. Keep reading `state.attachments` and `snapshot.get(&KEY)` in renderers, or `KEY.get(host, holder)` via `Host::attachments` for synced holders such as another player. Those same reads may now observe updates or removals before placement; draw your default when the next render snapshot returns `Ok(None)` after a removal. Do not request a resync on placement."
