ids = ["type:EntityRenderAttachments", "type:EntityRenderState.attachments"]
why = "Following vanilla ServerEntity.addPairing and ClientPacketListener.handleBundlePacket and NeoForge AttachmentSync.syncEntityUpdate, a viewer that already tracks an entity or another player receives attachment changes and removals even while held for proxy handoff. PacketBundlePacker and SyncAttachmentsPayload.STREAM_CODEC frame and validate the complete bundle before handing it to the listener: Sunrise stages decoded attachment fields compactly so values that expand into large NBT maps still fit under the existing queue accounting, without decoding them again at delivery. Attachment send refusals are logged on each occurrence, not suppressed for the rest of the connection. Main payloads use the same epoch check and refusal handling inside and outside a bundle, following NeoForge MainThreadPayloadHandler and ClientPayloadContext.enqueueWork."
migrate = "No call or wire format changes. Keep reading `state.attachments` and `snapshot.get(&KEY)`; after a synced field is removed, draw your default when the next snapshot returns `Ok(None)`, including for viewers still held after pairing. No extra resync on placement is needed."
