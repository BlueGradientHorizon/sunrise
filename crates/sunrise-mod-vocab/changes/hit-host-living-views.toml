ids = ["method:HitHost::victim", "method:HitHost::causing", "type:LivingView", "type:AttachmentError.ReadOnlyHolder"]
why = "Adds the hit's living victim and causing entity to HitHost, as NeoForge's LivingIncomingDamageEvent.getEntity and DamageSource.getEntity: host.victim() and host.causing() lend a read-only LivingView whose reads take the LivingRef reads' names, arguments and answers (health, absorption, max_health, effect, effects, potion_affected, attribute_value, with_hand_item, and no_ai as MobRef::no_ai) and answer from the entity's live body at the call. The causer is the attacker the hit already lends for its random. view.holder() names the entity's attachments, which the hit's host reads with has and get_existing; a store refuses with the new AttachmentError::ReadOnlyHolder and writes nothing."
