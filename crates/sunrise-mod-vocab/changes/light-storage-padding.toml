ids = ["method:LevelHost::can_see_sky"]
why = "Light reads follow vanilla's light storage at the build range and around unloaded columns, so the documented rule is now what the game does: the padding sections one above and one below the range answer with their stored light, a missing section below a stored one repeats that section's bottom row, a column the level no longer holds keeps its last light where a neighbouring non-air section touches it, and a level without skylight reads sky 0 everywhere. Signatures and the documented contract are unchanged; `can_see_sky` and the brightness reads return vanilla's values where the game used to answer full sky above the range, darkness below it and full sky in every missing column."
migrate = "Rebuild against this SDK. A mod that read light above or below the build range, or in a column that is not loaded, gets vanilla's answer."
