ids = ["method:CrashSection::value", "method:CrashSectionsRegistrar::crash_section", "method:CrashSectionsRegistrar::crash_header"]
why = "FML CrashReportCallables and NeoForge CrashReportExtender.extendSystemReport send each active callable to the regular report. Vanilla 26.3 SystemReport.setDetail and CrashReportCategory.setDetail keep the full text and put a failure on its own entry. The defensive formatter introduced in aaefc52ce6d0 clipped labels and text and skipped every callable from the mod named in the crash. Keep that mod's valid diagnostics, and isolate a panic using the existing retained callback boundary without holding up the report or hiding other replies."
migrate = "Keep implementing CrashSection::value and registering through r.crash_section(label, callback) or r.crash_header(callback). None still omits the entry; Some(text) now writes the full text including line breaks. Entries still appear in registration order, but callbacks may run concurrently, so read diagnostic state independently instead of depending on a previous callback having run. Only a callback that panics is disabled for the session."
