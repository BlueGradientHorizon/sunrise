why = """
Vanilla 26.3 `MenuScreens.register` and NeoForge `RegisterMenuScreensEvent.register` allow one factory per menu type. Vanilla `HopperMenu` demonstrates that a distinct menu type can expose the same five backing slots and player inventory. Vanilla `Slot.mayPlace`, `Slot.mayPickup` and `AbstractContainerMenu.doClick`, and NeoForge `ResourceHandlerSlot`, use the menu's slot rules for pickup and placement, including when a resource handler owns storage.

NeoForge `RegisterGuiLayersEvent.register` checks for duplicate IDs, not for a reserved namespace. HUD layer registrations and retained callbacks use the shared panic diagnostic so a failing mod does not stop other listeners or layers.

Vanilla `KeyMapping.setDown` and `click` and NeoForge `KeyMappingLookup` update the same slots that `Minecraft.handleKeybinds` and `Gui.handleKeybinds` consume. `Gui.setScreen` releases the live mappings, including unconsumed plain-key clicks.
"""
migrate = """
Replace `register_menu_screen("minecraft:hopper", factory)` for your block's custom screen with a distinct type: declare `data/mymod/sunrise/menu/hopper_menu.json` with `slots: 5` and `player_inventory: true`, set the block's `ModContainer` to five slots with `menu: Some("mymod:hopper_menu".into())`, and call `register_menu_screen("mymod:hopper_menu", factory)`. Declare `data_slots` for any synchronized values the screen reads. To match the stock hopper layout, place the five slots at `[44 + 18 * i, 20]` and the player inventory at `[8, 51]`.

Replace `menu_slot_exclusions(menu, opener, &[2, 3, 4])` with a `MenuPart` attached to that menu type. In `menu_slot_rules`, if `event.container == MenuContainer::Main` and `event.slot` is 2 through 4, set both `event.may_place` and `event.may_pickup` to `false`. This governs clicks and quick moves, including for `ItemPlace` backing. Use `None` in `MenuScreenLayout.slots` for these indices only to hide them on the client.

`register_gui_layers` v5 has no signature change. An unused `minecraft:` ID is valid; duplicate IDs (including vanilla's own) still fail. Register layers in order as before. A refused or panicking registration batch publishes none of that listener's pending edits.

Keep calling `mapping.set_down(host, down)`, `mapping.is_down(host)` and `mapping.click(host)`; read the live mapping rather than the physical binding to observe a forced release. Do not assume `click(host)` opens chat, inventory or another screen inside a callback: keybind actions run in the client tick.
"""
