why = "Mod GUI commands no longer need to be buffered and replayed. Pose and blend are in-process draw arguments; the full draw context now scopes clips so a listener cannot leave one open for the next draw."
migrate = """
Replace draw.push_clip(rect)?; ...; draw.pop_clip()? with draw.with_scissor(rect, &mut |clipped| { ... })? and use clipped for every draw in the body. The callback returns (), so handle draw errors inside it. GuiClipRefusal::NoneOpen is gone; handle NotFinite or TooDeep on with_scissor. A custom DrawContext implementation now implements with_scissor instead of push_clip and pop_clip. For a fallible group of GUI primitives, use draw.draw_gui(&mut |canvas| canvas.scope(&ops, Some(rect), &mut |clipped| { ...; Ok(()) })).
Replace draw.gui_paint(&commands) with draw.draw_gui(&mut |canvas| { ...; Ok(()) }). Replace each Push(ops) through its Pop with canvas.scope(&ops, None, &mut |child| { ...; Ok(()) }). Use canvas.fill or fill_gradient([x0, y0, x1 - x0, y1 - y0], ...) and canvas.text(&text, [x, y], color, shadow). Use canvas.blit_sprite(name, [x, y, w, h], region.map(|[sw, sh, u, v]| GuiSpriteRegion { size: [sw, sh], offset: [u, v] }), color, blend), canvas.atlas_sprite(name, [x, y, w, h], color), or canvas.blit(texture, [x, y, w, h], GuiBlitRegion { uv, src, tex }, color, blend), respectively. Destination coordinates are f32 GUI pixels. For Item, read a stack from inventory_slots (0 through 8, or 40 for off hand), draw canvas.item(&stack, [x, y], seed) in the model's pose scope, and call canvas.item_decorations(&stack, [x, y], None) on its parent after restoring the pose.
Replace GuiPaintError matches with GuiDrawError at the draw call: Text stays Text, ItemNotFinite becomes NotFinite, unknown textures and sprites become UnknownTexture or UnknownSprite, bad sizes become BadBlitRegion or BadSpriteRegion, and a non-finite UV becomes NotFinite. SpriteBlend becomes UnsupportedSpriteBlend. Skip an absent inventory stack instead of matching ItemSlot. Use ? in the callback to discard the entire group on refusal. PoseOp and Blend keep their imports and variants; stop using Wire to encode or decode them and pass them directly to canvas.scope and the blit methods.
"""
