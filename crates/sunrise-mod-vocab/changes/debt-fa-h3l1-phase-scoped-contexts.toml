why = "Runtime load-phase gating (`ModPhase`, `PhaseOwner`, `check_access`, `PhaseRefusal`) is replaced by compile-time phase-scoped context traits, bumping each affected lifecycle hook from version 1 to version 2. All four config hooks (`register_configs`, `config_loading`, `config_reloading`, `config_unloading`, following NeoForge's `ModConfigEvent`) take `&dyn ConfigContext`; server/shared reload hooks take `&dyn ReloadContext`; `add_client_reload_listeners` (`AddClientReloadListenersEvent`) takes `&dyn ClientReloadListenerContext` (exposing only facts known on both initial startup and later reloads, plus `published() -> Option<&dyn ClientReloadHost>` which is `None` on startup and `Some` on later reloads); `client_resources_reloaded` takes `&dyn ClientReloadHost`; and `client_setup` (`FMLClientSetupEvent`) takes `&mut dyn ClientSetupContext` (including non-world setup audio/effects, sound/key-mapping handles, and window/view/screen options) without world handles or transactions. NeoForge's AddPackFindersEvent lends repository-specific operations, so Sunrise's version 2 also lends a discovery context rather than HostSide. Vanilla StateDefinition.getProperties, Fluid.getStateDefinition and ItemStack.isDamageableItem/hasFoil/isValidRepairItem read registry or stack metadata without loaded chunks; NeoForge TagsUpdatedEvent.getRegistries similarly lends registry access. Those reads remain available in setup and reload, while lit_block_name stays on the live level host area."
migrate = "Update hook parameter types (all bumped from version 1 to version 2): `&dyn ConfigContext` for `register_configs`, `config_loading`, `config_reloading`, and `config_unloading`; `&dyn ReloadContext` for `add_server_reload_listeners`, `data_maps_updated`, `default_components_bound`, and `tags_updated`; `&dyn ClientReloadListenerContext` for `add_client_reload_listeners` (calling `context.published()` when published client assets are needed on later reloads); `&dyn ClientReloadHost` for `client_resources_reloaded`; and `&mut dyn ClientSetupContext` for `client_setup`. In `tags_updated` and `data_maps_updated`, inspect `event.cause` instead of matching `HostSide`, and read data maps with `context.data_map(&key, &MAP)`. Replace `add_pack_finders`' `HostSide` argument with `&dyn PackDiscoveryContext`; use `event.packs.pack_type()` to select the repository, `context.text_string(&text)` for local text and `context.client_text()` for font reads when available. Pack registration is unchanged. Drop custom `AccessRefusal::unavailable` implementations: the old runtime phase check no longer calls them. In setup and reload keep `context.block_states()`, `context.fluid_states()` and `resource.{damageable,foil,repairable}(context, ...)` instead of requiring a full Host. `host.lit_block_name(pos)` remains a live read; update explicit `BlockStatesHost::lit_block_name(host, pos)` calls and imports to `LevelsHost::lit_block_name(host, pos)`, and do not call it from a phase context."
