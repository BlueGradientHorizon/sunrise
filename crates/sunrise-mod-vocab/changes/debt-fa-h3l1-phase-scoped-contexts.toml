why = "Runtime load-phase gating (`ModPhase`, `PhaseOwner`, `check_access`, `PhaseRefusal`) is replaced by compile-time phase-scoped context traits. Config hooks take `&dyn ConfigContext`, server/shared reload hooks take `&dyn ReloadContext`, client reload hooks take `&dyn ClientReloadHost`, and `client_setup` takes `&mut dyn ClientSetupContext`, so world handles and transactions are absent at compile time."
migrate = "Update hook parameter types to `&dyn ConfigContext` (`register_configs`, `config_loading`), `&dyn ReloadContext` (`add_server_reload_listeners`, `data_maps_updated`, `default_components_bound`, `tags_updated`), `&dyn ClientReloadHost` (`add_client_reload_listeners`, `client_resources_reloaded`), and `&mut dyn ClientSetupContext` (`client_setup`). In `tags_updated` and `data_maps_updated`, inspect `event.cause` instead of matching `HostSide`, and read data maps with `context.data_map(&key, &MAP)`."
