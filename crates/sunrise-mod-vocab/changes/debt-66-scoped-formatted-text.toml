why = "Native mods can visit formatted text or paint a wrapped component in scope, as in vanilla’s FormattedCharSequence.accept and GuiGraphicsExtractor.textWithWordWrap. Drawing uses the same wrapping and visual order as measurement without building API-owned lines to replay. In-process output no longer has a line or character budget."
migrate = '''
To paint, replace `draw.text_lines` and the loop drawing its lines with `canvas.text_with_word_wrap(&text, at, TextLayoutSpec { max_width, align, scale }, argb, shadow)?` inside `draw.draw_gui`. Position and dimensions are already in scaled local GUI pixels: do not divide the returned positions by scale or apply a second scale pose. Use the returned `TextLayoutSize` for the label's width and height. The canvas reports invalid width or scale as `GuiDrawError::TextLayout`; geometry and component representation refusals still use the canvas's existing errors.

For reads outside drawing, use `host.visit_text_lines(&text, spec, &mut |line| { ... })`. Read its logical-order, legacy-resolved text, scaled offset, and width in the visitor. Clone `line.text` explicitly if retaining it. Handle `TextLayoutError` for invalid width or scale; remove matches on the old output count refusals.

Replace `host.text_visual_order(&text)` with `host.visit_text_visual_order(&text, &mut |character| { ...; true })`. The visitor may return `false` to stop. Each character still has a Unicode scalar, effective style and run-local UTF-16 offset. The style is lent to the visitor; `character.to_owned()` retains it. These local values no longer implement Wire.
'''
