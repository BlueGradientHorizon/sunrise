why = "Removed ScheduleError::NotInMod and the owner-identity gate on ModStateServerHost::cancel_task, stopped clamping delay_ticks == 0 to 1, added a server_tick_end drain pass with a scheduling cutoff to prevent same-drain recursion, and logged a warning naming the mod when MAX_PENDING_TASKS is hit, matching vanilla net.minecraft.server.MinecraftServer#wrapRunnable, TickTask, waitUntilNextTick/runAllTasks, and pollTask (and NeoForge NeoForgeEventHandler's 0-tick TickTask scheduling)."
migrate = "Remove match arms on `ScheduleError::NotInMod` (calls outside an active mod callback now succeed). Treat `TaskId` as an opaque cancellation capability: `host.cancel_task(id)` cancels any waiting task for that id without requiring the same mod identity. Pass `delay_ticks = 1` instead of `0` if you relied on `0` being deferred to the next tick, because `delay_ticks = 0` now runs in the current tick (drained after `server_tick` start and end)."
