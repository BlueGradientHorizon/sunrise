why = "Removed ScheduleError::NotInMod and the owner-identity gate on ModStateServerHost::cancel_task, made TaskId opaque with globally unique IDs that never alias across world resets, ensured cancel_task drops detached captures under the scheduling owner's attribution, kept MAX_PENDING_TASKS as a per-mod limit only (logging a warning naming the mod) without capping unattributed callers, stopped clamping delay_ticks == 0 to 1, and drained due tasks to exhaustion at both server_tick start and end, matching vanilla net.minecraft.server.MinecraftServer#wrapRunnable, TickTask, waitUntilNextTick/runAllTasks, and pollTask (and NeoForge NeoForgeEventHandler#onEntityJoinWorld's 0-tick TickTask scheduling). Vanilla BlockableEventLoop#doRunTask logs recoverable task exceptions and keeps polling, and the NeoForge BlockableEventLoop#submitAsync patch logs otherwise unreported failures. Sunrise also isolates a panicking mod's scheduled callbacks for the session: the task's journal rolls back, the mod is named in the log and integrated server owner's error toast, and unrelated tasks and the tick carry on. Phase refusals are logged per call without disabling the mod's tasks."
migrate = """
- Behavior only (`method:prelude::ModStateServerHost::schedule_task`): keep calling `host.schedule_task` with the same arguments. Remove match arms on `ScheduleError::NotInMod`; calls outside an active mod callback can now schedule without sharing a global cap. On a scheduling callback panic, fix the callback and restart Sunrise or the server rather than reopening the world or toggling the mod: that mod's later scheduled callbacks no longer run for the session. Return normally to commit journaled writes; a phase refusal instead aborts that invocation without disabling later tasks.
- Retain the opaque `TaskId` returned by `schedule_task` instead of constructing `TaskId(n)`, calling the raw engine constructor, or reading `.0`. An ID never aliases a task in a later world.
- Behavior only (`method:prelude::ModStateServerHost::cancel_task`): keep `host.cancel_task(id)`. Pass the returned `TaskId`, or share it only with callers that should be able to cancel that task. The owner no longer needs to match the caller; captures still drop under the scheduling owner's attribution.
- Pass `delay_ticks = 1` instead of `0` if you relied on `0` being deferred: zero-delay tasks now drain in the current tick after both server tick start and end.
"""
