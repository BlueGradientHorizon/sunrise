ids = ["handle:BlockEntityRef::set_loot_table"]
why = "A mod container can take a loot table and seed as RandomizableContainer.setLootTable gives a chest: kept and saved as LootTable and LootTableSeed, and rolled into its slots with LootTable.fill on its first open, inventory access or break."
migrate = "Nothing to change. Call set_loot_table(host, table, seed) on a mod block entity whose block declares container slots."
