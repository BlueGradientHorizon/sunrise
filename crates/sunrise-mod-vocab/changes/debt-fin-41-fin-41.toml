ids = ["hook:living_damage_post", "hook:living_death", "hook:living_death_post"]
why = "A borrowed mob's landing or gliding collision now settles its own hurt before the move or goal goes on, as NeoForge's LivingEntity hurtServer patch fires LivingDamageEvent.Post before returning. Vanilla Entity.move and checkFallDamage finish the landing before restitution, LivingEntity.travelFallFlying handles the wall collision after the move, and FollowPlayerRiddenEntityGoal.tick updates the path after the move. Vanilla Entity.propagateFallToPassengers runs before a normal LivingEntity fall hurt, but AbstractHorse.causeFallDamage hurts the horse before propagating the fall. Vanilla's Pufferfish.aiStep visits living candidates in query order, and Pufferfish.touch waits for hurtServer to return before applying poison and playing the sting sound. A borrowed sting likewise finishes death and Post on its own victim before poison or the next sting. Vanilla AbstractArrow.onHitEntity, ThrownTrident.onHitEntity and ShulkerBullet.onHitEntity finish hurt before their on-hit effects; LargeFireball.onHit starts the explosion after the direct hit. These direct hits and Player.attack now settle before their follow-ups. ServerGamePacketListenerImpl.handleMoveVehicle runs doCheckFallDamage on the snapped mount, and Entity.propagateFallToPassengers and AbstractHorse.causeFallDamage call each passenger's hurt in order. Entity.move runs checkFallDamage before restitution on an authoritative moved body."
migrate = "Keep the existing living_damage_post, living_death and living_death_post signatures. A borrowed mob landing's callbacks now see the still-unreset fall distance and pre-restitution movement. Do not wait for entity_tick_post to distinguish that hit from a subsequent wall collision or goal; the landing hurt finishes before either. A farmland trample is still decided before its fall hurt. A death listener on a pufferfish sting now sees the victim before that sting's poison is applied; a veto can still revive it. The fish's entity_tick_post observes the completed stings and any accepted poison. Projectile listeners no longer need to wait for the next tick to observe a lethal hit; its death and Post are complete before enchantments, levitation or the next blast hit. On a mounted fall observe each hit in passenger order, with a horse's own Post before the first rider's hurt. An ordinary move of an acting server player settles a lethal fall before the move's restitution and emission."
