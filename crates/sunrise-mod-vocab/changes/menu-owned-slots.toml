why = "Blockless menu types can own transient slots. The click hook now runs before the default action and lets a mod replace it. Item-opened menus can check their opening hand, and the close event receives ordered transient contents. Owned storage cannot be rebound or bulk replaced."
migrate = "Pass a ModMenuOpen request to open_mod_menu, with the opening hand for item opens. Return Flow::Continue from an existing menu_clicked listener, or Flow::Cancel after applying the click yourself. Use ItemPlace::MenuSlot to edit owned slots, opening_item.stack_matches to check the hand, and menu_closed to decide whether to return any transient contents."
