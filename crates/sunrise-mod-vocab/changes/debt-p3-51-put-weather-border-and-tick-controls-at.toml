ids = ["hook:weather_change", "method:Hooks::weather_change", "type:WeatherChangeEvent"]
why = "Vanilla MinecraftServer.setWeatherParameters writes the rain and thunder parameters together; NeoForge's ServerLevel weather patch changes packet routing, not the parameter write. Sunrise contains a failing weather callback without stopping other listeners or undoing Host writes. A panic is logged with the mod and hook, queues an error toast, and disables only that mod's weather_change listener for the session. A phase refusal or nested attempt to enter the same active callback is logged each time and does not disable it."
migrate = "Keep Hooks::weather_change and its WeatherChangeEvent parameter. To veto the proposed weather parameters, return Flow::Cancel or set event.cancelled and return normally; a callback that panics or is refused leaves the last accepted cancellation in place. Do not depend on your own weather_change callback running again before it returns; other eligible listeners can still hear a nested dispatch."
