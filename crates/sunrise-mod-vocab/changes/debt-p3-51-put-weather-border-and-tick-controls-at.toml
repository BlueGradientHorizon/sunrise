why = """
Vanilla MinecraftServer.setWeatherParameters writes one server-wide set of signed timers and flags through WeatherData. Level.setRainLevel and Level.setThunderLevel clamp both interpolants through Mth.clamp. NeoForge's ServerLevel.advanceWeatherCycle patch changes which players get the weather packets but has no weather/thunder veto pair. Sunrise now offers one veto before each parameter write, never rolling back a listener's work. A panicking callback is logged with the mod and hook, shown in an error toast, and disabled for the session; a veto, phase refusal or reentry refusal is logged each time without disabling it.

Vanilla WorldBorder.setCenter, setSize, lerpSizeBetween and the warning and damage setters address one server level. PlayerList.addWorldborderListener sends center, size, lerp, and warning packets at the writes, only to that level; damage settings stay server-side. WorldBorder.StaticBorderExtent.updateBox and Shapes.box govern the geometry, not WorldBorderCommand's parser. WorldBorder.MovingBorderExtent.update applies the last tick before a finish is observable. NeoForge does not add border setter events or change those listener sites. Sunrise now exposes the actual level and timing, preserves valid saved sizes, and isolates each panicking border callback without latching non-panic refusals.

Vanilla TickRateManager.setTickRate clamps below 1 TPS; the upper bound belongs to TickCommand.register, not the setter. ServerTickRateManager.setTickRate calls MinecraftServer.onTickRateChanged before updateStateToClients, and finishTickSprint also signals onTickRateChanged. NeoForge reads the clock in TPSCommand.createComponent but adds no setter event. Sunrise now uses one server setter from both native calls and the command, refuses and logs non-finite native input, and sends the final ticking state after listeners and the autosave adjustment. Reentry now skips only an already running callback, not the whole write or notification; a panicking callback is logged, shown in an error toast and disabled for the session.
"""
