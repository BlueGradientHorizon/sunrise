ids = ["method:ItemStack::set_components", "method:ItemStack::apply_components", "method:ItemComponentEditor::apply_components", "method:ConsumeEffectType::new", "type:StackWriteError"]
why = "Sunrise keeps the supplied raw stack patch keys on write so the decoder and resident editor agree on which value to replace. A bare damage key is retained rather than lost or moved into typed damage. Vanilla 26.3 DataComponentPatch.PatchKey.CODEC resolves an Identifier before ItemStack.applyComponents applies the patch, and NeoForge DataComponentPatch.Builder.set uses the resolved type as the key. Matching vanilla's bare-key admission is separate work; registered effects under full component keys are still checked, and use_remainder and sulfur_cube_content remain deferred."
migrate = "No call or signature changes. In raw patches passed to ItemStack::set_components, ItemStack::apply_components, or ItemComponentEditor::apply_components, use minecraft:damage instead of damage for a damage override, and minecraft:death_protection or minecraft:consumable instead of their bare names for effect admission, including in child stacks. Bare keys remain opaque. Keep handling StackWriteError::InvalidEffectPayload for registered effects refused when the written stack or a decoded child is admitted. For use_remainder and sulfur_cube_content, the registered load callback still runs when the template is materialized, not when its parent is written."
