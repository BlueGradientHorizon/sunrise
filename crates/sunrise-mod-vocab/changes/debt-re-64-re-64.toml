why = """
Align world geometry submission, buffer preparation, and stage rendering with vanilla 26.3
(`LevelRenderer.addSkyPass`, `LevelRenderer.prepareTranslucents`, `LevelRenderer.executeSolid`,
`GameRenderer.renderLevel`, `SectionOcclusionGraph.addSectionsInFrustum`, `SubmitNodeStorage`,
`OitStage`, `NbtAccounter.MAX_STACK_DEPTH`)
and NeoForge 26.3 (`SubmitCustomGeometryEvent`, `RenderLevelStageEvent`, `IRenderableSection`,
`PrepareRenderBuffersEvent`), and resolve audits [89] and [90]:

- Borrow live frame state via `WorldRenderView<'a>` (`&'a Camera`, world `partial_tick`,
  `game_time`, `improved_transparency`, and visible `&'a [RenderableSection]`) instead of copying a
  3-field summary.
- Add `Hooks::prepare_render_buffers` (`PrepareRenderBuffersEvent`) firing after `AfterSky` and
  before entity/instance uploads and pass-bearing stages so mods can update retained GPU buffers
  (`InstanceGroups`) and see those changes on the same frame. Stage geometry is submitted here,
  paged at the device limits alongside deferred custom geometry, and drawn from the finished
  upload. The stage callback cannot create, resize, or upload buffers.
- Expand `RenderLevelStage` to all 9 NeoForge 26.3 stages (`AfterSky`, `AfterOpaqueBlocks`,
  `AfterOpaqueFeatures`, `AfterTranslucentFeatures`, `AfterTranslucentBlocks`,
  `AfterTranslucentParticles`, `AfterWeather`, `OitTranslucent(OitStage)`, `AfterLevel`) with
  `RenderLevelStage::frame_order` (`CLASSIC_ORDER` / `OIT_ORDER`) and stage-scoped pass capability
  via `RenderLevelStageContext` and `StagePass` (`None` on `AfterSky`/`AfterLevel`, `World` ->
  `WorldPassDrawContext` on standard passes, `Oit` -> `WorldOitPassDrawContext` on OIT sub-passes),
  dispatched live at each actual render-pass boundary (skipping stages whose pass does not run).
  Route `submit_custom_geometry` and debug renderers into the deferred `STAGE_CUSTOM_GEOMETRY` tail.
- Audit [89]: remove fixed per-view caps (4,096 lines/quads, 16,384 instances/groups, 65,536
  per-mod group copies), `WorldDrawUsage`, `WorldDrawContext::usage`, `CapacityExceeded` across
  `DrawError`/`PipelineDrawError`/`InstanceError`/`GroupError`, and `DrawError::TextTooDeep` on
  in-memory `Text` name-tag rendering (retaining the 512-container limit only on NBT codec
  boundaries via `Text::validate_payloads` and iterative `Drop`).
- Audit [90]: replace whole-batch pre-cull validation and rollback in `draw_model_instances` with
  frustum-first culling and per-copy skipping of invalid visible instances, matching vanilla's
  `SubmitNodeStorage`.
- Follow NeoForge's `RenderLevelStageEvent.AfterLevel` injection in `GameRenderer.renderLevel`:
  dispatch at the world boundary, not after the classic pack's composite/final passes. Preserve
  the classic pack's own hand within the world draws between the two depth snapshots; unlike the
  engine hand overlay, it is an input to the pack's deferred passes. An engine `AfterSky` is not
  synthesized when the pack replaces the early sky pass with a draw over the imported world.
- Run retained debug renderers from vanilla's `DebugRenderer.emitGizmos` / NeoForge's
  `RegisterDebugRenderersEvent` under the shared render-listener panic rule. A panic disables
  only the failing callback and issues the shared log and toast naming its mod. Accepted draws
  outside a journal are not undone.
- Bump `submit_custom_geometry` and `render_level_stage` to version 2.
"""
migrate = """
- Remove calls to `WorldDrawContext::usage()`, references to `WorldDrawUsage`, and match arms for
  `DrawError::CapacityExceeded`, `DrawError::TextTooDeep`, `DrawError::TextRefused`,
  `PipelineDrawError::CapacityExceeded`,
  `InstanceError::CapacityExceeded`, and `GroupError::CapacityExceeded`.
- For `draw_model_instances`, handle `Err(InstanceError::Model(_))` for stale/unknown model handles;
  invalid visible copies are skipped individually without rolling back valid copies.
- Because `Text` now implements `Drop`, replace by-value moves out of `Text` fields with `.take()`,
  `std::mem::take`, `.clone()`, or borrowing.
- Update `WorldRenderView` reads: replace `event.view.camera` (`[f64; 3]`) with
  `event.view.camera_position()` or `event.view.camera.position`, and update explicit annotations or
  `DebugRenderer` callbacks to `&WorldRenderView<'_>`. Replace
  `WorldRenderView::new(camera_position, partial_tick, game_time)` with
  `WorldRenderView::new(&camera, partial_tick, game_time, improved_transparency, sections)`.
  The view no longer implements `Wire` or `PartialEq`; copy out the fields you own, compare those
  fields directly, or encode them in your own payload type.
- The native replacement target stays `sunrise_client_render::gfx::Renderer::render`. Change its
  signature to `fn render(&mut self, frame: &Frame<'_>, hooks: Option<&mut dyn
  sunrise_client_render::gfx::world_primitives::FrameHooks>) -> Result<bool>` and forward `hooks`
  when delegating to the original. The `Result` is `sunrise_client_render::Result`.
- `AfterTranslucentBlocks` and `AfterWeather` are classic-only. For improved transparency use
  `OitTranslucent` sub-passes for lines/quads; mod pipeline quads are not compatible with OIT.
  Submit those in `submit_custom_geometry` for the deferred world pass or choose an available
  standard world stage that meets your ordering needs.
- Implement `Hooks::prepare_render_buffers` to update retained `InstanceGroups`
  before pass-bearing stages run.
- Replace `RenderLevelStage::ALL` with `RenderLevelStage::frame_order(view.improved_transparency)`
  (`CLASSIC_ORDER` or `OIT_ORDER`).
- Move `event.draw.lines(&lines)` and `.quads(&quads)` into `prepare_render_buffers` as
  `.lines(stage, &lines)` or `.quads(stage, &quads)`. Keep the returned
  `PreparedWorldDraw` for this view only. In `render_level_stage`, call
  `event.context.world_pass().unwrap().draw(batch)` for the matching standard stage, or
  `event.context.oit_pass().unwrap().1.draw(batch)` for the matching OIT sub-pass.
  A batch from a different stage or view returns `PreparedWorldDrawError` and draws nothing.
- Move submission-only calls (`name_tag`, `draw_model_instances`, `draw_instance_group`) into
  `Hooks::submit_custom_geometry`. Move drawing previously done in `AfterSky` or `AfterLevel`
  (now `StagePass::None`) to `submit_custom_geometry` or prepare it for a pass-bearing stage.
  Do not depend on `AfterSky` for work needed on classic packs that replace the engine sky;
  use `prepare_render_buffers` to run on both routes. No call changes are needed for `AfterLevel`
  or debug renderer failure handling. `AfterLevel` precedes pack composition, and a panicking
  debug renderer remains disabled across renderer-list refreshes.
"""
