ids = ["hook:pickup_xp"]
why = "Match NeoForge PlayerXpEvent.PickupXp and vanilla ExperienceOrb.playerTouch (plus ExperienceOrb.addAdditionalSaveData and ExperienceOrb.readAdditionalSaveData). pickup_xp (bumped from version 1 to 2) previously documented a 1..=i32::MAX clamp on value while enforcing a count.max(1) floor in guest_orbs and copying a pre-call snapshot back by stale index. Edited value and count now apply directly to the live orb located by join identity so direct orb writes and removals survive: value keeps vanilla's signed int semantics (zero and negative values repair nothing and award no XP, and surviving orbs persist Value as a signed short), count is no longer floored to 1 (setting count to 0 discards the orb without awarding XP or setting the 2-tick delay), and pickup runs in vanilla ExperienceOrb.playerTouch order (takeXpDelay = 2, take, Mending/XP for positive value, then decrement count and discard at 0). Orb NBT loading validates Count against ExtraCodecs.POSITIVE_INT (1..=i32::MAX, else 1)."
migrate = "Rebuild listeners of `Hooks::pickup_xp` against version 2. Do not rely on `event.value <= 0` being clamped to 1 (it awards 0 XP and repairs nothing while preserving the signed value on surviving orbs) or on `event.count = 0` being floored to 1 and still awarding a pickup (setting `event.count = 0` now discards the orb without awarding XP or setting the 2-tick pickup delay; set `event.count = 1` to take the final pickup and discard)."
