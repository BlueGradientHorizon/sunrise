ids = [
    "hook:data_map_types",
    "type:DataMapType",
    "fn:data_map_value",
    "fn:data_map_entries",
]
why = "Decoded mod data-map JSON values to NBT and validated built-in block-map values in apply_file's pre-mutation pass and deleted PublishedMap.invalid so a file with an undecodable JSON value is skipped atomically at load time rather than poisoning data_map_value and data_map_entries reads with DataMapError::Undecodable or erasing valid lower block-map rows, matching NeoForge net.neoforged.neoforge.registries.DataMapLoader#readData. Also removed the minecraft namespace restriction on DataMapType IDs in favor of standard namespaced Identifier validation, matching NeoForge net.neoforged.neoforge.registries.datamaps.DataMapType and RegisterDataMapTypesEvent#register, and bumped hook:data_map_types from version 1 to 2 because pushed minecraft: IDs now register instead of being rejected."
migrate = "If your manifest pins `data_map_types`, request `hook_version = 2`: pushed `minecraft:` `DataMapType` IDs now register instead of being rejected by the hook's documented contract. Raw `data_map_value` and `data_map_entries` reads no longer return `DataMapError::Undecodable` (which now occurs only when a typed `DataMap::decode` refuses a tag); data-map files containing undecodable JSON values (such as `null` or unsigned integers above `i64::MAX`) are logged and skipped as whole layers at load time, preserving valid lower layers."
