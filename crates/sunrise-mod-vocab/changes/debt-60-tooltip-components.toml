why = "Tooltip components now measure and draw themselves as typed in-process ClientTooltipComponent implementations prepared after RenderTooltipEvent.GatherComponents, matching vanilla 26.3 (Item.getTooltipImage, TooltipComponent, ClientTooltipComponent, ClientTooltipPositioner, DefaultTooltipPositioner, GuiGraphicsExtractor.tooltip) and NeoForge 26.3 (RegisterClientTooltipComponentFactoriesEvent, ClientTooltipComponentManager, ClientHooks.getTooltipFont, IClientItemExtensions.getFont, ClientHooks.gatherTooltipComponentsFromElements, RenderTooltipEvent.GatherComponents, RenderTooltipEvent.Pre, RenderTooltipEvent.Texture) instead of item-keyed size/draw redispatch and closed TooltipImage records. Gather wraps text in the item's ClientItemExtensions::tooltip_font (default minecraft:default) and seeds RenderTooltipEvent.Pre with that font; Pre lends the prepared components, active positioner, and replaceable font identifier used for measurement and drawing without rewrapping already-split text lines. Zero-width and zero-height components remain in the gathered list and still run both draw passes, and tooltips are cancelled only when a listener explicitly cancels (never on a conversion error). Unregistered custom component types abort that tooltip before Pre/Texture/paint with an error log without latching; any panic in a mod's factory, measurement, draw pass, or payload/component drop disables that mod's tooltip component callbacks for the session with a log and error toast and discards staged paint from the panicking pass."
migrate = '''
Replace `ItemPart::tooltip_component` and `ItemPart::tooltip_component_draw` with a typed `TooltipComponentData` payload and a `ClientTooltipComponent` renderer:

1. Define your payload struct implementing `TooltipComponentData` and your client renderer struct implementing `ClientTooltipComponent` (`width`, `height`, optional `show_tooltip_with_item_in_hand`, `draw_text`, and `draw_image` receiving `&dyn TooltipFont` and `&mut dyn DrawContext`, with `DrawContext::text_with_font` available for formatted text in the active font).
2. In `Hooks::register_client_tooltip_component_factories(&self, _cx, event)`, register the factory once at client startup with `event.factories.register::<MyData, MyClient>(|data| MyClient::from(data))`. A later registration for the same data type replaces the earlier one.
3. On your `ItemPart`, replace `tooltip_component` and `tooltip_component_draw` with `ItemPart::tooltip_image(&self, host, event) -> Option<TooltipComponent>`, returning `Some(TooltipComponent::custom(my_data))` (or `Some(TooltipComponent::bundle(stack))`), or `None` to keep vanilla's tooltip image. To keep a bundle's built-in contents tooltip AND add a custom component beside it, leave `tooltip_image` returning `None` (so vanilla inserts the bundle component) and insert your custom `TooltipElement::Component(TooltipComponent::custom(my_data))` in `render_tooltip_gather_components` without removing the bundle element.
4. To supply an item-owned tooltip font used for Gather wrapping and as `render_tooltip_pre`'s initial font (`IClientItemExtensions.getFont`), override `ClientItemExtensions::tooltip_font(&self, host, stack) -> Option<Identifier>`.

Update `Hooks::render_tooltip_gather_components` (version 2):
- Replace `TooltipElement::Image(TooltipImage { source: TooltipImageSource::Bundle(stack), .. })` with `TooltipElement::Component(TooltipComponent::bundle(stack))` and `TooltipElement::Image(TooltipImage { source: TooltipImageSource::ItemPart(..), .. })` with `TooltipElement::Component(TooltipComponent::custom(data))`. Remove all references to `TooltipImage` and `TooltipImageSource`. `TooltipElement` is no longer `Wire`.
- Text lines now wrap using NeoForge's screen-edge wrapping logic in the item's tooltip font before preparation, tightened further when `*event.max_width > 0`.
- Every custom `TooltipComponent` remaining after Gather must have a factory registered in `register_client_tooltip_component_factories`; an unregistered custom type aborts that tooltip before `render_tooltip_pre`, `render_tooltip_texture`, or painting with an error log.

Update `Hooks::render_tooltip_pre` (version 2):
- Replace `event.elements` with `event.components: &[PreparedTooltipComponent]`. Inspect entries via `as_text()`, `as_bundle()`, or `downcast_ref::<MyClient>()`, and measure them with `event.draw.with_tooltip_font(event.font, |font| component.width(font))`.
- Replace `event.screen_width: i32` and `event.screen_height: i32` with `event.screen: [f32; 2]` (`event.screen[0]` / `event.screen[1]`, or `[event.screen[0] as i32, event.screen[1] as i32]` when passing integer screen dimensions to `event.positioner.position_tooltip`).
- Use `event.positioner` (`&dyn ClientTooltipPositioner`) to compute placement if needed, and modify `*event.font` (`&mut Identifier`, seeded from `ClientItemExtensions::tooltip_font` or `minecraft:default`) to measure and draw the tooltip with a replacement font without rewrapping already-split lines.
- `event.place`, `event.stack`, `event.draw`, `Flow::Cancel`, and `Hooks::render_tooltip_texture` keep their existing roles.
'''
