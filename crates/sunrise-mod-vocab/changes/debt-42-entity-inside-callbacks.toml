why = "Follows vanilla 26.3 InsideBlockEffectApplier.StepBasedCollector, InsideBlockEffectType, Entity.checkInsideBlocks, PowderSnowBlock, LayeredCauldronBlock, and BaseFireBlock (NeoForge adds no event or extension for Block.entityInside). Replaces encoded deferred write enums (EntityWrite, InsideWrite), PlannedInside, and the HurtSourceError::Taken / EntityLookup / touched-block state-unchanged / sibling-write rejection machinery with owned run_before and run_after callbacks lent &mut InsideEntityView<'_> during applyAndClear. Entity mutations, source lookups, and level writes run directly against the live level while the entity remains alive, with per-callback panic containment disabling only the panicking mod's entity_inside callback for the session and reporting a loud log and error toast."
migrate = '''
Replace encoded writes in `BlockPart::entity_inside` with owned closures on `event.run_before` / `event.run_after` that act on `&mut InsideEntityView<'_>`:
- `event.run_before(effect, EntityWrite::Push(delta))` -> `event.run_before(effect, move |view| { view.push(delta); })`
- `event.run_after(effect, EntityWrite::SetVelocity(vel))` -> `event.run_after(effect, move |view| { view.set_velocity(vel); })`
- `event.run_after(effect, EntityWrite::MakeStuckInBlock(mul))` -> `event.run_after(effect, move |view| { view.make_stuck_in_block(mul); })`
- `event.run_after(effect, EntityWrite::ResetFallDistance)` -> `event.run_after(effect, |view| { view.reset_fall_distance(); })`
- `event.run_after(effect, EntityWrite::SetRemainingFireTicks(ticks))` -> `event.run_after(effect, move |view| { view.set_remaining_fire_ticks(ticks); })`
- `event.run_after(effect, EntityWrite::AddEffect { effect: key, duration, amplifier })` -> `event.run_after(effect, move |view| { view.add_effect(key, duration, amplifier); })`
- `event.run_after(effect, EntityWrite::Hurt { damage_type, amount, direct, causing })` -> `event.run_after(effect, move |view| { view.hurt(damage_type, amount); })` (or `view.hurt_with_source(damage_type, amount, direct, causing)` when passing optional source `EntityRef`s; `HurtSourceError` and `EntityLookup` are removed).
- `event.request(InsideWrite::SetBlock(state))` -> `let pos = [event.pos.x, event.pos.y, event.pos.z]; event.run_after(effect, move |view| { view.set_block(pos, state); })`
- `event.request(InsideWrite::DestroyBlock { drop })` -> `let pos = [event.pos.x, event.pos.y, event.pos.z]; event.run_after(effect, move |view| { view.destroy_block(pos, drop); })`
Level writes apply directly to the live level without a touched-block state-unchanged gate or whole-batch rollback; check the `bool` return of `set_block` / `destroy_block` / `hurt` / `hurt_with_source` / `push` / `set_velocity` / `make_stuck_in_block` / `add_effect` directly when needed. `event.apply(InsideEffect::...)` is unchanged.
'''
