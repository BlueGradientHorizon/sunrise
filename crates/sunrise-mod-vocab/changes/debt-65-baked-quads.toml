why = "Model lookups lend immutable geometry, sprite names and variant lists from the published resource generation instead of cloning them for every query. Baked ARGB is now visible independently of the tint index; the view does not resolve draw-time colour or render state. Only keys can be retained across asset borrows."
migrate = "Replace block_state_models(state)?.first().copied() with block_state_models(state)?.iter().next(); iter() yields BakedModelKey by value. If you need an owned list, collect those keys. Keep the key until model_baking_completed publishes the next generation and call baked_model(key) again when reading geometry. Replace view.quads.iter() or for quad in &view.quads with view.quads(); use view.quads().nth(i) instead of view.quads[i]. Use view.particle and quad.sprite directly as borrowed names; dereference quad.positions or quad.uvs if you need a copied array. Read quad.baked_argb for the optional 0xAARRGGBB colour baked into the quad, not the colour from quad.tint_index. BakedQuad::new and Wire for BakedModelView and BakedQuad are gone: use your own owned geometry type for manually built or serialized data."
