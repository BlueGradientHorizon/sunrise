ids = [
    "hook:menu_slot_rules",
    "method:MenuView::slot_backing",
    "method:MenuView::slot_holds",
    "method:MenuView::slot_gives",
]
why = "Live menu views now follow vanilla Slot.mayPlace, Slot.mayPickup, Slot.getMaxStackSize(ItemStack) and AbstractContainerMenu.doClick/moveItemStackTo, including the actual linked container and NeoForge ResourceHandlerSlot.mayPlace/mayPickup/getMaxStackSize for handler-owned rules. Hub rule Parts can read the live guest in both a query and a click. menu_slot_rules v6 sees backing admission, including when checking pickup before quickMoveStack. MultiPlayerGameMode.handleContainerInput predicts from the client menu it knows; Sunrise sends clicks unpredicted when an open-screen layout does not identify the server's backing. Armour placement follows vanilla ArmorSlot.mayPlace and NeoForge IItemExtension.canEquip. Both read dispatches now keep healthy Parts' answers when a Part panics, using the shared callback disable and report."
migrate = "Keep the same MenuPart::menu_slot_rules signature and rebuild for v6. If you already filter a slot, keep event.may_place &= accepts(stack). Replace any use of event.may_place = true to bypass a backing rejection with a container declaration that admits the item, then apply the Part's filter. Read event.may_place as the live slot answer including its backing; do not expect a call for a quick-move top-up the backing already refuses, or a client call for a declared mod menu or stock open-screen layout with a slot-rule Part. Read the resulting slots and cursor after server sync instead. A Part may still answer event.may_pickup separately on a mod menu type. For MenuView::slot_holds and slot_gives, handle None on handler-owned native windows even when the screen looks like a vanilla chest or has declared slots; use your handler or transactional item places to decide actual writes. For MenuView::slot_backing, use the returned connected container position and index for linked slots (None for an unbound link); do not substitute the opening block. Treat CraftResult as a preview, including in a mod block's menu: take it with a click, not ItemPlace::MenuSlot. ItemPart::can_equip keeps its signature and version; return the answer normally instead of unwinding. For either query, a panic discards only that callback's answers and disables it for the session, not the other Parts."
