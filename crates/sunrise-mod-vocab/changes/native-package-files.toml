ids = ["behaviour:native_package_files"]
why = "A native package may carry any source Cargo would package (`include` and `exclude` in Cargo.toml apply), so a mod can vendor C sources and headers for a `cc` build. The mod's own build script runs when the launcher builds it. A prebuilt binary (ELF, Mach-O, PE, `ar` archive) is refused by its content, never by its name. The game no longer checks a package's file list when it loads: it reads the manifest, the icon, the assets and data, and the listed runtime files, and skips any other entry."
migrate = "Nothing to migrate for existing mods. To use C, put the sources and headers in the project, compile them from `build.rs` with the `cc` crate, and ship no object files, static libraries or shared libraries."
