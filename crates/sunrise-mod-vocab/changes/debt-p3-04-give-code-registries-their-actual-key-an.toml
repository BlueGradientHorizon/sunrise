why = "Like NeoForge RegisterEvent.register, RegisterTicketControllersEvent.register, ForcedChunkManager and vanilla 26.3 MappedRegistry.register, code declaration keys are not claims to package namespaces. Bare declaration names qualify to the submitting mod ID and explicit valid identifiers retain their namespace. The submitting mod stays separate for attribution (including block entity transform ownership, ticket controllers, arm poses, attributes, entity types and dimensions). Existing entries cannot be overwritten, including vanilla built-ins from BuiltInRegistries (blocks, items, block entity types, data components, custom stats, attributes, command argument types, entity types, fluids, chunk generators, biome sources, feature types and structure types). The block entity builder still cannot reassign an existing vanilla block. The blocks, items and component_types hooks move from version 2 to 3 for accepting keys the old contract refused. File-pack ownership is unchanged."
migrate = "Keep BlocksEvent::register, ItemsEvent::register, ComponentTypesEvent::register, Registrar::block_entity_type, CustomStatsRegistrar::register_custom_stat and the other Registrar declaration calls (register_arm_pose, declare_attribute, declare_entity_attributes, register_command_argument, register_dimension, register_chunk_generator, register_biome_source, declare_general_entity, register_feature_type, register_structure_type, declare_fluid, declare_world_fluid, register_ticket_controller). A new declaration can use its intended unused key (for example, explicitly pass \"other:charge\" instead of renaming it to \"mymod:charge\"); keep the old key if it is already in saves. Bare declaration names still use your mod ID; components and arm poses still require an explicit namespace. Delete the DeclarationError::UnownedNamespace match arm: malformed names still return InvalidId, while registry-specific refusals reported as a DeclarationError use Rejected. Built-in attribute and entity-type collisions now return Duplicate instead of InvalidId. If your manifest pins blocks, items or component_types, change hook_version = 2 to hook_version = 3. Keep manifest namespaces for assets and data files you ship under those namespaces."
