why = "Like NeoForge RegisterEvent.register, NewDatapackRegistryEvent, RegisterRecipePropertiesEvent.register, NetworkRegistry.register, RegisterTicketControllersEvent.register, ForcedChunkManager, RegisterMenuScreensEvent, RegisterRenderPipelinesEvent, RegisterGuiLayersEvent, RegisterDebugEntriesEvent, EntityRenderersEvent.RegisterLayerDefinitions, RegisterGameRuleCategoryEvent and vanilla 26.3 MappedRegistry.register and GameRuleCategory.register, code declaration keys are not claims to package namespaces. Bare declaration names qualify to the submitting mod ID and explicit valid identifiers retain their namespace. The submitting mod stays separate for attribution (including block entity transform ownership, ticket controllers, arm poses, attributes, entity types, dimensions, datapack registries, recipe books, loot codecs, global loot modifiers, payloads, attachment declarations, menu screen factories, menu slot exclusions, menu recipe book bindings, render pipelines, GUI layers, debug entries, entity model layers, game rule categories, game rules, biome modifiers and biome regions). Registry reservations still apply, including vanilla built-ins from BuiltInRegistries, RegistryDataLoader, MenuType, GuiLayerManager, DebugScreenEntries, GameRuleCategory, GameRules and vanilla entity-models.json (blocks, items, block entity types, data components, custom stats, attributes, command argument types, entity types, fluids, chunk generators, biome sources, feature types, structure types, datapack registries, recipe types, recipe serializers, recipe book types, loot function and condition types, built-in menu types, vanilla GUI layers, built-in F3 debug entries, vanilla entity model layers, built-in game rule categories and rules, and NeoForge's built-in neoforge:add_table, neoforge:loot_table_id and neoforge:can_item_perform_ability). Network payloads reserve the minecraft namespace (matching NeoForge NetworkRegistry) and Sunrise's built-in engine sunrise: channels instead of denying all foreign or sunrise: namespaces. Recipe property sets accept any valid namespaced set key, stripping minecraft: only for vanilla RecipeManager.RECIPE_PROPERTY_SETS entries. The Sunrise-only biome-region selector has no vanilla weight cap, so the invented 1000 cap (BiomeRegion::MAX_WEIGHT) is removed across declaration, save decoding and region selection while keeping positive i32-representable weights (1..=i32::MAX) and checked total weight arithmetic (<= i32::MAX). The block entity builder still cannot reassign an existing vanilla block. The blocks, items, component_types, register_render_pipelines, register_gui_layers and register_debug_entries hooks move from version 2 to 3, and recipe_property_sets moves from version 1 to 2, for accepting keys the old contract refused. File-pack ownership is unchanged. Vanilla BlockEntity.loadStatic and Recipe.DIRECT_CODEC resolve saved types and serializers by registry key: admitted native minecraft: entries therefore retain native NBT, ticking, view distance, default capabilities and item use, and serializers take the same path over owning and synced recipe loads. RecipeManager.RECIPE_PROPERTY_SETS distinguishes real vanilla sets on both sides of the wire. Button callbacks use the open type or verified stock opener's package, independent of screen, recipe book or slot-mask attribution, following the ownership of dispatch in vanilla AbstractContainerMenu.clickMenuButton. NeoForge ServerLifecycleHooks.runModifiers reads one BIOME_MODIFIERS registry, and vanilla ResourceManagerRegistryLoadTask.load registers one effective resource per key; a code entry colliding with the effective file is refused. NeoForge ClientHooks.registerLayerDefinition and loadLayerDefinitions keep only the last modded supplier for a key; prepared vanilla layer keys remain reserved. register_layer_definitions moves from version 2 to 4 across this item."
migrate = "Keep BlocksEvent::register, ItemsEvent::register, ComponentTypesEvent::register, Registrar::block_entity_type, CustomStatsRegistrar::register_custom_stat, recipe_property_sets, register_render_pipelines, register_gui_layers, register_debug_entries, register_layer_definitions and the other Registrar declaration calls (register_arm_pose, declare_attribute, declare_entity_attributes, register_command_argument, register_dimension, register_chunk_generator, register_biome_source, declare_general_entity, register_feature_type, register_structure_type, declare_fluid, declare_world_fluid, register_ticket_controller, declare_datapack_registry, register_recipe_type, register_crafting_recipe_serializer, register_read_only_recipe_serializer, register_raw_recipe_serializer, recipe_book_type, recipe_book_type_with_fields, register_global_loot_modifier_serializer, register_loot_function_type, register_loot_condition_type, payload_handlers, register_attachment_type, register_menu_screen, menu_slot_exclusions, menu_recipe_book, game_rule_category, game_rule_bool, game_rule_int, declare_biome_modifier, declare_biome_region). A new declaration can use its intended unused key (for example, explicitly pass \"other:charge\" instead of renaming it to \"mymod:charge\"); keep the old key if it is already in saves. Bare declaration names still use your mod ID; components, arm poses, recipe book types, loot types, payloads, attachments, menus, GUI layers, debug entries and model layers still require an explicit namespace. Replace any reference to BiomeRegion::MAX_WEIGHT with i32::MAX as u32: biome region weights in 1..=i32::MAX are accepted as long as the dimension's total weight fits in i32::MAX. Payloads still refuse minecraft:* channels and built-in engine sunrise:* channels; built-in vanilla menus still require an explicit non-built-in opener block for slot exclusions and cannot bind a custom recipe book; built-in vanilla GUI layers, debug entries, model layers, game rule categories and game rules cannot be overwritten. Delete the DeclarationError::UnownedNamespace and GameRuleError::ForeignNamespace match arms: malformed names still return InvalidId, while registry-specific refusals reported as a DeclarationError use Rejected and built-in or duplicate game rule categories and rules refuse with Duplicate. Built-in attribute, entity-type and datapack-registry collisions now return Duplicate instead of InvalidId. If your manifest pins blocks, items, component_types, register_render_pipelines, register_gui_layers or register_debug_entries, change hook_version = 2 to hook_version = 3; if it pins recipe_property_sets, change hook_version = 1 to hook_version = 2. Keep manifest namespaces for assets and data files you ship under those namespaces. Pin register_layer_definitions with hook_version = 4; keep one supplier per unused layer ID unless you intend a later registration to replace it. Keep block_entity_part, block_container, block_fluids, block_energy and use_duration calls; unused minecraft: keys take the same paths as other admitted keys. Keep the existing saved ID and custom serializer string, including its namespace. If you registered a second gameplay Part to supply menu_button_valid or menu_button from a presentation-only package, move those callbacks to the package that registered the custom menu type or the verified stock opener block. Keep the screen factory, recipe book binding and slot mask declarations separate. A stock screen factory must be registered by its verified opener's package. If declare_biome_modifier and an effective modifier file share a key, remove one declaration or change the code declaration's key; both can no longer run under that one key. For a file crafting_remainder naming another mod's native minecraft: item, use one of your own admitted items or a genuine built-in item instead."
