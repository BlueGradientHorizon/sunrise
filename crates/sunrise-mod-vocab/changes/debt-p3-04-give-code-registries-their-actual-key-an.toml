why = "Like NeoForge RegisterEvent.register, NewDatapackRegistryEvent, RegisterRecipePropertiesEvent.register, NetworkRegistry.register, RegisterTicketControllersEvent.register, ForcedChunkManager and vanilla 26.3 MappedRegistry.register, code declaration keys are not claims to package namespaces. Bare declaration names qualify to the submitting mod ID and explicit valid identifiers retain their namespace. The submitting mod stays separate for attribution (including block entity transform ownership, ticket controllers, arm poses, attributes, entity types, dimensions, datapack registries, recipe books, loot codecs, global loot modifiers and payloads). Existing entries cannot be overwritten, including vanilla built-ins from BuiltInRegistries and RegistryDataLoader (blocks, items, block entity types, data components, custom stats, attributes, command argument types, entity types, fluids, chunk generators, biome sources, feature types, structure types, datapack registries, recipe types, recipe serializers, recipe book types, loot function and condition types, and NeoForge's built-in neoforge:add_table, neoforge:loot_table_id and neoforge:can_item_perform_ability). Network payloads reserve the minecraft namespace (matching NeoForge NetworkRegistry) and Sunrise's built-in engine sunrise: channels instead of denying all foreign or sunrise: namespaces. Recipe property sets accept any valid namespaced set key, stripping minecraft: only for vanilla RecipeManager.RECIPE_PROPERTY_SETS entries. The block entity builder still cannot reassign an existing vanilla block. The blocks, items and component_types hooks move from version 2 to 3, and recipe_property_sets moves from version 1 to 2, for accepting keys the old contract refused. File-pack ownership is unchanged."
migrate = "Keep BlocksEvent::register, ItemsEvent::register, ComponentTypesEvent::register, Registrar::block_entity_type, CustomStatsRegistrar::register_custom_stat, recipe_property_sets and the other Registrar declaration calls (register_arm_pose, declare_attribute, declare_entity_attributes, register_command_argument, register_dimension, register_chunk_generator, register_biome_source, declare_general_entity, register_feature_type, register_structure_type, declare_fluid, declare_world_fluid, register_ticket_controller, declare_datapack_registry, register_recipe_type, register_crafting_recipe_serializer, register_read_only_recipe_serializer, register_raw_recipe_serializer, recipe_book_type, recipe_book_type_with_fields, register_global_loot_modifier_serializer, register_loot_function_type, register_loot_condition_type, payload_handlers). A new declaration can use its intended unused key (for example, explicitly pass \"other:charge\" instead of renaming it to \"mymod:charge\"); keep the old key if it is already in saves. Bare declaration names still use your mod ID; components, arm poses, recipe book types, loot types and payloads still require an explicit namespace. Payloads still refuse minecraft:* channels and built-in engine sunrise:* channels. Delete the DeclarationError::UnownedNamespace match arm: malformed names still return InvalidId, while registry-specific refusals reported as a DeclarationError use Rejected. Built-in attribute, entity-type and datapack-registry collisions now return Duplicate instead of InvalidId. If your manifest pins blocks, items or component_types, change hook_version = 2 to hook_version = 3; if it pins recipe_property_sets, change hook_version = 1 to hook_version = 2. Keep manifest namespaces for assets and data files you ship under those namespaces."
