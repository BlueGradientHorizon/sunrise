why = "Aligns registration-append hooks and reload listener hooks with vanilla 26.3 and NeoForge: all registration-append hooks (all bumped to version 3) contain listener panics under the shared crash-containment boundary, rolling back only that listener's staged entries, disabling that mod's listener for the session with a log line and error toast without writing a fatal crash report, and continuing to subsequent listeners; particle groups drop the minecraft-namespace ban and fail client startup on duplicate IDs (NeoForge RegisterParticleGroupsEvent.java, hook version 3); model layers validate the Identifier before '#' and allow any nonempty layer name after '#', keep the last mod supplier per ID, fail closed if entity-models.json cannot supply vanilla keys, and reject exact collisions with vanilla keys (NeoForge ClientHooks.java and vanilla LayerDefinitions.java / ModelLayerLocation.java, hook version 3); render pipelines drop the mod-namespace ownership gate and fail client startup on duplicate IDs including collisions with vanilla's built-in required or optional pipeline registries (NeoForge RegisterRenderPipelinesEvent.java and RenderPipelines.java.patch, hook version 3); standalone model bakers drop the sticky append failure latch so the baker's Result controls publication (NeoForge StandaloneModelLoader.java); server and client reload listener registries remove synthetic minecraft:first/minecraft:last boundary nodes and auto-edges, link only dangling non-minecraft listeners after the vanilla anchor in registration tie-break order, remove the sticky registration failure latch, and keep get_last_vanilla_listener() immutable at the static VanillaServerListeners::functions() anchor without a pre-added edge for neoforge:loot_modifiers (NeoForge SortedReloadListenerEvent.java, ReloadListenerSort.java, VanillaServerListeners.java, VanillaClientListeners.java, NeoForgeEventHandler.java, hook version 2); and ReloadResourceError::Display walks the full Error::source() chain for logs and /reload replies (matching vanilla ReloadCommand.java cause reporting)."
migrate = """
- All registration-append hooks (`block_entity_type_add_blocks`, `component_types`, `create_skull_models`, `map_decoration_types`, `register_entity_spectator_shaders`, `register_fluid_models`, `register_layer_definitions`, `register_particle_groups`, `register_render_pipelines`, `register_texture_atlases`, and `standalone_models`) are now version 3: a panicking listener has only its own staged entries rolled back, subsequent mods' listeners continue, and the panicking mod's listener is disabled for the session (logged and reported via mod error toast, without writing a fatal crash report).
- `Hooks::register_particle_groups` (v3): any nonempty namespace and path is accepted (including `minecraft`). Duplicate group IDs now fail client startup instead of being skipped; ensure every registered group ID is unique.
- `Hooks::register_layer_definitions` (v3): validates `<namespace>:<path>` with vanilla `Identifier` syntax and accepts any nonempty layer string after `#` (including `:` or `#`, as in vanilla `ModelLayerLocation`). Duplicate mod registrations now use last-wins deduplication before running suppliers, and exact collisions with vanilla layer keys in `entity-models.json` fail client startup (failing closed if the vanilla document is missing or invalid).
- `Hooks::register_render_pipelines` (v3): the mod-namespace ownership gate is removed; duplicate pipeline IDs — including collisions with vanilla's built-in required or optional pipeline registries — now fail client startup instead of being dropped.
- `Hooks::add_server_reload_listeners` (v2) and `Hooks::add_client_reload_listeners` (v2): `VanillaServerListeners::first()`/`last()` alias `functions()` and `VanillaClientListeners::first()`/`last()` alias `model_manager()` (Sunrise's single modeled vanilla client reload anchor), with no synthetic `minecraft:first` or `minecraft:last` nodes or auto-edges in `get_registry()` / `get_graph()`. Topological sorting links only dangling non-`minecraft` listeners after the anchor and breaks ties by registration order. `ServerReloadListeners::get_last_vanilla_listener()` always borrows the static `VanillaServerListeners::functions()` ID (use `GlobalLootModifierManager::key().id()` if you explicitly want to order against `neoforge:loot_modifiers`). Handled `Err` results from `add_listener` or `add_dependency` no longer poison `finish()`; propagate or panic if a registration error must abort the reload. `ReloadResourceError` now formats its full `Error::source()` chain automatically.
"""
