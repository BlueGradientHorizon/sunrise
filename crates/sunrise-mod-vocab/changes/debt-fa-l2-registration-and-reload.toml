why = "Aligns client registration and reload listener hooks with vanilla 26.3 and NeoForge: particle groups drop the minecraft-namespace ban and fail client startup on duplicate IDs (NeoForge RegisterParticleGroupsEvent.java, hook version 3); model layers drop the minecraft-namespace ban, keep the last mod supplier per ID and reject exact collisions with vanilla keys in entity-models.json (NeoForge ClientHooks.java and vanilla LayerDefinitions.java, hook version 3); render pipelines drop the mod-namespace ownership gate and fail client startup on duplicate IDs (NeoForge RegisterRenderPipelinesEvent.java and RenderPipelines.java.patch, hook version 3); standalone model bakers drop the sticky append failure latch so the baker's Result controls publication (NeoForge StandaloneModelLoader.java); server and client reload listener registries remove synthetic minecraft:first/minecraft:last boundary nodes and auto-edges, remove the sticky registration failure latch, keep get_last_vanilla_listener() immutable at VanillaServerListeners::functions() without a pre-added edge for neoforge:loot_modifiers (NeoForge SortedReloadListenerEvent.java, ReloadListenerSort.java, VanillaServerListeners.java, VanillaClientListeners.java, NeoForgeEventHandler.java, hook version 2); and ReloadResourceError::Display walks the full Error::source() chain for logs and /reload replies (matching vanilla ReloadCommand.java cause reporting)."
migrate = """
- `Hooks::register_particle_groups` (v3): any nonempty namespace and path is accepted (including `minecraft`). Duplicate group IDs now fail client startup instead of being skipped; ensure every registered group ID is unique.
- `Hooks::register_layer_definitions` (v3): any valid `<namespace>:<path>#<layer>` ID is accepted (including `minecraft` for non-vanilla keys). Duplicate mod registrations now use last-wins deduplication before running suppliers, and exact collisions with vanilla layer keys in `entity-models.json` fail client startup.
- `Hooks::register_render_pipelines` (v3): the mod-namespace ownership gate is removed; duplicate pipeline IDs now fail client startup instead of being dropped.
- `Hooks::add_server_reload_listeners` (v2) and `Hooks::add_client_reload_listeners` (v2): `VanillaServerListeners::first()`/`last()` alias `functions()` and `VanillaClientListeners::first()`/`last()` alias `model_manager()` with no synthetic `minecraft:first` or `minecraft:last` nodes or auto-edges in `get_registry()` / `get_graph()`. `get_last_vanilla_listener()` always borrows `VanillaServerListeners::functions()` (use `GlobalLootModifierManager::key().id()` if you explicitly want to order against `neoforge:loot_modifiers`). Handled `Err` results from `add_listener` or `add_dependency` no longer poison `finish()`; propagate or panic if a registration error must abort the reload. `ReloadResourceError` now formats its full `Error::source()` chain automatically.
"""
