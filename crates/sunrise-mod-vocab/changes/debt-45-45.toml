why = "Vanilla 26.3 operates directly on live resident block entities in BlockEntityTicker.tick, BlockEntity.setChanged, AbstractContainerMenu.clickMenuButton, AbstractContainerMenu.quickMoveStack, AbstractContainerMenu.doClick (ContainerInput.QUICK_MOVE), and Slot.onTake; NeoForge adds no events for these menu overrides. Generalized BlockEntityTickScope to BlockEntityScope, migrated menu_button, menu_quick_move, and menu_slot_take from detached ModBlockEntity snapshots plus a separate ServerHost to live resident BlockEntityScope/BlockEntityView access in place, removed rollback-before-fallback transaction wrapping on menu_quick_move, and deleted the dead ModBlockEntityView wrapper. When no live resident mod block entity backs a call (a blockless menu, or after removal/replacement), with_view returns None while host() and transaction(...) stay usable; individual writes validate at the boundary, and panicking listeners are contained and disabled for the session."
migrate = '''
Update types and hook pins:
- `BlockEntityTickScope` -> `BlockEntityScope` (update `block_entity_tick` pins from `hook_version = 2` to `3`; `event.subject.with_view`, `event.subject.host()`, and `event.subject.transaction(...)` keep the same names).
- `ModBlockEntityView` -> `BlockEntityView` obtained through `event.subject.with_view(|mut entity| ...)` (`ModBlockEntityView::id` -> `BlockEntityView::id`, `ModBlockEntityView::set_client_update_fields` -> `BlockEntityView::set_client_update_fields`).

Update menu hook signatures and bodies:
- `MenuPart::menu_button` (`hook_version = 3` -> `4`): `fn menu_button(&self, host: &mut dyn ServerHost, event: &mut MenuButtonEvent<'_>)` -> `fn menu_button(&self, event: &mut MenuButtonEvent<'_>)`. Replace `event.entity` reads/edits with `event.subject.with_view(|mut entity| ...)` (`None` on blockless menus or after removal/replacement), and replace `host` with `event.subject.host()` and `event.subject.transaction(...)`.
- `BlockEntityPart::menu_quick_move` (`hook_version = 4` -> `5`): `fn menu_quick_move(&self, host: &mut dyn ServerHost, event: &mut MenuQuickMoveEvent<'_>) -> Flow` -> `fn menu_quick_move(&self, event: &mut MenuQuickMoveEvent<'_>) -> Flow`. Replace `event.entity` and `event.pos` with `event.subject.with_view(|mut entity| ...)` (`entity.position()`, `entity.item_slot(...)`, `entity.set_item_slot(...)`, `entity.nbt()`, `entity.set_nbt(...)`, `entity.data_slots()`, `entity.set_data_slot(...)`). Use `event.subject.host()` for Host calls and wrap edits that must commit atomically across the subject and other storage explicitly in `event.subject.transaction(...)` (there is no implicit rollback-before-fallback transaction). `event.kind` carries the `BlockEntityTypeKey`.
- `BlockEntityPart::menu_slot_take` (`hook_version = 1` -> `2`): `fn menu_slot_take(&self, host: &mut dyn ServerHost, event: &mut MenuSlotTakeEvent<'_>)` -> `fn menu_slot_take(&self, event: &mut MenuSlotTakeEvent<'_>)`. Replace `event.entity` with `event.subject.with_view(|mut entity| ...)`, replace `host` with `event.subject.host()` and `event.subject.transaction(...)`, and note `event.kind: BlockEntityTypeKey`.
'''
