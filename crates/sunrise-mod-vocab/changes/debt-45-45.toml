why = "Generalized BlockEntityTickScope to BlockEntityScope and migrated menu_button, menu_quick_move, and menu_slot_take from detached ModBlockEntity snapshots plus separate ServerHost to live resident BlockEntityScope, matching vanilla BlockEntityTicker.tick, BlockEntity.setChanged, AbstractContainerMenu.clickMenuButton, AbstractContainerMenu.quickMoveStack, and Slot.onTake. When no live resident mod block entity backs a call (such as a blockless menu or after removal/replacement), with_view returns None while host() and transaction(...) stay usable; individual writes validate at the boundary and panicking listeners are contained."
migrate = "Replace any explicit type annotation or import of `BlockEntityTickScope` with `BlockEntityScope`, and update `block_entity_tick` pins to `hook_version = 3`. For `MenuPart::menu_button` (`hook_version = 4`), `BlockEntityPart::menu_quick_move` (`hook_version = 5`), and `BlockEntityPart::menu_slot_take` (`hook_version = 2`), drop the `host: &mut dyn ServerHost` parameter, replace `event.entity` (and `event.pos` on `menu_quick_move`) reads/edits with `event.subject.with_view(|mut entity| ...)` (`None` on blockless menus or after removal/replacement), and use `event.subject.host()` and `event.subject.transaction(...)` for Host/world operations."
