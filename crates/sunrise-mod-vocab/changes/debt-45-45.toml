why = "Generalized BlockEntityTickScope to BlockEntityScope and migrated menu_button from a detached ModBlockEntity snapshot plus separate ServerHost to live resident BlockEntityScope, matching vanilla BlockEntityTicker.tick, BlockEntity.setChanged, and AbstractContainerMenu.clickMenuButton. When no live resident mod block entity backs a call (such as a blockless menu or after removal/replacement), with_view returns None while host() and transaction(...) stay usable; individual writes validate at the boundary and panicking listeners are contained."
migrate = "Replace any explicit type annotation or import of `BlockEntityTickScope` with `BlockEntityScope`, and update `block_entity_tick` pins to `hook_version = 3`. For `MenuPart::menu_button`, drop the `host: &mut dyn ServerHost` parameter (`fn menu_button(&self, event: &mut MenuButtonEvent<'_>)`), replace `event.entity` reads/edits with `event.subject.with_view(|mut entity| ...)` (`None` on blockless menus or after removal/replacement), use `event.subject.host()` and `event.subject.transaction(...)` for Host/world operations, and update `menu_button` pins to `hook_version = 4`."
