why = "Vanilla 26.3's SoundEngine.play and NeoForge's PlaySoundSourceEvent are playback-only; neither offers microphone capture. Native mods are trusted code, so the client host exposes a local PCM reader with distinct endpoint selectors and OS permission errors, without adding consent, codecs, or networking to the engine."
migrate = "Additive: from client setup onward, call `host.microphone_devices()` to enumerate `MicDevice { id, label }` descriptors and `host.open_microphone(&spec)` with `MicSpec::new(channels, rate)` (1 or 2 channels; `MIC_RATE_MIN` = 8000 to `MIC_RATE_MAX` = 48000 Hz) or `.with_device(&device.id)` for a specific input endpoint. When listing or opening, handle `MicRefusal::OsDenied` as an OS permission refusal, separately from `MicRefusal::NoDevice` (no matching input). Read whole interleaved `i16` frames from any thread via `MicRef::read` off the bounded `MIC_RING_MAX_MS` (500 ms) drop-oldest ring, inspect stream format/health via `MicRef::{channels, rate, dropped_frames, is_open}`, and call `MicRef::close` or drop `MicRef` to stop capture and release the OS input device synchronously."
