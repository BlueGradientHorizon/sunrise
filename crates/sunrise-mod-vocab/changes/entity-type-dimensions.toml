ids = ["method:prelude::ItemsHost::entity_type_dimensions", "type:EntityTypeDimensions", "handle:EntityTypeDimensions::new"]
why = "A mod reads an entity type's registered size without spawning one (#6127): `ItemsHost::entity_type_dimensions(entity_type)` is `EntityType.getDimensions()`, the `EntityDimensions` width, height and eye height of vanilla's types and mods' (a mod type has its template's row), on both sides. It is the default before any `entity_size` answer for a live entity, a baby's size or a scale attribute, so a mod can test whether a mob would fit at a position (`EntityType.getSpawnAABB` is `width / 2` either side of x and z and `height` up from y) or size a spawn range, as Ender IO's powered spawner does, without spawning and removing one (which fires join and leave hooks other mods see). `fixed` (`EntityDimensions.fixed`) is not read: the game's entity type table does not carry it."
migrate = "Additive: nothing to change. A mod that spawned a mob once to read its box can call host.entity_type_dimensions(\"minecraft:zombie\")."
