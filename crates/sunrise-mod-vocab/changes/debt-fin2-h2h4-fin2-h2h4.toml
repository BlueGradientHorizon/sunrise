ids = ["method:ConsumeEffectType::new", "type:StackWriteError"]
why = "Vanilla 26.3 UseRemainder.convertIntoRemainder and SulfurCube.setSulfurCubeContent materialize an ItemStackTemplate with its own patch. NeoForge keeps that codec in its ItemStackTemplate patch. Sunrise leaves use_remainder and sulfur_cube_content as saved templates until a consumer needs their stack. This avoids recursively decoding and copying descendant templates while opening or editing the parent."
migrate = "No registration or hook call changes. Keep checking StackWriteError::InvalidEffectPayload for effects on the stack or a child decoded for that write (for example, a bundle entry). For use_remainder and sulfur_cube_content, do not rely on the parent write to invoke load or reject the effect: supply valid fields in the template. A refusal during materialization is reported then and the refused effect is not installed."
