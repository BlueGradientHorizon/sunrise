ids = ["hook:client_packet", "hook:client_packet_send"]
why = "Vanilla Connection.genericsFtw hands the decoded packet to the client listener, and Connection.send passes the original packet to the connection. NeoForge's ClientCommonPacketListenerImpl.handleCustomPayload routes registered payloads without a raw play-packet observer. Sunrise's two play hooks now give every listener the same original borrowed view, and version 3 logs and shows a toast for a panic, disabling just the affected callback so later eligible listeners still run. A failed listener leaves the last accepted cancellation unchanged."
migrate = "Rebuild against version 3 of Hooks::client_packet and Hooks::client_packet_send; the callback signatures are unchanged from the borrowed views. Finish the callback normally for its answer to count: to drop a send, return Flow::Cancel; to clear a prior cancellation, use #[listener(receive_cancelled)], set event.cancelled = false, and return Flow::Continue. Neither setting the bit and then panicking nor a phase refusal changes cancellation. Reassigning event.packet never changes what another listener or the game sees."
