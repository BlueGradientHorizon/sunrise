why = """
Align mod audio streams with vanilla 26.3 and NeoForge by removing engine-invented stream modes, refusals \
and lifecycle states while preserving thread-safe controls and bounded resource guards:
- Single pull-based `AudioStream` API matching NeoForge `SoundInstance.getStream`: removed the separate \
push-ring mode (`AudioClientHost::open_push_audio_stream`, `AudioStreamRef::push`, \
`AudioStreamSource::push`, and the scalar constant `AUDIO_STREAM_RING_MAX_MS`).
- Pull EOF semantics matching vanilla `Channel.pumpBuffers` and `ChannelAccess.scheduleTick`: removed \
`AudioRead` (`AudioRead::Frames`, `AudioRead::Eof`) and changed `AudioStream::read` to return `usize` \
where `0` signals EOF (draining queued frames before stopping) rather than retrying dry reads on every \
device callback.
- Volume clamping matching vanilla `SoundEngine.calculateVolume` (`Mth.clamp(volume, 0.0F, 1.0F)`): finite \
volumes outside `0.0..=1.0` are clamped instead of refused; only `NaN` is refused (`SpecFault::Volume` / \
`set_volume` returning `false`).
- Sample rate validation: removed the scalar constants `AUDIO_STREAM_RATE_MIN` and \
`AUDIO_STREAM_RATE_MAX`; any positive sample rate (`> 0` Hz) is accepted (`SpecFault::Rate` fires only \
for `0`), and the worker downsamples high-rate PCM in bounded reads before queueing it, retaining the source \
position across reads and draining the correct duration at EOF.
- Position validation matching vanilla `Channel.setSelfPosition`: removed the 30-million-block coordinate \
cap; any finite `At([x, y, z])` coordinate is accepted.
- Stereo playback matching OpenAL multi-channel direct playback: removed `SpecFault::StereoPositioned` so \
stereo streams accept any valid placement and play un-spatialized without panning or distance attenuation.
- Entity-bound and level lifecycle matching vanilla `EntityBoundSoundInstance.<init>`, \
`EntityBoundSoundInstance.tick`, `SoundEngine.tickInGameSound`, \
`ClientPacketListener.handleConfigurationStart`, and `Minecraft.clearClientLevel` -> \
`Minecraft.updateLevelInEngines` -> `SoundEngine.stopAll`: removed `AudioStreamState::Unplaced`; \
`StreamPlacement::Entity` is resolved eagerly at open and `AudioStreamRef::set_entity`, entity streams \
check lifetime and stop when untracked or removed even while muted, and all streams stop on level leave, \
configuration re-entry, dimension change, or sound engine stop/reload. NeoForge's `LevelEvent.Unload` \
in `Minecraft.setLevel` and disconnect precedes the sound stop, so it includes streams opened during \
teardown.
- Placement controls: `set_flat` and `set_position` are host-free; `set_entity(host, entity)` needs the \
client thread's `&dyn ClientHost` to resolve the entity immediately. Vanilla hands work across threads \
with `Minecraft.execute` and checks the client thread before touching sounds in \
`ClientPacketListener.handleStopSoundEvent`. In `client_setup`, take the `Some(executor)` from \
`host.client_executor()` and clone it into the network-thread producer holding an `EntityRef`. \
The producer calls `executor.execute(Box::new(move |host| { \
stream.set_entity(host, entity); }))`, the Sunrise equivalent of the client-thread hop in NeoForge's \
`ConnectScreen` patch using `Minecraft.execute`.
- Starvation guards: raised the scalar constants `AUDIO_STREAMS_PER_MOD` (32 -> 256) and \
`AUDIO_STREAMS_TOTAL` (64 -> 1,024), keep counting stopped streams against their owner until the pull \
worker retires their job, and bound both per-mod and aggregate PCM ring storage \
(`AudioRefusal::MemoryLimit`) so one owner cannot exhaust shared memory. Every limit refusal logs a \
warning naming the mod."""
migrate = """
- Delete `AudioRead` imports and `AudioRead::Frames` / `AudioRead::Eof` uses. Update \
`AudioStream::read(&mut self, pcm: &mut [i16])` to return `usize`: map `AudioRead::Frames(n)` for `n > 0` \
to `n`, map `AudioRead::Eof` to `0` (draining queued frames before stopping), and replace \
`AudioRead::Frames(0)` with a positive frame count `n > 0` without writing to the zeroed `pcm` slice when \
playback should continue with temporary silence.
- Remove `AudioClientHost::open_push_audio_stream`, `AudioStreamRef::push`, `AudioStreamSource::push`, \
and `AUDIO_STREAM_RING_MAX_MS`, and delete `open_push_audio_stream` from any mock or test \
`AudioClientHost` implementations. Open every stream with `host.open_audio_stream(&spec, Box::new(source))` \
and bridge async or network producers through a mod-owned nonblocking buffer drained inside \
`AudioStream::read`.
- Replace `stream.set_placement(&placement)` calls with `stream.set_flat()` for `StreamPlacement::Flat` \
(any thread, no host), `stream.set_position(at)` for `StreamPlacement::At(at)` (any thread, no host), or \
`stream.set_entity(host, entity)` for `StreamPlacement::Entity(entity)` (client thread with \
`&dyn ClientHost` for eager entity resolution). In `client_setup`, use `let Some(executor) = \
host.client_executor() else { return; };` and clone it into a network-thread producer holding \
an `EntityRef`; there call \
`executor.execute(Box::new(move |host| { if !stream.set_entity(host, entity) { /* report refusal */ } }))`. \
Move an owned `AudioStreamRef` or a clone of its `Arc` into the closure, not the old host or payload \
context. In custom `AudioStreamSource` implementations (such as tests), remove `fn push` and update \
`fn set_placement(&self, placement: &StreamPlacement, entity_pos: Option<[f64; 3]>) -> bool`.
- Remove `AudioStreamState::Unplaced` and `SpecFault::StereoPositioned` match arms; `AudioStreamState` is \
now only `Playing` or `Stopped`.
- Handle `AudioRefusal::MemoryLimit` like any other opening failure (returned when your mod's or the \
pool's PCM ring budget is exhausted or ring allocation fails). End a stream to release its PCM budget; \
its bytes still count until the worker retires its job.
- Remove imports of the removed scalar constants `AUDIO_STREAM_RATE_MIN` and `AUDIO_STREAM_RATE_MAX`; any \
`rate > 0` is accepted and `SpecFault::Rate` reports only `rate == 0`. `AUDIO_STREAMS_PER_MOD` is now 256 \
and `AUDIO_STREAMS_TOTAL` is now 1,024 (per-mod and total limits also include stopped streams until the \
pull worker retires their jobs).
- Finite volumes outside `0.0..=1.0` are now clamped to `0.0..=1.0` instead of returning \
`SpecFault::Volume` or `false` from `set_volume`; only `NaN` is refused.
- Finite `At([x, y, z])` coordinates past 30 million blocks are now accepted, and stereo streams accept \
`At` and `Entity` placements (playing un-spatialized).
- Ensure an `Entity` is currently tracked before opening with `StreamPlacement::Entity(entity)` or \
calling `stream.set_entity(host, entity)` (otherwise open returns `SpecFault::Position` and `set_entity` \
returns `false`). Streams now stop instead of becoming `Unplaced` when their entity is removed/untracked \
(even while mod audio is muted) or when the client leaves the level, re-enters configuration, changes \
dimensions, or reloads/stops sound. Start any replacement stream after teardown, not from the unload \
or disconnecting callback. If a stream stops while following an entity, a concurrent move that loses \
that race returns `false`; reopen a stream when playback should resume."""
