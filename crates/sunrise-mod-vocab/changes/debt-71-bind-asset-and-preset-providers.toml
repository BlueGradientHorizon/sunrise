why = """Bind asset, item-model, animation, and world-preset providers directly at registration instead of registering bare identifier strings and dispatching second-pass runtime hooks across every subscribed mod.

Matches NeoForge 26.3 and vanilla 26.3 registration contracts directly:
- Model loaders (`ModelEvent.RegisterLoaders`) and block-state definitions (`RegisterBlockStateModels`) bind callbacks at startup and invoke only the registered provider once per matching asset during resource load/reload; `ModelLoaderQuad` and `BlockStateModelPick` are now process-local (`// no wire`).
- Atlas sprite sources (`RegisterSpriteSourcesEvent`, `SpriteSources`) bind callbacks directly with borrowed `&dyn ResourceReader`, accept any canonical `<namespace>:<path>` including `minecraft:` with last-writer-wins replacement ahead of vanilla built-ins, and make `SpriteSourceOutput` process-local (`// no wire`).
- JSON keyframe animation types (`RegisterJsonAnimationTypesEvent`, `EntityAnimationLoader`) bind target apply/convert closures and interpolation closures directly into parsed `AnimationHolder` channels (`AnimationTarget::Custom(BoundAnimationTarget)`, `Interpolation::Custom(BoundInterpolation)`), making `AnimationHolder::bake` infallible and removing `AnimationTypes`, `TypedKeyframeAnimation`, `JsonAnimationType`, `RegisteredAnimationType`, `AnimationError`, and `AnimationHolder`'s `Wire` encoding.
- Item tint sources (`RegisterColorHandlersEvent.ItemTintSources`), item models (`RegisterItemModelsEvent`), range-select properties (`RegisterRangeSelectItemModelPropertyEvent`), and select properties (`RegisterSelectItemModelPropertyEvent`) bind decode-time factories (`&Tag -> Result<Arc<Fn>, String>`) evaluated once per JSON node at resource load/reload, returning per-stack closures evaluated directly with zero per-frame JSON reparsing and full `LateBoundIdMapper` override parity (including `minecraft:` built-in overrides).
- World-preset editors (`RegisterPresetEditorsEvent`, vanilla `PresetEditor`) bind factory closures constructing live `Box<dyn PresetEditor>` instances driven directly by the `world_preset_editor` screen with borrowed `PresetEditorContext` and `PresetEditorDraft`, replacing the data-only `PresetEditor` struct and `ScreensClientHost::preset_editor`, and allowing `minecraft:` overrides (e.g. `minecraft:flat`, `minecraft:single_biome_surface`).
- All bound callbacks run through `CallbackOwner` panic containment: returning `Err(reason)` logs a warning/error without disabling the callback; panicking disables that callback for the session, logs an error, and surfaces an in-game error toast naming the mod.
- Also aligns `create_skull_models` with NeoForge `EntityRenderersEvent.CreateSkullModels` (accepting any canonical `<namespace>:<path>` outside the seven built-in vanilla skull types), replaces bespoke item-model config serialization with `Tag` conversion, and removes the dead `has_sprite_source` flag from `sunrise-assets`."""
migrate = """
Rebuild native mods against this SDK and migrate each registration hook from bare string pushes + second-pass hooks to bound providers:

1. Model loaders (`Hooks::register_model_loaders`, version 2; `Hooks::bake_model_loader` removed):
   Replace `event.loaders.push(id)` and `Hooks::bake_model_loader` with `event.register(Identifier::parse(id)?, |input| Ok(quads))`. Read `input.model`, `input.config` (`&Tag`), and `input.textures` (`&BTreeMap<String, String>`). Return `Err(reason)` to report a load error without disabling the loader. `ModelLoaderQuad` is no longer `Wire`.

2. Block-state models (`Hooks::register_block_state_models`, version 2; `Hooks::instantiate_block_state_definition` removed):
   Replace `event.definitions.push(id)` and `Hooks::instantiate_block_state_definition` with `event.register(Identifier::parse(id)?, |input| Ok(picks))`. Read `input.block`, `input.config` (`&Tag`), and `input.states`. Return `Err(reason)` (or `BlockStateModelPick::Reject { reason }`) to refuse a file. `BlockStateModelPick` is no longer `Wire`.

3. Sprite sources (`Hooks::register_sprite_sources`, version 3; `Hooks::sprite_source` removed):
   Replace `event.sources.push(id)` and `Hooks::sprite_source` with `event.register(Identifier::parse(id)?, |input| Ok(outputs))`. Read `input.atlas`, `input.config` (`&Tag`), and `input.resources` (`&dyn ResourceReader`). Return `Err(reason)` to report an error without disabling the provider. `SpriteSourceOutput` is no longer `Wire`.

4. JSON keyframe animation types (`Hooks::register_json_animation_types`, version 2):
   Replace `event.types.push(JsonAnimationType::Target(id))` / `Interpolation(id)` and `impl AnimationTypes` with `event.register_target(id, |part, value| ..., |raw| ...)` and `event.register_interpolation(id, |keyframes, alpha, current_idx, next_idx, scale| ...)`. Replace `holder.bake_with(&root, types)?` and `holder.bake(&root)?` with `holder.bake(&root)` (now infallible, returning `KeyframeAnimation`). Remove `AnimationTypes`, `TypedKeyframeAnimation`, `JsonAnimationType`, `RegisteredAnimationType`, `AnimationError`, and `AnimationHolder::types`. Match `AnimationTarget::Custom(bound)` and `Interpolation::Custom(bound)` by reference (`AnimationTarget`, `Interpolation`, and `Keyframe` are `Clone`, not `Copy`), and note `AnimationHolder` is no longer `Wire`.

5. Item tint sources, item models, range-select properties, and select properties (all version 2; `Hooks::item_tint_source`, `Hooks::item_model_update`, `Hooks::item_model_range_property`, and `Hooks::item_model_select_property` removed):
   - `Hooks::register_item_tint_sources`: replace `event.sources.push(id)` and `Hooks::item_tint_source` with `event.register(id, |config| Ok(move |host, input| argb))`, reading `input.stack` and `input.bundle_selected`.
   - `Hooks::register_item_models`: replace `event.models.push(id)` and `Hooks::item_model_update` with `event.register(id, |config| Ok(move |host, input, layers| { layers.push(...); }))`, reading `input.stack`, `input.bundle_selected`, and `input.context` (`&ItemModelContext`).
   - `Hooks::register_range_select_item_model_property`: replace `event.properties.push(id)` and `Hooks::item_model_range_property` with `event.register(id, |config| Ok(move |host, input| value))`, reading `input.stack`, `input.bundle_selected`, and `input.context`.
   - `Hooks::register_select_item_model_property`: replace `event.properties.push(id)` and `Hooks::item_model_select_property` with `event.register(id, |config| Ok(move |host, input| Some(case)))`, reading `input.stack`, `input.bundle_selected`, and `input.context`.
   Parse JSON config fields once from `&Tag` inside the decode closure and capture the parsed state in the returned per-stack closure.

6. World-preset editors (`Hooks::register_preset_editors`, version 2; `ScreensClientHost::preset_editor` removed):
   Replace `event.editors.push(PresetEditor { preset, screen })` and `host.preset_editor()` with `event.register(Identifier::parse(preset)?, |ctx| Ok(Box::new(MyEditor)))`. Implement the `PresetEditor` trait (`title`, `render`, `mouse_clicked`, `key_pressed`, `char_typed`), inspect `ctx.preset()`, `ctx.dimensions()`, and `ctx.seed()` on open, and mutate dimensions through `draft.set_dimensions(...)` (or `host.preset_editor_dimensions()` / `host.set_preset_editor_dimensions(...)` in screen hooks).
"""
