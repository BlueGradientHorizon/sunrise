ids = ["hook:consume_effect", "handle:LivingRef::apply_consume_effect"]
why = "Vanilla's ConsumeEffect.CODEC binds the effect type at decode, and Consumable.onConsume calls each effect's apply with the original stack and living entity, in list order. NeoForge's IItemExtension use lifecycle and LivingEntity.completeUsingItem patch preserve that finish call before EventHooks.onItemUseFinish. Sunrise now binds native callbacks at decode too; it no longer suppresses nested effects by kind, and a callback panic disables only that mod's consume-effect callback without stopping the rest of the list."
migrate = "Keep Hooks::consume_effect and living.apply_consume_effect(host, &stack, index) unchanged. If you relied on nested same-kind calls returning Some(false) without running, remove that assumption and give your nested chain a stopping condition. For custom effects, treat Some(true) as callback completion, not a state-change result; a missing, disabled or failing callback now returns Some(false)."
