ids = [
    "handle:LivingRef::equipment",
    "handle:LivingRef::hand_item",
    "handle:LivingRef::weapon_item",
    "handle:LivingRef::with_equipment",
    "handle:LivingRef::with_hand_item",
    "handle:LivingRef::with_weapon_item",
]
why = "Living entities lend a single stack instead of copying their equipment and encoding a patch on every read. Item, count and damage are available directly; a mob's separate gear components are applied only when the requested stack is projected."
migrate = "Replace living.equipment(host, slot) with living.with_equipment(host, slot, |stack| ...), living.hand_item(host, hand) with living.with_hand_item(host, hand, |stack| ...), and living.weapon_item(host) with living.with_weapon_item(host, |stack| ...). Each returns Some(callback result), or None without calling the callback if the stack is empty or unavailable or the handle is stale. For an owned stack, use |stack| stack.project() and flatten the returned Option, for example living.with_hand_item(host, hand, |stack| stack.project()).flatten(). The view cannot escape the callback. LootDrops::weapon_item(host) still returns an owned snapshot and still prefers the recorded projectile weapon. UnspawnedMobRef::equipment is unchanged."
