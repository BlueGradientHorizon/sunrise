ids = ["type:PackRegistration"]
why = "NeoForge's Minecraft.rollbackResourcePacks only recovers if a selected pack is optional, both at startup and during a reload. Vanilla's Minecraft.clearResourcePacksOnError saves the cleared selection before recovery starts. Sunrise now uses that order even if opening a pack fails or the required packs still fail, and keeps the accepted mod content and required packs."
migrate = "No code change: keep using PackRegistration::always_active for required packs. They are still loaded during recovery; fix any required-pack error at its source instead of expecting recovery to drop the pack."
