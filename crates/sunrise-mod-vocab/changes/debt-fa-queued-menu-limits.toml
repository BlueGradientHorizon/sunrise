ids = [
    "type:OpenMenuError.TooLarge",
    "handle:PlayerRef::open_mod_menu",
    "handle:RecipeBookLayout::validate",
    "hook:menu_extra_data",
]
why = """
Remove invented 256-slot/data-slot caps and the 32 KiB `menu_extra` cap, and conform retained mod callbacks to the uniform panic/refusal failure rule.
- Vanilla 26.3 (`AbstractContainerMenu`, `ClientboundContainerSetDataPacket`, `FriendlyByteBuf.readByteArray`) and NeoForge (`AdvancedOpenScreenPayload` / `NeoForgeStreamCodecs.UNBOUNDED_BYTE_ARRAY`) have no 256-slot or 32 KiB cap; `MAX_MENU_SLOTS` is raised to `i16::MAX as u16` (32,767, the non-negative 16-bit signed index range of vanilla container packets), `STOCK_NATIVE_DATA_CAPACITY` is deleted, `RecipeBookLayout::validate` and `CheckedSlotLayout::new` drop their 256-slot cap, and `menu_extra::MAX_DATA` and `OpenMenuError::TooLarge` are removed.
- Retained mod callbacks (`DebugEntry`, `DebugRenderer`, `GuiLayerBody`, `DimensionTransitionScreen`, `DimensionTransitionPresentation`, and `OwnedMenuScreen`) route through `CallbackOwner`, which logs loudly via `log::error!`, disables only that callback for the session on panic, and enqueues a client error toast naming the mod.
- Non-panic phase refusals (`PhaseRefusal::report`) log on every refusal instead of latching once per `(mod, operation, phase)`.
"""
migrate = """
Remove any match arm referencing `OpenMenuError::TooLarge` and any code assuming a 256-slot/data-slot cap or 32 KiB `menu_extra` cap.
"""
