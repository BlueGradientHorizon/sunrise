why = """
Registry declaration no longer means that clients need the mod. Like NeoForge's NewDatapackRegistryEvent.worldRegistry and reloadableRegistry and DataPackRegistriesHooks.addWorldRegistry, and vanilla's RegistryDataLoader.load, local loading is distinct from what is sent to clients. Only a Required registry makes a server-only package incompatible with the join-content rule; the load refusal names the registry.

Vanilla's ResourceManagerRegistryLoadTask.load selects the winning resource and RegistryLoadTask.PendingRegistration.loadFromResource reads it with pack attribution. Local registry loading now reads the whole winner and checks its schema, references and tags without the transport ceilings. Entries and tags share NeoForge's Registries.registryDirPath and CommonHooks.prefixNamespace convention: only a non-minecraft registry namespace adds a folder. Like vanilla's FileToIdConverter.registry, each declared directory can claim the same physical winner independently. As in RegistryDataLoader.load, local staging checks references against the complete set and names the pack that supplied the referring entry.

Only the negotiated snapshot is encoded. A single offer uses vanilla's ServerboundCustomPayloadPacket.MAX_PAYLOAD_SIZE (32,767 bytes), and each snapshot fragment, including its header, uses ClientboundCustomPayloadPacket.MAX_PAYLOAD_SIZE. A reassembled snapshot uses NeoForge's 128 MiB NeoForgeLocalConfig.splitPacketMaxSizeLimitMb default as applied by GenericPacketSplitter.receivedPacket. Like vanilla's ClientboundRegistryDataPacket.STREAM_CODEC using ByteBufCodecs.list(), there is no separate registry, entry, tag or tag-member ceiling; MAX_INITIAL_COLLECTION_SIZE is an allocation hint, not a rejection rule.

NeoForge's ConditionalOps.ConditionalDecoder decodes the entire ICondition.LIST_CODEC before testing it. The decoded built-in operands identify the context reads in RegisteredCondition.test and TagEmptyCondition.test; a string in a custom condition's arguments is not a read. Testing now stops when the result is known, as in ConditionalDecoder, AndCondition.test and OrCondition.test, without hiding decode errors in untested branches.

NeoForge's ConditionalOps.ConditionalDecoder.decode treats an exception from ICondition.test as an error, not a false condition. Sunrise attributes native handler errors to the registering mod and uses the retained callback policy to report a panic in the log and error toast and disable just that handler for the session. Ordinary errors and phase refusals do not disable it.

Vanilla's WorldLoader binds pending static tags before RegistryDataLoader.load. ResourceManagerRegistryLoadTask.load registers decoded entries before binding their tags, and NeoForge's RegisteredCondition.test and ConditionContext.getTag read bound holders, not file names. Registry conditions now see the candidate's static and frozen registries and already bound dependency batches. Self-reads and reads within a cycle see unbound holders; downstream registries see that batch only after it binds. Registry codecs use the task's VANILLA_SET, while NeoForge's ReloadableServerResources supplies the world's enabled features to the downstream listeners.
"""
