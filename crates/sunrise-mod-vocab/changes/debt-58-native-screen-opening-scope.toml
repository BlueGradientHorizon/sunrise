ids = ["hook:screen_draw", "hook:screen_click", "hook:screen_tooltip", "method:prelude::ScreensClientHost::screen_pos", "method:prelude::ScreensClientHost::screen_extra_data", "method:prelude::ScreensClientHost::screen_slot", "method:prelude::ScreensClientHost::set_screen_slot"]
why = "The window owns the native screen for one menu opening. Replacing a menu, even with the same window id, discards the old opening's data, layout changes and recipe-book catalogue. Refusing an opening does not install its screen."
migrate = "No call changes. Read the current opening's position and bytes with host.screen_pos() and host.screen_extra_data(), and read live values in the current screen callback. If your mod wants a slot moved or hidden on each new opening, call host.set_screen_slot(menu, slot, position) for each opening instead of carrying an override across a reused window id."
