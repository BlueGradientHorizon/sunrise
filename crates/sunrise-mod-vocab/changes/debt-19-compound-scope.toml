ids = [
    "handle:PlayerRef::persistent_data",
    "handle:PlayerRef::set_persistent_data",
    "handle:PlayerRef::set_persistent_data_key",
    "handle:BlockEntityRef::lock",
    "type:PlayerDataRefusal",
    "type:PlayerDataRefusal.TooDeep",
    "type:PlayerPersistentDataError",
]
why = "Player persistent data and block entity locks already live in the game; reads now borrow their compounds instead of copying them and distinguish absence from stored emptiness. A player write checks and edits one key without replacing unrelated data. Synthesized block entity save data and whole-lock replacement are unchanged. An abort restores recorded player data and inventory even if the player is dead, is in another level, or has yielded the acting turn to another guest. Vanilla's Inventory.setItem writes to the player's own inventory; NeoForge's PlayerInventoryWrapper uses that inventory and SnapshotJournal.onClose restores the journaled storage directly. NeoForge's Entity.getPersistentData likewise belongs to the entity, not its level."
migrate = "Read `player.persistent_data(host)` and `entity.lock(host)` as `Option<&Compound>`; append `.cloned()` only if you need an owned snapshot. Player data now returns `None` for no stored compound. Replace `player.set_persistent_data(host, data)` with `player.set_persistent_data_key(host, &key, Some(&tag))` for each literal NBT `JavaString` key you intend to insert or replace, and pass `None` for each key you intend to remove. Removing the last key leaves an empty compound; removing a missing key creates nothing. Match these edits' errors on `PlayerPersistentDataError` instead of `PlayerDataRefusal`, including `TooDeep`; handle `InvalidNbt` along with the existing player refusals. If an edit uses an old tag or a list of keys from a read, take an owned copy of just what you need before borrowing the host mutably. For rollback, keep using host.transaction and return Err to restore recorded player data and inventory; no extra calls are needed."
