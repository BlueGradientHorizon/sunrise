why = "Player persistent data and block entity locks already live in the game; reads now borrow their compounds instead of copying them and distinguish absence from stored emptiness. A player write checks and edits one key without replacing unrelated data. Synthesized block entity save data and whole-lock replacement are unchanged."
migrate = "Read `player.persistent_data(host)` and `entity.lock(host)` as `Option<&Compound>`; append `.cloned()` only if you need an owned snapshot. Player data now returns `None` for no stored compound. Replace `player.set_persistent_data(host, data)` with `player.set_persistent_data_key(host, &key, Some(&tag))` for each literal NBT `JavaString` key you intend to insert or replace, and pass `None` for each key you intend to remove. Removing the last key leaves an empty compound; removing a missing key creates nothing. Match these edits' errors on `PlayerPersistentDataError` instead of `PlayerDataRefusal`, including `TooDeep`; handle `InvalidNbt` along with the existing player refusals. If an edit uses an old tag or a list of keys from a read, take an owned copy of just what you need before borrowing the host mutably."
