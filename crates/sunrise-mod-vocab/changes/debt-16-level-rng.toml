why = "Level handles and restricted level hosts now lend the live random stream instead of letting listeners copy or replace its state. A draw that unwinds restores the seed and cached Gaussian. Transactional draws keep the first snapshot of each stream, including parked levels, for rollback."
migrate = "Replace `let mut rng = level.random(host)?; let roll = rng.next_int_bound(bound); level.set_random(host, rng);` with `let roll = level.with_random(host, |rng| rng.next_int_bound(bound))?;`. Existing `LevelRef::with_random` calls keep their signature. On `dyn LevelRandomHost`, `dyn HitHost`, or `dyn LevelWriteHost`, replace `let mut rng = host.random()?; let roll = rng.next_int_bound(bound); host.set_random(rng);` with `let roll = host.with_random(|rng| rng.next_int_bound(bound))?;`. There is no way to reseed the level; use `LegacyRandomSource::new(seed)` for your own independent stream. If you implement a restricted test host, replace its `random` and `set_random` methods with `fn lend_random(&mut self, draw: RandomDraw<'_>)` and use `draw.run(&mut self.rng)` for a loan; restore the original stream on unwind. Omit `lend_random` to decline every draw."
