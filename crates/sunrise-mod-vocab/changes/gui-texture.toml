ids = ["type:GuiDraw", "type:GuiDraw.Texture", "type:GuiPaintError", "type:GuiPaintError.TextureSize"]
why = "gui_paint blits a standalone texture (#4633): GuiDraw::Texture { id, x, y, w, h, uv, src, tex, color }, GuiGraphicsExtractor.blit with an Identifier. The id is the exact resource from the active resource stack, any namespace, never rewritten; it loads on first use and stays loaded until a reload. innerBlit's UVs, unclamped; the sampler from the winning .png.mcmeta (blur: linear, clamp: clamp-to-edge, no mipmaps); a missing or undecodable image draws vanilla's missing texture in place. A tex with a zero side or a non-finite uv refuses the buffer with GuiPaintError::TextureSize."
migrate = "A match on GuiDraw needs an arm for Texture (or a wildcard). GuiPaintError is non_exhaustive: no change."
