why = """\
Follows NeoForge's `LivingIncomingDamageEvent.addReductionModifier`, `LivingDamageEvent.Pre` / \
`LivingDamageEvent.Post`, `DamageContainer`, and `IReductionFunction`, alongside vanilla 26.3's \
`LivingEntity.hurtServer`, `LivingEntity.actuallyHurt`, and `Player.actuallyHurt`. \
The three living-damage hooks now lend the engine's live `DamageContainer` directly—mutable \
`DamageContainer<'_>` in `living_incoming_damage` and `living_damage_pre`, and read-only \
`DamageContainerView<'_>` in `living_damage_post`—removing the `DamageValues` snapshot layer and \
the `ReductionChange` command enum. Reduction modifiers are now owned native closures \
(`impl FnMut(DamageContainerView<'_>, f32) -> f32 + 'static`) runnable from both \
`living_incoming_damage` and `living_damage_pre`, executed in registration order at each stage \
with accurate live container state (`new_damage` and prior reductions updated before each stage). \
Matching NeoForge's `DamageContainer` and `actuallyHurt` semantics, modified reductions are \
recorded verbatim without clamping to `[0, limit]` or replacing `NaN` (only resulting damage \
floors at `0.0`), and `Reduction::Absorption` receives `damage.min(hearts)`, records the modified \
value verbatim, sets remaining damage to `max(damage - modified, 0)`, and deducts \
`damage.min(modified)` from absorption hearts floored at `0.0`. A panicking reduction callback \
disables that mod's reduction callbacks for the session and reports loudly (error log plus error \
toast naming the mod) while leaving the reduction unchanged; non-panic phase refusals log a \
warning on every occurrence without latching.\
"""
migrate = """\
- Hook event fields: `LivingIncomingDamageEvent.container` and `LivingDamagePreEvent.container` \
are now `DamageContainer<'a>` instead of `&'a mut DamageContainer`, and \
`LivingDamagePostEvent.container` is now `DamageContainerView<'a>` instead of \
`&'a DamageContainer`. Method calls like `event.container.new_damage()` and \
`event.container.set_new_damage(v)` continue to work directly; replace any `&mut *event.container` \
with `&mut event.container`, any `&*event.container` on Post with `event.container` (a `Copy` \
read-only view), and any `DamageContainer::as_view` borrow where a read-only view is needed. \
Update manifest hook version pins if present (`living_incoming_damage` -> 4, \
`living_damage_pre` -> 3, `living_damage_post` -> 3).
- Reduction modifiers: remove `ReductionChange` imports and replace enum commands with closures \
receiving `(view: DamageContainerView<'_>, amount: f32) -> f32`:
  - `ReductionChange::Add(d)` -> `move |_view, amount| amount + d`
  - `ReductionChange::Scale(k)` -> `move |_view, amount| amount * k`
  - `ReductionChange::AtLeast(min)` -> `move |_view, amount| amount.max(min)`
  - `ReductionChange::AtMost(max)` -> `move |_view, amount| amount.min(max)`
  Closures may inspect live hit state (`view.original()`, `view.new_damage()`, prior \
`view.reduction(...)`) and may be registered in `living_damage_pre` as well as \
`living_incoming_damage` (for example for `Reduction::Absorption`).
- Removed snapshot helpers: `DamageValues`, `DamageValues::reduction`, \
`DamageValues::set_reduction`, `DamageContainer::new`, `DamageContainer::reduction_modifiers`, \
`From<DamageValues>`, `From<&DamageContainer>`, `Clone`, `PartialEq`, and `Wire` on \
`DamageContainer` are removed. Read values directly from `DamageContainer` or \
`DamageContainerView` inside the hook and store only the plain scalars you need across ticks; in \
tests, construct a live hit through the engine or dispatch with a live backend rather than \
building a standalone `DamageContainer::new(...)`.\
"""
