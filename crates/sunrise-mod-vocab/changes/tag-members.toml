ids = ["method:Tags::items", "method:Tags::blocks", "method:Tags::fluids", "type:TagMembers"]
why = "A loaded item, block or fluid tag can have no members. The Tags list methods now distinguish that state from a missing tag and an unavailable registry snapshot."
migrate = "Match TagMembers::Members(keys) for ordered members, TagMembers::Missing for an absent tag, and TagMembers::Unavailable when the registry snapshot or a key mapping is not ready. An empty Members list is not Missing. Tags::is_in_tag is unchanged."
