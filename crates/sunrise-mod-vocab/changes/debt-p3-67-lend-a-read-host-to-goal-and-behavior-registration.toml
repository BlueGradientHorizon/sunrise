why = "Vanilla's Mob constructor runs registerGoals and LivingEntity's makeBrain, with the level in reach; a Part that picks a goal or behavior from a registry lookup had no Host to look through. Both hooks now carry the game's read Host, and the game fires them where it constructs the mob (spawning, loading, births, summons) instead of inside the engine's mob constructor."
migrate = """
Add a first parameter `host: &dyn Host` to `register_goals` and `register_behaviors`: `fn register_goals(&self, host: &dyn Host, event: &mut RegisterGoalsEvent<'_, '_>)`. Registry lookups that went around the missing host now use it. A part keeps adding the same goals and behaviors; they register at the same moments, and the host is read-only.
"""
