ids = [
    "hook:item_picked_up",
    "handle:ItemEntityRef::set_stack",
    "handle:ItemEntitySubjectView::pickup_delay",
    "handle:ItemEntitySubjectView::set_stack",
]
why = "Matches vanilla 26.3 ItemEntity.setPickUpDelay, setItem, tick, and addAdditionalSaveData, and NeoForge ItemEntityPickupEvent.Pre at ItemEntity.playerTouch: ItemEntity::pickup_delay now stores vanilla's signed i32 counter directly without the legacy u32::MAX infinite-delay alias and saves age/pickupDelay with vanilla's (short) narrowing (omitting Item when empty); ItemEntityRef::set_stack and ItemEntitySubjectView::set_stack accept Option<ItemStack> (allowing None or air to store an empty stack that normal ItemEntity.tick discards on its next tick, rather than refusing empty stacks); ItemEntitySubjectView::pickup_delay returns i32 directly; and a TriState::False veto in item_picked_up (hook version 2 to 3) vetoes only the current pickup attempt without imposing a ten-tick pickup delay."
migrate = '''
- `item.set_stack(host, stack)` on `ItemEntityRef` and `view.set_stack(stack)` on `ItemEntitySubjectView` now take `Option<ItemStack>`: pass `Some(stack)` for a non-empty stack, or `None` (or an air stack) to empty the item entity and let normal `ItemEntity.tick` discard it on its next tick. Use `EntityRef::discard` or `EntityRef::remove` if you need immediate removal.
- `view.pickup_delay()` on `ItemEntitySubjectView` now returns `i32` directly instead of `Option<i32>`; drop the `.unwrap()` / pattern match on `Some`.
- `Hooks::item_picked_up` (version 2 -> 3): returning `TriState::False` no longer sets a 10-tick pickup delay on the item entity. Listeners that want a cooldown after refusing a pickup must call `event.item.set_pickup_delay(host, ticks)` (or `set_default_pickup_delay`) explicitly.
'''
