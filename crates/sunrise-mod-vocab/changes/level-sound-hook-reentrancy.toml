ids = ["hook:play_level_sound_at_position", "hook:play_level_sound_at_entity"]
why = "Adds a panic-safe re-entrancy guard to play_level_sound_at_position and play_level_sound_at_entity so sounds played from inside a level-sound listener are resolved without re-dispatching to level-sound listeners and delivered or journaled normally in call order."
migrate = "Rebuild against the updated SDK. Sounds played from inside a level-sound listener are no longer re-dispatched to level-sound listeners."
