why = "Replaces mod-owned immediate-mode widget state (`Widgets`, `Outcome`, `Widget`, `WidgetId`, `TextFieldView`, `TextFieldLayout`, `DrawContext::widget_button`, `DrawContext::widget_text_field`) with engine-mounted screen widgets (`Button`, `ButtonState`, `TextField`, `ScreenWidget`, `ScreenWidgetId`, `ScreenWidgets`) registered in `screen_init_post`, matching vanilla `Button.Builder` / `Button.OnPress`, `EditBox`, `GuiEventListener`, `Screen.addRenderableWidget` and NeoForge `ScreenEvent.Init.Post`. Aligns screen mouse and keyboard hooks to vanilla `MouseHandler` (250 ms same-screen same-button `double_click`) and NeoForge `ScreenEvent.MouseButtonPressed.{Pre,Post}`, `ScreenEvent.MouseButtonReleased.Post` (collect `handled`), `ScreenEvent.MouseDragged.Post` / `MouseScrolled.Post` (unhandled on receiving screen), `ScreenEvent.KeyPressed.Post` / `KeyReleased.Post`, and `ScreenEvent.CharacterTyped.Post` (non-cancellable notice)."
migrate = "Mount buttons, text fields and custom `ScreenWidget` implementations through `event.widgets` in `Hooks::screen_init_post` using `Button::new` / `Button::inactive` and `TextField::new` callbacks instead of keeping a `Widgets` group or calling `DrawContext::widget_button` / `widget_text_field`. Update `screen_mouse_button_pressed_pre` and `screen_mouse_button_pressed_post` for `event.double_click`, read/set `event.handled` in mouse press/release Post hooks, and return `()` from `screen_char_typed_post`."
