why = """
A failed listener could leave half of its registrations live, replace an earlier listener's provider or leak preparation errors. Preserve the successful registration order and replacement rules of NeoForge's RegisterColorHandlersEvent, EntityRenderersEvent.RegisterRenderers, RegisterParticleProvidersEvent, RegisterCauldronFluidContentEvent and RegisterEvent, and vanilla 26.3's BlockColors.register, ClientLevel tint-cache setup, EntityRenderers.register, ParticleResources.register, VillagerProfession.bootstrap and EnchantmentEffectComponents.register.

For the duplicate-aware registrars, the anchors are vanilla 26.3's SpecialModelRenderers.bootstrap and NeoForge's RegisterSpecialModelRendererEvent.register; vanilla's TestFunctionLoader.runLoaders and NeoForge's RegisterGameTestsEvent.registerTest; and vanilla's ResourceManagerRegistryLoadTask.load with NeoForge's condition-codec extension in RegistryLoadTask.PendingRegistration.loadFromResource and NeoForgeRegistries.CONDITION_SERIALIZERS (registered via RegisterEvent). FMLModContainer.onEventFailed is a precedent for reporting loading-bus failures, and vanilla's SystemToast is the presentation model. Discarding the failing mod's edits and disabling only its panicking callback is Sunrise's isolation policy, not NeoForge's bus behavior.

The game-owned registrars follow the existing moments: vanilla 26.3's EntityRenderDispatcher.onResourceManagerReload and LivingEntityRenderer.addLayer with NeoForge's EntityRenderersEvent.AddLayers, vanilla's HumanoidArmorLayer.renderArmorPiece with NeoForge's RegisterClientExtensionsEvent.registerItem, and vanilla's CauldronInteraction.Dispatcher.put with NeoForge's RegisterCauldronInteractionEvent.Interaction. Staging leaves layer order, equipment bindings and cauldron selection and duplicate reporting unchanged for completed callbacks.
"""
migrate = """
Keep the same Hooks methods, contexts and registrar calls: event.sources.register, event.resolvers.register, event.contents.register, event.effects.register, event.professions.register, event.renderers.register, event.providers.register, event.functions.register and event.functions.register_test, or event.conditions.register and event.conditions.register_handler. Update any hook_version pins from 1 to 2 for register_block_tint_sources, register_color_resolvers, register_cauldron_fluid_content, register_enchantment_damage_effects, register_villager_professions, register_entity_renderers, register_particle_providers and register_game_tests; update register_special_model_renderer and register_load_conditions from 2 to 3.

A panicking listener's pending entries, replacements and replacement reports are discarded before the next listener runs; only that mod's callback for that hook is disabled for the session and named in the log and client error toast. A phase refusal also discards the current batch, but is reported on each invocation and does not disable the listener. Use colour-resolver handles only from successful registrations: a rejected entry does not reserve a slot. A failed game-test registration listener publishes neither definitions nor functions. A load-condition listener that completes but ignores a built-in or duplicate ID error still refuses preparation; if the listener panics or incurs a phase refusal, neither its handlers nor its preparation errors survive.

For register_entity_layers, register_client_item_extensions and register_cauldron_interaction, update hook_version pins from 1 to 2. Keep event.layers.add, event.extensions.register_model/register_texture/client_item_extensions, and event.interactions.register/register_tag/register_to_all/register_tag_to_all. A discarded layer callback adds no layers. A discarded item-extension callback publishes neither bindings nor item providers: do not retain the model or texture references it obtained. A discarded cauldron callback leaves neither rows nor registrations queued for all dispatchers. Registration errors from completed item-extension and cauldron callbacks still refuse preparation even if the callback ignored the returned error.

For exact-build native replacements, rebuild and change the mutable registrar parameter on the native_register_* target: BlockTintSources -> BlockTintRegistry, ColorResolvers -> ColorResolverRegistry, CauldronFluidContents -> CauldronFluidContentRegistry, EnchantmentDamageEffects -> EnchantmentDamageRegistry, VillagerProfessions -> ProfessionDeclarations, EntityRenderers -> EntityRendererRegistry, ParticleProviders -> ParticleProviderRegistry, SpecialModelRenderers -> SpecialModelRendererRegistry, GameTests -> GameTestFunctions, LoadConditions -> LoadConditionDeclarations, EntityLayers -> game::native_entity_layers::LayerRegistration<'_>, ClientItemExtensionsRegistrar -> game::client_item_extensions::Registration<'_>, and CauldronInteractions -> game::cauldron_interactions::Registrar<'_>. The parameter remains an &mut reference, now to the concrete owner rather than a dyn trait.
"""
