ids = ["behaviour:hook_dispatch_panic_containment"]
why = "Unify hook dispatch failure handling across every generated hook, chunk-disk callback, and startup Hooks::register instead of mixing isolate-only poisoning, ad-hoc per-feature catch_unwind wrappers, and latched refusal warnings. Follows NeoForge's NeoForge.EVENT_BUS and FML's FMLModContainer::onEventFailed (error logging naming the mod and event) together with vanilla 26.3's SystemToast error toast (a per-install failure queue drained directly into non-vetoable red-titled client system toasts; headless dedicated servers log without draining client toasts), plus per-(hook, mod) isolation, full rollback of mutable event fields and transactional host writes in every phase including World, and panic-hook deferral on client, integrated server, and worker threads so contained hook panics never write crash reports or abort the process. Non-panic refusals (phase refusals and output-validator refusals) are reported each time and never latched."
migrate = "No hook or host signature changed. A mod callback that panics in any hook (including chunk-disk callbacks and startup Hooks::register) is now caught, rolled back, disabled for that hook for the rest of the session, and reported once via an error log line and (on clients) a non-vetoable error toast instead of unwinding out of dispatch or triggering a crash report/exit; its other hooks and other mods continue running. Repeated phase refusals and output-validator refusals are logged every time they occur rather than being suppressed after the first warning."
