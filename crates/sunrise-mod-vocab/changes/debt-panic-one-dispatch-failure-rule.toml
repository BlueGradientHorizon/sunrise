ids = ["behaviour:hook_dispatch_panic_containment"]
why = "Unify hook dispatch failure handling across every generated hook instead of mixing isolate-only poisoning, ad-hoc per-feature catch_unwind wrappers, and latched refusal warnings. Follows NeoForge's NeoForge.EVENT_BUS and FML's FMLModContainer::onEventFailed (error logging naming the mod and event) together with vanilla 26.3's SystemToast error toast (a cross-thread failure queue drained into red-titled system toasts), plus per-(hook, mod) isolation so one mod's panic cannot crash the game or stop unrelated mods or hooks. Non-panic refusals (phase refusals and output-validator refusals) are reported each time and never latched."
migrate = "No hook or host signature changed. A mod callback that panics in a non-isolated hook is now caught, disabled for that hook for the rest of the session, and reported once via an error log line and error toast instead of unwinding out of dispatch; its other hooks and other mods continue running. Repeated phase refusals and output-validator refusals are logged every time they occur rather than being suppressed after the first warning."
