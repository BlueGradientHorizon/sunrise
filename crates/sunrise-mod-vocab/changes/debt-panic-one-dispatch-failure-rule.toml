ids = [
    "hook:register_block_tint_sources",
    "hook:register_color_resolvers",
    "hook:register_cauldron_fluid_content",
    "hook:register_enchantment_damage_effects",
    "hook:register_villager_professions",
    "hook:register_entity_renderers",
    "hook:register_particle_providers",
]
why = "A failed listener could leave half of its registrations live or replace an earlier listener's provider. Preserve the successful registration order and replacement rules of NeoForge's RegisterColorHandlersEvent, EntityRenderersEvent.RegisterRenderers, RegisterParticleProvidersEvent, RegisterCauldronFluidContentEvent and RegisterEvent, and vanilla 26.3's BlockColors.register, ClientLevel tint-cache setup, EntityRenderers.register, ParticleResources.register, VillagerProfession.bootstrap and EnchantmentEffectComponents.register. FMLModContainer.onEventFailed is a precedent for reporting loading-bus failures, and vanilla's SystemToast is the presentation model. Discarding the failing mod's edits and disabling only its panicking callback is Sunrise's isolation policy, not NeoForge's bus behavior."
migrate = "The Hooks methods, contexts and registrar calls are unchanged: keep event.sources.register, event.resolvers.register, event.contents.register, event.effects.register, event.professions.register, event.renderers.register or event.providers.register. Change any hook_version pin for one of these seven hooks from 1 to 2. A panicking listener's pending entries and replacements are discarded before the next listener runs; only that mod's callback for that hook is disabled for the session and named in the log and client error toast. A phase refusal also discards the current batch, but is reported on each invocation and does not disable the listener. Use colour-resolver handles only from successful registrations: a rejected entry does not reserve a slot. For exact-build native replacements, rebuild and change the mutable registrar parameter on the native_register_* target: BlockTintSources -> BlockTintRegistry, ColorResolvers -> ColorResolverRegistry, CauldronFluidContents -> CauldronFluidContentRegistry, EnchantmentDamageEffects -> EnchantmentDamageRegistry, VillagerProfessions -> ProfessionDeclarations, EntityRenderers -> EntityRendererRegistry, ParticleProviders -> ParticleProviderRegistry, SpecialModelRenderers -> SpecialModelRendererRegistry, GameTests -> GameTestFunctions, and LoadConditions -> LoadConditionDeclarations. The parameter remains an &mut reference, now to the concrete owner rather than a dyn trait."
