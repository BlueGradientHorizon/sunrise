why = "Player names, addresses, brands and nicknames can be read without copying their text. Announced channels share a snapshot so a reader can keep it without holding the connection lock or copying every channel. Empty values, refusals and announcement order are unchanged."
migrate = """
Replace `player.name(host).as_deref()`, `player.address(host).as_deref()` and `player.client_brand(host).as_deref()` with `player.name(host)`, `player.address(host)` and `player.client_brand(host)`: each now returns `Option<&str>`. Use `.map(str::to_owned)` on the option if you need to keep the text beyond the host borrow or pass a String.
`player.nickname(host)` now returns `Result<Option<&str>, PlayerWorldRefusal>`. Compare with `Ok(Some("nickname"))` instead of `Ok(Some("nickname".to_owned()))`; use `player.nickname(host)?.map(str::to_owned)` if you need an owned nickname.
`player.announced_channels(host)` now returns `Option<Arc<[String]>>`. Bind `let channels = player.announced_channels(host)?;` and read or iterate `channels.as_ref()`. Use `.map(|channels| channels.to_vec())` only if you need an owned, editable Vec; to consume just one channel as a String, clone that entry. Call the method again to see any changes made after the snapshot.
"""
