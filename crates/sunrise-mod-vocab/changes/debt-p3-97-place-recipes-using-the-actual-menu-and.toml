ids = [
    "method:RecipeBooksRegistrar::recipe_book_type",
    "method:RecipeBooksRegistrar::recipe_book_type_with_fields",
    "method:RecipeBooksRegistrar::recipe_book_filter_look",
    "method:MenusRegistrar::menu_recipe_book",
    "handle:PlayerRef::set_recipe_book_settings",
]
why = "Book, filter sprite and menu link IDs share the vanilla 26.3 Identifier grammar, with explicit namespaces for declarations. RecipeBookComponent.init takes filter sprites and tooltip text without the old registration lengths. RecipeBookSettings.TypeSettings.codec supplies the explicit flat-field layout; CompoundTag.TYPE.loadCompound handles normal NBT limits and duplicate names. As in NeoForge CommonHooks.makeModdedRecipeBookTypesSettingsCodec, malformed settings entries do not erase valid siblings. NeoForge RecipeBookManager.init and RecipeBookSettings use the registered collection without a separate book-count limit. The private play codec uses Identifier.STREAM_CODEC's string width and Varint21LengthFieldPrepender/Connection framing per packet, not a registration, save or whole-catalogue cap. Following vanilla RecipeBookSettings and ServerPlaceRecipe on the ordered play stream, connection admission uses the placed connection's negotiated capability and schema rather than client brand, with no timers, per-second budgets, or Busy/Resnapshot retry state."
migrate = "Keep recipe_book_type(id), recipe_book_type_with_fields(id, open, filtering), recipe_book_filter_look(&book, look) and menu_recipe_book(menu, &book, recipe_type, layout). Pass full IDs (for example your_mod:kitchen/pot) for book, sprite, menu and recipe-type IDs; replace identifiers such as ..:pot, :cooking or your_mod: with the actual complete ID. Both parts must be nonempty; there is no default namespace or whitespace trimming. Remove workaround truncation or count checks for book IDs, flat field names, tooltips, sprite IDs and book registrations. Keep flat field names nonempty, distinct and unchanged for existing saves. Names still have to fit NBT modified UTF-8 when saved, and synchronized IDs have to fit the vanilla Identifier string encoding. Existing saves keep their layout. Keep player.set_recipe_book_settings(host, &book, settings); false still means the player or key is unavailable, never that book storage is full. Upgrade both ends together for private book protocol version 2."
