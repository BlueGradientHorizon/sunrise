ids = ["method:MenusRegistrar::register_menu_screen", "hook:menu_slot_rules", "handle:VanillaKeyMappingRef::is_down", "handle:VanillaKeyMappingRef::set_down", "handle:VanillaKeyMappingRef::click", "method:ClientInputClientHost::vanilla_key_mapping_is_down", "method:ClientInputClientHost::vanilla_key_mapping_set_down", "method:ClientInputClientHost::vanilla_key_mapping_click"]
why = "Vanilla 26.3 MenuScreens.register and NeoForge RegisterMenuScreensEvent.register allow one factory per menu type, including the built-in hopper. HopperMenu demonstrates that a distinct type can expose the same five backing slots plus the player inventory. AbstractContainerMenu.doClick and NeoForge ResourceHandlerSlot use the menu's slot rules for pickup and placement, including where a resource handler owns storage. Vanilla KeyMapping.setDown and click and NeoForge KeyMappingLookup update the same slots that Minecraft.handleKeybinds and Gui.handleKeybinds consume; Gui.setScreen releases the live mappings, including unconsumed plain-key clicks."
migrate = "Replace registration for a stock opener's screen with a distinct mod menu type. For a hopper, declare five backing slots and enable the player inventory, set the block's ModContainer to five slots and menu = Some(\"mymod:hopper_menu\".into()), then register_menu_screen(\"mymod:hopper_menu\", factory). In the factory use the five positions [44 + 18*i, 20] and player inventory origin [8, 51] to keep the hopper layout. Replace menu_slot_exclusions for server-side access with a MenuPart attached to that menu type: in menu_slot_rules, set event.may_place = false and event.may_pickup = false for display-only slots. This also governs ItemPlace-backed pickup and quick move. Use None in MenuScreenLayout.slots only for visibility. Keep calling mapping.set_down(host, down), mapping.is_down(host) and mapping.click(host); read the held mapping rather than the physical binding to observe a forced release. Do not assume click(host) opens chat, inventory or another screen inside a callback: keybind actions run in the client tick."
