why = """
Vanilla 26.3's `LevelRenderer`, `OitStage`, `SubmitNodeStorage` / `SubmitNodeCollection`, and
NeoForge 26.3's `SubmitCustomGeometryEvent`, `PrepareRenderBuffersEvent`, `RenderLevelStageEvent`,
and `IRenderableSection` lend the frame's camera/render state and visible chunk sections rather
than copying a minimal 3-field summary, fire `SubmitCustomGeometryEvent` before rendering, fire
`PrepareRenderBuffersEvent` after `AfterSky` and before pass-bearing stages execute, expose all 9
render stages (`AfterSky`, `AfterOpaqueBlocks`, `AfterOpaqueFeatures`, `AfterTranslucentFeatures`,
`AfterTranslucentBlocks`, `AfterTranslucentParticles`, `AfterWeather`, `OitTranslucent(OitStage)`,
`AfterLevel`) with explicit pass capability (`RenderLevelStageContext` / `StagePass`: no active
pass on `AfterSky` and `AfterLevel`, `WorldPassDrawContext` on standard world passes, and
`WorldOitPassDrawContext` on OIT sub-passes), and grow per-frame collections dynamically with no
fixed 4,096-line/quad, 16,384-instance, or 65,536-group-copy caps, no `usage()` budget query, no
component-depth cap on in-memory `submitNameTag` labels (vanilla enforces
`NbtAccounter.MAX_STACK_DEPTH` = 512 only on NBT payloads), and no atomic whole-batch rollback on
model instance submission. Remove `WorldDrawUsage`, `WorldDrawContext::usage`, `CapacityExceeded`
across `DrawError`/`PipelineDrawError`/`InstanceError`/`GroupError`, `DrawError::TextTooDeep`, and
`RenderLevelStage::ALL`. Replace the `Copy + Wire` `WorldRenderView` summary with borrowed
`WorldRenderView<'a>` (lending `&'a Camera`, `partial_tick`, `game_time`, `improved_transparency`,
and `&'a [RenderableSection]`), add `RenderableSection`, `OitStage`, `StagePass`,
`WorldPassDrawContext`, `WorldOitPassDrawContext`, `RenderLevelStageContext`, and
`Hooks::prepare_render_buffers` (`PrepareRenderBuffersEvent`), and bump both
`submit_custom_geometry` and `render_level_stage` to version 2.
"""
migrate = """
Remove calls to `WorldDrawContext::usage()`, references to `WorldDrawUsage`, and match arms for
`DrawError::CapacityExceeded`, `DrawError::TextTooDeep`, `PipelineDrawError::CapacityExceeded`,
`InstanceError::CapacityExceeded`, and `GroupError::CapacityExceeded`. For `draw_model_instances`,
only stale/unknown model handles return `Err(InstanceError::Model(_))`; invalid visible copies are
skipped individually without rolling back valid copies. Because `Text` now implements `Drop`, replace
any by-value field moves out of `Text` (such as `text.style` or `text.content`) with `.take()`,
`std::mem::take`, `.clone()`, or borrowing (`&text.style.hover`). Replace `event.view.camera` reads
expecting `[f64; 3]` with `event.view.camera_position()` or `event.view.camera.position`, and update
any explicit `WorldRenderView` annotations or `DebugRenderer` callbacks to `&WorldRenderView<'_>`.
Use `Hooks::prepare_render_buffers` to prepare or update retained GPU buffers before pass-bearing
render stages execute. Replace `RenderLevelStage::ALL` with
`RenderLevelStage::frame_order(view.improved_transparency)` (`CLASSIC_ORDER` or `OIT_ORDER`). In
`Hooks::render_level_stage`, replace `event.draw` with `event.context`: draw standard-pass lines,
quads, and pipeline quads through `event.context.world_pass()` (or `StagePass::World(pass)`), draw
OIT sub-pass lines and quads through `event.context.oit_pass()` (or `StagePass::Oit(stage, pass)`),
and move submission-only draws (`name_tag`, `draw_model_instances`, `draw_instance_group`) and any
drawing previously done at `AfterSky` or `AfterLevel` (now `StagePass::None`) into
`Hooks::submit_custom_geometry` (or a pass-bearing `RenderLevelStage`).
"""
