ids = ["behaviour:payload_handler_connection_isolation"]
why = "Remove per-registration panic poison from payload calls. Vanilla PacketProcessor delegates ordinary packet errors to the receiving listener's onPacketError. NeoForge NetworkRegistry and ClientNetworkRegistry dispatch IPayloadHandler with a receiving IPayloadContext without per-handler poison. Both payload contexts use NetworkRegistry.guard for off-thread enqueueWork; it logs exceptional completion without disconnecting. Sunrise keeps its existing typed disconnect, raw delivery isolation, transaction rollback and ingress lease cleanup. Call-owned PayloadWork is disposed under its owning mod's panic attribution across normal completion, panics, queue refusal, and cancellation."
migrate = "No code change needed: handlers and PayloadWork implementations keep the same signatures, and a single connection's panic no longer mutes the handler for other connections."
