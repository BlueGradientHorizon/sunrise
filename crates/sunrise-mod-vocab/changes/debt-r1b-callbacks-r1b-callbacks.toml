why = '''
Retained native callbacks now run with the mod that registered them. A panic disables only the affected callback for the session and reports the mod in the log and client error toast. Ordinary failures remain per invocation. Registration order and successful calls follow vanilla's SpawnPlacements.checkSpawnRules, ServerConfigurationPacketListenerImpl.startNextTask, Gui.extractRenderState, DebugScreenEntryList and DebugRenderer.emitGizmos, LevelLoadingScreen.extractRenderState, and SpecialModelWrapper.update; their extension points follow NeoForge's RegisterSpawnPlacementsEvent, RegisterConfigurationTasksEvent, GuiLayerManager, RegisterDebugEntriesEvent, RegisterDebugRenderersEvent, RegisterDimensionTransitionScreenEvent, and RegisterSpecialModelRendererEvent. Phase-refused configuration listeners no longer leave tasks or reserved task types in the queue.
'''
migrate = '''
Keep your existing registration calls and callback signatures and rebuild. In register_configuration_tasks version 3, do not rely on tasks or task-type reservations from a listener that hit a phase refusal; they are discarded while other listeners keep their tasks. In start and tick, use the passed host as before; a panic fails that connection and the session skips later instances of that mod's task implementation. For spawn placement, a skipped callback supplies no answer; use the same live random stream and do not depend on draws from another mod. Disabled HUD wrappers leave the previous body to draw. Disabled or refused loading-screen callbacks leave the vanilla presentation. For special items, propagate collector errors as before: a refusal does not disable later draws, and a panic is not cleared by a resource reload. Tooling that consumes SpecialModelRendererRegistry::into_renderers now destructures each map value as (owner, factory) rather than factory alone; owner is Option<&'static str>.
'''
