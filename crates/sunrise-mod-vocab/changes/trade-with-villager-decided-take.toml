ids = ["hook:trade_with_villager"]
why = "A guest's merchant result take is one decided action when a mod listens to trade_with_villager (#784 3f). The payments, the result, the offer's uses, the merchant's experience, the trade statistic, the advancement criterion and every write the listener makes now stand or fall together, including the earlier trades of the same shift-click. A listener that panics, an answer that cannot become a live offer (a non-finite price multiplier, a stack that is not valid for the game) and an outer transaction that aborts all undo the take. Packets, experience orbs, sounds, drops, new map ids and advancement rewards wait for the outermost commit and are dropped on rollback. Before, such a take could stand with the listener's writes while the answer was dropped."
migrate = "Request hook_version = 3. The signature is unchanged. A listener that wrote state and relied on it surviving a refused or invalid answer now loses those writes with the whole take; give the offer a valid answer."
