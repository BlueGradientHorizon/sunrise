ids = ["method:RenderAssets::block_state_models"]
why = "#3134: model lookup takes the same BlockState a mod reads from a level or placement event, not the engine's numeric BlockStateId. Valid states without a baked binding still return an empty list; unknown states return UnknownModel."
migrate = "Pass the BlockState directly to render_assets().block_state_models(state). Rebuild native and wasm mods against the new signature."
