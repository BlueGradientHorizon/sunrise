why = "Following vanilla 26.3 `ServerPlayer.restoreFrom` and `PlayerList.respawn` together with NeoForge `PlayerEvent.Clone`, `EventHooks.onPlayerClone`, and `AttachmentInternals.onPlayerClone`, `player_clone` (version 2) now retains the pre-copy original player across respawn and End return and lends it directly as `OriginalPlayer<'_>`. This removes the token-based `OriginalPlayerRef` handle, `PlayerOriginalBackend`, `Holder::OriginalPlayer` special cases, and read-only attachment restrictions while letting Rust's borrow checker enforce callback scoping."
migrate = "Stop taking `host` when reading `event.original` in `player_clone` (version 2): replace `event.original.uuid(host)`, `position(host)`, `health(host)`, `experience(host)`, and `effects(host)` with `event.original.uuid()`, `position()`, `health()`, `experience()`, and `effects()` (which now return direct values or `&[ActiveEffect]` instead of `Option<...>`), and replace `dimension(host)` / `level(host)` with `dimension()` / `level()`. Replace `event.original.inventory_slot(host, slot)` with `event.original.with_inventory(|inv| ...)` using vanilla `Inventory` slot numbers 0..=42 (0–35 main, 36–39 boots through helmet, 40 off hand, 41 body, 42 saddle) instead of the old 100..=103 and -106 numbers; use `event.original.persistent_data()` for persistent data. Replace `event.original.attachment(host, &KEY)` and any `Holder::OriginalPlayer` calls with `event.original.attachment(&KEY)`, `has_attachment(&KEY)`, `existing_attachment(&KEY)`, `with_decoded_attachment(&KEY, ...)`, `set_attachment(&KEY, value)`, or `remove_attachment(&KEY)`, which follow normal `AttachmentHolder` semantics on the retained old player without touching the replacement. Do not store `event.original` past the `player_clone` callback; its lifetime is tied to the hook."
