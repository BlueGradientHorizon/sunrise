why = "Following vanilla 26.3 `ServerPlayer.restoreFrom` and `PlayerList.respawn` together with NeoForge `PlayerEvent.Clone`, `EventHooks.onPlayerClone`, and `AttachmentInternals.copyEntityAttachments`, `player_clone` (version 2) retains the pre-copy original player across death respawn and End credits return and lends it directly as `OriginalPlayer<'_>`. This removes the token-based `OriginalPlayerRef` handle, `PlayerOriginalBackend`, `Holder::OriginalPlayer` special cases, and read-only attachment restrictions while keeping attachment operations on the retained old player transactional under `host.transaction` and letting Rust's borrow checker enforce callback scoping."
migrate = "Stop passing `host` when reading `event.original` in `player_clone` (version 2): replace `event.original.uuid(host)`, `position(host)`, `health(host)`, `experience(host)`, and `effects(host)` with `event.original.uuid()`, `position()`, `health()`, `experience()`, and `effects()` (which return direct values or `&[ActiveEffect]` instead of `Option<...>`), and replace `dimension(host)` / `level(host)` with `dimension()` / `level()` (which preserve the source level while the replacement already carries its destination level). Replace signed `event.original.inventory_slot(host, slot)` with `event.original.with_inventory(|inv| inv.get(slot))` (and call `stack.project()` on the borrowed `ItemStackView` if you need an owned `ItemStack`), remapping the old signed indices to vanilla `Inventory` indices `0..=42`: `0..=35` stay `0..=35` (hotbar and main inventory), `100..=103` become `36..=39` (boots, leggings, chestplate, helmet), `-106` becomes `40` (offhand), plus `41` (body) and `42` (saddle). Use `event.original.persistent_data()` for pre-copy persistent data. Replace `event.original.attachment(host, &KEY)` and any `Holder::OriginalPlayer` calls with `event.original.attachment(&KEY)`, `has_attachment(&KEY)`, `existing_attachment(&KEY)`, `with_decoded_attachment(&KEY, ...)`, `set_attachment(&KEY, value)`, or `remove_attachment(&KEY)`, which follow normal `AttachmentHolder` semantics on the retained old player without touching the replacement and roll back with `host.transaction` if a transaction aborts. On End return (`!was_death`), only serializable attachments (entries with a codec, plus unknown raw entries) are copied automatically into the replacement; copy codec-less attachments explicitly inside `player_clone` if desired. Do not store `event.original` past the `player_clone` callback; its lifetime is tied to the hook."
