ids = ["method:Players::singleplayer_profile", "handle:PlayerRef::is_singleplayer_owner"]
why = "Adds Players::singleplayer_profile and PlayerRef::is_singleplayer_owner (#4636): MinecraftServer.getSingleplayerProfile and isSingleplayerOwner on the server. The profile is the one the integrated server launched with, read from what its login already keeps, before the owner joins and after they leave. The predicate compares names ignoring case, as IntegratedServer.isSingleplayerOwner does, never UUIDs, and cheats, LAN publishing, join order and permission level don't change it. A dedicated server, as DedicatedServer.isSingleplayerOwner, and a stale handle give None and false. An identity read: it grants nothing and leaves login rules as they are."
