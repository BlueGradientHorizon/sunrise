why = "Stack views let mods read item, count and damage without copying a resident stack or encoding its components. Inventory views keep the original slot numbers and read only the slots the caller asks for."
migrate = "No existing calls change with these primitives. When reading an InventoryView, use view.get(slot) for one slot or view.iter() for ascending (slot, stack) pairs. Read scalars directly on the ItemStackView; call stack.project() for an owned ItemStack if you need the component patch or need to keep it after the callback. Use ItemStackView::from_stack(&stack) to lend an existing owned API value."
