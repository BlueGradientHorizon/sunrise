why = "Match vanilla LivingEntity.knockback and NeoForge CommonHooks.onLivingKnockBack / LivingKnockBackEvent: living_knockback (bumped from version 2 to 3) removes the Java overload discriminator `entry` (`KnockbackEntry::Short`/`Full`) and fires once when a push reaches the living implementation. It lends `attacker_main`, `attacker_off`, and `kill_credit_main` lazily as `Option<ItemStackView<'_>>` so unrelated component projection failures or empty/unknown items never skip the event. Vanilla Player.doSweepAttack and LivingEntity.dealDefaultKnockback use the short overload, which still reaches SulfurCube.knockback; a body item and a causing entity keep that launch out of the living event regardless of the effect multiplier. SulfurCubeArchetype supplies vanilla's default launch settings if no archetype matches. EnderDragon.knockback delegates to the living implementation when not sitting, unlike the dragon's wing push (EnderDragon.knockBack)."
