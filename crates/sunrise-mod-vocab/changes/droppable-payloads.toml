ids = ["type:PayloadDeclaration", "type:PayloadDelivery", "type:PayloadDropCounts", "type:PayloadSendError", "trait:IPayloadContext", "trait:prelude::PayloadDropsHost", "method:prelude::PayloadDropsHost::payload_drop_counts"]
why = "Droppable payload delivery (audio design part 2): PayloadDeclaration gains `delivery` (Reliable or Droppable), PayloadSendError appends NotDroppable, IPayloadContext gains send_to (group send of a Droppable channel from a network handler), and the shared host gains payload_drop_counts. Affected WebAssembly mods must rebuild for the changed layouts. No hook meaning changes."
