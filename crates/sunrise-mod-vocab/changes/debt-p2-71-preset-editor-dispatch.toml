why = "Vanilla MouseHandler.onButton detects a double-click on the same screen instance and button within 250 ms of the last handled press. NeoForge's ClientHooks.onScreenMouseClickedPre/Post and onScreenMouseReleasedPre/Post pass one original receiver and let ScreenEvent.MouseButtonPressed.Post and MouseButtonReleased.Post override the receiver's handled answer; a cancelled press Pre counts as handled without running Post. The editor now receives the same button and double-click flag as the press hooks."
migrate = "Change PresetEditor::mouse_clicked(&mut self, x, y, button: u8, draft) to mouse_clicked(&mut self, x, y, button: i32, double_click: bool, draft); do not narrow platform button indices. The pressed Pre and both button Post Hooks callbacks keep their host and event parameters. Read event.double_click on press Pre and Post. Read event.was_click_handled on press Post and event.was_release_handled on release Post for the original screen's answer; Post includes already handled edges and retains the original screen even when Done or Cancel opens Create World. Set *event.result to TriState::True to force handled, TriState::False to force unhandled, or TriState::Default to keep the original answer. A cancelled Pre skips the screen and Post; keyboard Post is unchanged."
