why = "Anvil Update now lends an immutable view of the inputs and vanilla result. Only output and costs can be edited, and changing costs no longer revalidates untouched stacks. A rejected output clears the result and both costs."
migrate = """
Read `event.update.left/right/name` through `event.inputs.left/right/name`; the right stack and name are already optional references, so drop `.as_ref()` and `.as_deref()` on those fields. Read `event.update.vanilla.output/xp_cost/material_cost` as `event.inputs.vanilla_output/vanilla_xp_cost/vanilla_material_cost`. Clone individual stacks only to retain them after the callback.

Read or write `event.update.xp_cost/material_cost` through `event.edits.xp_cost/material_cost`. Read the current output by matching `&event.edits.output`: `StackResult::Keep` means `event.inputs.vanilla_output`, and `StackResult::Set(stack)` means `stack.as_ref()`. Replace `event.update.output = Some(stack)` with `event.edits.output = StackResult::Set(Some(stack))`, and replace `event.update.output = None` with `StackResult::Set(None)` assigned to that same field. Assign `StackResult::Keep` to restore vanilla output after an earlier edit. Cancellation is unchanged: set `event.cancelled` or return `Flow::Cancel`.

Remove uses of `AnvilUpdate::new`, `AnvilUpdate::answer` and the API `item::stations::AnvilResult`: listeners use the supplied `AnvilUpdateInputs<'_>` and `AnvilUpdateEdits`, and the game applies the final edits. A dispatch fixture can construct those two records directly, starting edits at `StackResult::Keep` and the vanilla XP and material costs from the inputs, then pass `&inputs, &mut edits` before the cancel argument. These call-scoped records have no Wire encoding; retain or encode individual owned fields instead. Rebuild and repack the mod for hook version 2.
"""
