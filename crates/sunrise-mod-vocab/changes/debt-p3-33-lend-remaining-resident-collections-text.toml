why = "Riding and multipart reads no longer allocate a list for the caller. Resident riding handles follow vanilla Entity.addPassenger and Entity.getPassengers order, Entity.getIndirectPassengers pre-order, and ClientPacketListener.handleSetEntityPassengersPacket seat order. Multipart handles follow the resident order of vanilla EnderDragon.getSubEntities and NeoForge IEntityExtension.getParts (implemented by EnderDragon.getParts). Fluid reads lend the last body sample, as in vanilla Entity.getFluidHeight and Entity.isEyeInFluid and NeoForge IEntityExtension.getFluidTypeHeight, getMaxHeightFluidType and getFirstEyeInFluidType. Living reads visit the existing state behind vanilla LivingEntity.getActiveEffects, LivingEntity.getAttributes and AttributeInstance.getModifiers without building a list or copying IDs per call. Level, tracking, tick and rule visits read the resident state behind MinecraftServer.getAllLevels and getTickTimesNanos, ChunkMap's visible map, TrackedEntity.seenBy and getPlayers(pos, false), ServerLevel.getForceLoadedChunks and ForceLoadCommand.listForceLoad, and the feature-filtered GameRules.availableRules. They keep the existing order and empty-versus-unavailable distinction without copying the lists or rule names. NeoForge PacketDistributor.sendToPlayersTrackingEntity, sendToPlayersTrackingEntityAndSelf and sendToPlayersTrackingChunk use the same tracking membership; NeoForge TicketController.forceChunk scopes mod tickets by controller and owner. Server scoreboard visits use the resident data behind vanilla Scoreboard.getObjectives, getPlayerTeams, listPlayerScores and getDisplayObjective. Names come from Objective.getName and getCriteria, PlayerTeam.getName and DisplaySlot.getSerializedName. Raid visits use the per-level map behind Raids.get and Raids.tick, and the members and heroes behind Raid.getAllRaiders, groupRaiderMap and heroesOfTheVillage. NeoForge Raid.spawnGroup changes how raider types are supplied, not how these collections are read. Recipe visits read the book behind ServerRecipeBook.known and contains. These visits retain existing visibility and order without building a list or copying names on each call. Client scoreboard reads borrow the packet-populated board behind vanilla ClientLevel.getScoreboard. The view follows Scoreboard.getObjectives, getDisplayObjective, listPlayerScores and getPlayerTeams, and ClientPacketListener.handleAddObjective, handleSetDisplayObjective, handleSetScore and handleSetPlayerTeamPacket: a received objective is visible before it gets a slot, one objective can occupy several slots, sent hidden scores are still resident, and all received teams are visible. Copies of text and formats are opt-in so one unrepresentable field does not prevent unrelated reads."
migrate = """
- Replace `entity.passengers(host)` with `entity.visit_passengers(host, &mut |rider| { /* read rider */ ControlFlow::Continue(()) })`. The visit is available on either side and omits riders without a resident handle.
- Replace `entity.indirect_passengers(host)` with `entity.visit_indirect_passengers(host, &mut |rider| { /* read rider */ ControlFlow::Continue(()) })`. This remains server-only and still finds resident riders below a retained, off-level intermediary.
- Replace `entity.parts(host)` with `entity.visit_parts(host, &mut |part| { /* read part */ ControlFlow::Continue(()) })`. Non-multipart entities complete without a call; a multipart read resolves all parts before the first call.
- Import `std::ops::ControlFlow`. Return `ControlFlow::Break(())` to stop visiting; the call then returns `Ok(ControlFlow::Break(()))`. `Ok(ControlFlow::Continue(()))` means the visit completed, possibly without a call. If you need an owned list, declare `let mut handles = Vec::new();` and collect only what you need by calling `handles.push(handle)` inside a visitor that returns `ControlFlow::Continue(())`.
- Replace an old `None` check with `Err(EntityReadError::Stale)` for a handle not present in the current view, and handle `Err(EntityReadError::Unavailable)` for a read the side, phase or view cannot supply. Neither refusal visits an entry. Discard the distinction only if both errors were equivalent for your caller.
- Replace `entity.fluid_heights(host)` with `entity.visit_fluid_heights(host, &mut |id, depth| { /* use id: &str and depth: f64 */ ControlFlow::Continue(()) })`. The first visit is the deepest contact (water before lava on a tie); break there if you only need that contact. `entity.eye_fluid(host)` still returns `Some(None)` in air and `None` without a readable body, but its inner value is now `&'static str`, not `String`. Use `.map(|fluid| fluid.map(str::to_owned))` only if you need to keep the old owned return type.
- Replace `living.effects(host)` with `living.visit_effects(host, &mut |effect| { /* use or retain this ActiveEffect */ ControlFlow::Continue(()) })`. Entries are still passed by value, in effect-store order.
- Replace `living.attributes(host)` with `living.visit_attributes(host, &mut |id| { /* use id: &str */ ControlFlow::Continue(()) })`. If you need to retain an id, call `id.to_owned()` inside the visitor. The visitor uses registry order.
- Replace `living.attribute_modifiers(host, id)` with `living.visit_attribute_modifiers(host, id, &mut |m| { /* use m.id, m.amount and m.operation */ ControlFlow::Continue(()) })`. The `AttributeModifierView` borrows its `id` for the call. To retain a writable modifier, parse `m.id` with `Identifier::parse` inside the visitor and store `AttributeModifier::new(parsed_id, m.amount, m.operation)` on success. The owned write type and write methods are unchanged. An unknown or unsupported attribute is `Err(EntityReadError::Unavailable)`, not a successful empty visit.
- Replace `entity.trackers(host)` with `entity.visit_trackers(host, &mut |player| { /* use PlayerRef */ ControlFlow::Continue(()) })`. A stale entity returns `EntityReadError::Stale`; the current side, phase or level may refuse with `EntityReadError::Unavailable`. Replace `chunk.watchers(host)` with `chunk.visit_watchers(host, &mut |player| { /* use PlayerRef */ ControlFlow::Continue(()) })`. A parked server level still supplies its own chunk watchers.
- Replace `level.loaded_chunks(host)` with `level.visit_loaded_chunks(host, &mut |chunk| { /* use ChunkRef */ ControlFlow::Continue(()) })`. The visit does not load anything. Replace `level.forced_chunks(host)` with `level.visit_forced_chunks(host, &mut |pos| { /* use [i32; 2] */ ControlFlow::Continue(()) })`. Replace `level.mod_forced_chunks(host, controller)` with `level.visit_mod_forced_chunks(host, controller, &mut |owner, pos, natural| { /* use TicketOwner, [i32; 2], bool */ ControlFlow::Continue(()) })`. For these visits and chunk watchers, handle `LevelReadError::Stale` for a stale level or `LevelReadError::Unavailable` for an unreadable side or phase (also for a controller the callback cannot use). A valid empty set completes with `Ok(ControlFlow::Continue(()))` and no callback.
- Replace `level.game_rules(host)` with `level.visit_game_rules(host, &mut |id, value| { /* use &str and GameRuleValue */ ControlFlow::Continue(()) })`, keeping the same level refusal handling. Replace `host.game_rules()` with `host.visit_game_rules(&mut |id, value| { /* use &str and GameRuleValue */ ControlFlow::Continue(()) })`. Keep only the rules you need; call `id.to_owned()` inside the visitor if you retain its name.
- Replace `host.levels().list_levels()` with `host.levels().visit_levels(&mut |level| { /* use LevelRef */ ControlFlow::Continue(()) })`; before a world opens there is nothing to visit. Replace `host.tick_times()` with `host.visit_tick_times(&mut |nanos| { /* use u64 */ ControlFlow::Continue(()) })`; if sorting or indexing is needed, push each duration into your own `Vec`. Server-wide visits return `ServerReadError::Unavailable` when they cannot be supplied (for example in an unreadable phase), not an empty visit.
- Replace `host.objectives()` and `host.teams()` with `host.visit_objectives(&mut |objective| { /* use ObjectiveRef */ ControlFlow::Continue(()) })` and `host.visit_teams(&mut |team| { /* use TeamRef */ ControlFlow::Continue(()) })`. An unreadable server board returns `Err(ServerReadError::Unavailable)` rather than an empty list.
- Replace `objective.slots(host)` with `objective.visit_slots(host, &mut |slot| { /* use DisplaySlot */ ControlFlow::Continue(()) })`. Replace `objective.scores(host)` with `objective.visit_scores(host, &mut |row| { /* use row.holder and row.value */ ControlFlow::Continue(()) })`. An old `None` becomes `Err(ObjectiveReadError::Stale)` for a removed or earlier-open objective, or `Err(ObjectiveReadError::Unavailable)` if the board cannot be read. Neither calls the visitor.
- `ScoreEntry<'_>::holder` is `&str`, not `ScoreHolder::Name(String)`; compare it directly. To retain it, copy `row.holder.to_owned()` inside the visitor. Use `ScoreHolder::Name(owned_key)` for a later write. Replace `ScoreEntry::new(ScoreHolder::Name(key), value)` with `ScoreEntry::new(key.as_str(), value)` for a borrowed row in a fixture. `ScoreEntry` no longer implements Wire; for typed payloads use your own owned `#[derive(Wire)]` type with a `String` key and `i32` value.
- `objective.name(host)`, `objective.criteria(host)` and `team.name(host)` now return `Option<&str>`. Drop `.as_deref()` from their results and add `.map(str::to_owned)` only when you need an owned value. `slot.name()` returns `&'static str`: use `map.get(slot.name())` for lookup, or `map.insert(slot.name().to_owned(), value)` for an owned map key.
- Replace `level.raids(host)` with `level.visit_raids(host, &mut |raid| { /* use RaidRef */ ControlFlow::Continue(()) })`; distinguish a stale level from unavailable raid data with `LevelReadError`. Stopped entries still visit until the next raid tick removes them. Replace `raid.raiders(host)`, `raid.wave_raiders(host, wave)` and `raid.heroes(host)` with `raid.visit_raiders(host, &mut visit)`, `raid.visit_wave_raiders(host, wave, &mut visit)` and `raid.visit_heroes(host, &mut visit)`. The visitors take `EntityRef`, `EntityRef` and `u128`, respectively. Replace `None` handling with `RaidReadError::Stale` for a gone raid or level, and `RaidReadError::Unavailable` for an unreadable side, phase or map.
- Replace `player.discovered_recipes(host)` with `player.visit_discovered_recipes(host, &mut |id| { /* use id: &str */ ControlFlow::Continue(()) })`. Call `id.to_owned()` inside the visitor to retain a key. Replace the old `None` check with `EntityReadError::Stale` for a stale player or `EntityReadError::Unavailable` when there is no readable server backend. An empty recipe book is a successful visit with no callbacks.
- Client `host.client_scoreboard()` now returns `Result<Option<&dyn ClientScoreboard>, ClientSessionReadError>`. Treat `Ok(None)` as no logged-in world and `Err(ClientSessionReadError::Unavailable)` as a refused read. A logged-in client with nothing on its board still has a view.
- Replace `board.objectives` and `board.teams` iteration with `board.visit_objectives(&mut |objective| { /* read the view */ ControlFlow::Continue(()) })` and `board.visit_teams(&mut |team| { /* read the view */ ControlFlow::Continue(()) })`. Replace `board.in_slot(slot)` with `board.with_slot(slot, &mut |objective| { /* read the view */ })`; it returns `None` without a callback for an empty slot.
- On a client objective, replace `name` and `render_type` field access with `name()` and `render_type()`, and iterate `slots` and `scores` via `visit_slots(&mut |slot| { /* use DisplaySlot */ ControlFlow::Continue(()) })` and `visit_scores(&mut |row| { /* use &dyn ClientScore */ ControlFlow::Continue(()) })`. Replace its `display_name` and `number_format` fields with `copy_display_name()` and `copy_number_format()`.
- On a client score, replace `holder` and `value` with `holder()` and `value()`, and `display` and `number_format` with `copy_display()` and `copy_number_format()`.
- On a client team, replace `name`, `color`, `friendly_fire`, `see_friendly_invisibles`, `name_tag_visibility` and `collision_rule` by calls of the same names. Replace `members` iteration with `visit_members(&mut |name| { /* use &str */ ControlFlow::Continue(()) })`, and `display_name`, `prefix` and `suffix` with `copy_display_name()`, `copy_prefix()` and `copy_suffix()`.
- Client-board visitors return plain `ControlFlow<()>` (not `Result`); return `ControlFlow::Break(())` to stop. Copy a borrowed name with `.to_owned()` inside its callback if you retain it. Text and format copies each return their own `TextFormError`; optional fields return `Ok(None)` only when absent. The four client DTO constructors and their Wire forms are gone. For saved values, fixtures or payloads, collect the needed fields into your own owned records, deriving `Wire` there only if you encode them.
"""
