why = "Write authority is now lent by a server-thread transaction and cannot be stored, encoded, or closed by a caller. The innermost-frame check follows NeoForge 26.3's TransactionManager.validateCurrentTransaction and TransactionManager.open. Vanilla's HopperBlockEntity.tryMoveItems and AbstractContainerMenu.doClick still determine the underlying transfer and menu rules. Aborting drops deferred packets; a root commit passes them to the ordinary sender without a separate transaction budget. Configuration completion still follows committed sends, preserving ServerConfigurationPacketListenerImpl.finishCurrentTask ordering."
migrate = '''
Import `mod_api::{HostTransaction, TransactionContext, TransactionError}`. Replace `run_transaction(host, |host, tx| …)` with `host.transaction(|host, tx| …)`. Replace `let seal = host.transaction_open(); … seal.transaction() … host.transaction_close(&seal, commit)` with `host.transaction(|host, tx| { … })`, using the closure's `host` and `tx` for every write. Return `Ok(value)` to commit or `Err(error)` to abort; unwinding also aborts journaled work. There is no mod-callable close operation. Replace transaction result annotations `Result<T, E>` with `Result<T, TransactionError<E>>`. Match `Err(TransactionError::Aborted(error))` for a closure error and `Err(TransactionError::Unavailable)` when the closure did not run.

Change `&Transaction` to `&TransactionContext` in helper parameters and in implementations of `ResourceHandler`, `EnergyHandler`, `ItemStorage` and `PlaceProvider`. The context does not implement `Wire` or `Clone`, is `!Send` and `!Sync`, and cannot outlive the closure. Pass its borrow directly to handler, item-place, component, block-entity slot, world-fluid and scratch-place writes, as well as `move_energy`, `transfer` and `transfer_matching`. For `resource_util` helpers pass `Some(tx)` from the current closure, or `None` to start at the root only when no transaction is open. The wrong context (foreign or ancestor, or `None` while a parent is open for an optional-context helper) panics even for a zero-amount request; it never means zero moved or ordinary refusal. Use the child context inside every nested closure. Replace `host.transaction_depth(tx)` with `tx.depth()` (zero for the root), and `host.transaction_current().is_none()` with `host.transaction_matches(None)`. Use `host.transaction_matches(Some(tx))` to check an existing loan; it does not obtain one. If you need a context, pass it down from the enclosing closure or open another scope. `host.transaction_lifecycle()` still reads the journal phase, but `TransactionLifecycle` no longer implements `Wire`.

Keep using `event.subject.transaction(|tick, tx| …)` in a block-entity tick, with the new result type. Alternate `tick.host()` and `tick.with_view(…)` as before. In a server main-thread payload handler, use `cx.transaction(|cx, tx| …)` on `&mut dyn IPayloadContext` if a savepoint must include payload replies, configuration task completion and writes via `cx.server_host()`. Reborrow the payload context after each host borrow. It also returns `Result<T, TransactionError<E>>`. For a custom host or payload test double that supports transactions, implement its `with_transaction_scope` to lend the receiver and current context and commit only when the callback returns `true`. Implement `ServerHost::transaction_matches` to match only the innermost frame or no frame for `None`. A custom server test host can delegate to `testing::FakeJournal::with_scope` and `matches`.

For `BlockEntityPartState::edit_state` and `EntityPartState::edit_state`, handle `PartStateError::Unavailable`: the host did not open a transaction and the edit closure did not run.
'''
