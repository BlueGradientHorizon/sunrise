why = "Generalize bundle-like item containers to registered custom data components with capacity multipliers and optional item tag filters via BundleConfig, BundleMetrics, BundleReadError, and BundleItems::with_config. Exact rational weights, nesting overhead, bees weight, fullness bars, and memoized weight lookup on draw follow vanilla 26.3 BundleContents/BundleItem; capacity multipliers above 1 and stack splitting at each item's max_stack are Sunrise-specific extensions. Custom components use one canonical Tag::List schema of strict ItemStack.CODEC entries (registry-backed non-air item id, count in 1..=99, persistent components; unmentioned entry keys ignored and dropped on re-encode like vanilla ItemStack.MAP_CODEC) and refuse non-list payloads, malformed or unknown-item entries, or nested malformed custom containers with BundleReadError::UnsupportedFormat without overwriting them."
migrate = "Additive public surface (BundleConfig, BundleMetrics, BundleReadError, BundleItems::with_config). Register a custom component whose default value is an empty Tag::List ([]), build a BundleConfig, and handle Result<..., BundleReadError> from all five BundleConfig helpers (slots, room_for, try_insert, extract, metrics). Existing vanilla BundleItems::new callers require no changes."
