ids = [
    "hook:world_lifecycle",
    "method:Hooks::world_lifecycle",
    "type:WorldPhase",
    "type:WorldLifecycleEvent",
    "hook:server_starting",
    "hook:server_stopping",
    "hook:level_load",
    "hook:level_unload",
]
why = "Aligned server and level lifecycle hooks to vanilla 26.3 (`MinecraftServer.runServer`, `MinecraftServer.stopServer`, `DedicatedServer.initServer`, `IntegratedServer.initServer`, `ServerLevel.close`) and NeoForge (`ServerLifecycleHooks`, `ServerStoppingEvent`, `ServerStoppedEvent`, `LevelEvent.Load`, `LevelEvent.Unload`). Removed the Sunrise-only `world_lifecycle` hook and `WorldPhase` enum (including `WorldOpenFailed`, `WorldCloseFinal`, and `WorldCloseFailed`); startup and stop failures are reported through engine logs as in vanilla rather than a separate phase event. Bumped `server_starting` to version 3 so integrated servers also fire it after world/level loading (`level_load`), adopted pack/text setup, spawn preparation, and the initial save, before `server_started` and before handing the ready connection to the client. Bumped `server_stopping` to version 2 so it fires only on an orderly tick-loop exit before `stopServer`, matching NeoForge's `MinecraftServer.java.patch` (failed opens—including dedicated TCP bind failure before `server_about_to_start`—and tick crashes/panics skip straight to `stopServer` teardown and `server_stopped`). Bumped `level_load` to version 3 and `level_unload` to version 3 so all configured startup levels (including datapack dimensions) load in `LEVEL_STEM` order, levels save and close in creation order, idle non-Overworld levels evict chunks/entities without closing or firing `level_unload`/re-`level_load`, `stopServer` tears down network admission and players before the final world save, and `level_unload` fires during `stopServer` only after the final world save and each level's own close (`save.flush()`) succeed."
migrate = "Remove `Hooks::world_lifecycle`, `WorldLifecycleEvent`, and `WorldPhase` imports and implementations. Move `WorldPhase::WorldCloseFinal` cleanup to `Hooks::server_stopped` (or per-level cleanup to `Hooks::level_unload`, keeping in mind that `level_unload` does not fire if the final world save or that level's own close fails—use `server_stopped` for unconditional cleanup). Where a mod previously handled `WorldPhase::WorldOpenFailed` or `WorldPhase::WorldCloseFailed`, rely on engine logs for the error text and clean up state in `Hooks::server_stopped`, which always runs on teardown after server startup enters. Rebuild against the bumped hook versions (`server_starting` v3, `server_stopping` v2, `level_load` v3, `level_unload` v3): move any work that must run before integrated world loading from `server_starting` to `server_about_to_start`, do not expect idle non-Overworld levels to fire `level_unload` or a second `level_load` on revisit, and move any unconditional shutdown cleanup that must also run after failed opens, tick crashes, or save failures from `server_stopping` or `level_unload` to `server_stopped`."
