why = "The mid-animation hook lends each listener the live pose for this draw instead of copying a whole pose out and writing it back. Finite edits apply immediately and are visible to the next listener."
migrate = "Rebuild for humanoid_setup_anim version 3. Keep the HumanoidSetupAnimEvent listener signature and its event.parts.get(part), set_position(part, xyz) and set_rotation(part, angles) calls. Change helper arguments from &mut HumanoidParts to &mut dyn HumanoidPose and pass &mut *event.parts (or use &dyn HumanoidPose and &*event.parts for reads). Replace HumanoidParts::PARTS with the parts you need: Head, Hat, Body, RightArm, LeftArm, RightLeg and LeftLeg are editable when present. Instead of HumanoidParts::new or assigning a whole snapshot, set each edited part on event.parts. The borrow is callback-only and has no Wire representation; copy just the coordinates you wish to keep with get."
