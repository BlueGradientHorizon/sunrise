ids = ["type:EntityRenderAttachments", "type:EntityRenderState", "type:LivingRenderState", "type:PaintingRenderState", "type:ItemFrameRenderState"]
why = "Entity rendering shares a frozen generation of synced attachments instead of re-encoding it and omitting individual fields past the old guest cap. An over-budget generation is unavailable as a whole, and the render state and its subtypes no longer implement Wire. Attachment disk and sync codecs are unchanged."
migrate = "Keep EntityRenderer::submit and snapshot.get(&KEY). If you required state.attachments with ok_or(...), use match &state.attachments { Some(snapshot) => snapshot.get(&KEY), None => Ok(None) } and draw your default when no value is returned; None for the snapshot does not mean the entity is absent. Within the native process pass the state by reference or clone it instead of round-tripping it through Wire. For a payload, define your own #[derive(Wire)] record of the fields you want to send and populate it explicitly."
