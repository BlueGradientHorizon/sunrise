ids = ["type:EntityRenderAttachments", "type:EntityRenderState", "type:LivingRenderState", "type:PaintingRenderState", "type:ItemFrameRenderState"]
why = "Matching NeoForge `AttachmentHolder` and vanilla `EntityRenderState`, entity rendering captures a frozen generation of synced attachments unconditionally without a per-entity byte budget, sharing already-decoded `AttachmentEntry` bindings directly instead of re-wrapping them into raw NBT for render-time re-decoding. `EntityRenderState` and its subtypes no longer implement Wire; attachment disk and sync codecs are unchanged."
migrate = "Keep EntityRenderer::submit and snapshot.get(&KEY). For general entity renderers, `state.attachments` is always `Some(...)` (and `None` only for non-general entity families); draw your default when `snapshot.get(&KEY)` returns `Ok(None)` for a missing key. Already-decoded bindings are read directly without re-running the decode codec. Within the native process pass the state by reference or clone it instead of round-tripping it through Wire. For a payload, define your own #[derive(Wire)] record of the fields you want to send and populate it explicitly."
