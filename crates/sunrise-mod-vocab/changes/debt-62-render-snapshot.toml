ids = ["type:EntityRenderAttachments", "type:EntityRenderState", "type:LivingRenderState", "type:PaintingRenderState", "type:ItemFrameRenderState"]
why = "Matching vanilla `ServerEntity.addPairing` + `ClientPacketListener.handleBundlePacket`, vanilla `EntityRenderState`, and NeoForge `AttachmentHolder` / `AttachmentSync` / `ClientPayloadHandler`, general entities are immediately visible upon spawn with a frozen `EntityRenderAttachments` generation (initial non-empty synced attachments arrive atomically in the pairing `BundleDelimiter` bundle; attachment syncs for unknown entities are logged and ignored), captured unconditionally without a per-entity byte budget and sharing already-decoded `AttachmentEntry` bindings directly instead of re-wrapping them into raw NBT for render-time re-decoding. `EntityRenderState` and its subtypes no longer implement Wire; attachment disk and sync codecs are unchanged."
migrate = "Keep EntityRenderer::submit and snapshot.get(&KEY). General entities are visible immediately upon spawn without waiting for an initial empty attachment snapshot, and `state.attachments` is always `Some(...)` for general entity renderers (and `None` only for non-general entity families); draw your default when `snapshot.get(&KEY)` returns `Ok(None)` for a missing key. Already-decoded bindings are read directly without re-running the decode codec. Within the native process pass the state by reference or clone it instead of round-tripping it through Wire. For a payload, define your own #[derive(Wire)] record of the fields you want to send and populate it explicitly."
