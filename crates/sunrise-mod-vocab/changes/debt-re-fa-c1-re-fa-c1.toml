ids = ["type:EntityRenderAttachments", "type:EntityRenderState.attachments", "handle:EntityRenderAttachments::get", "method:prelude::ModStateHost::attachments", "trait:IPayloadHandler", "trait:PayloadWork", "type:PayloadHandleError"]
why = "Following vanilla ChunkMap.addEntity, ServerEntity.addPairing and ClientPacketListener.handleBundlePacket and NeoForge AttachmentSync.syncInitialEntityAttachments and syncEntityUpdate, a viewer held for proxy handoff receives initial pairings even between tracking passes, and receives changes and removals for entities and other players it tracks. Vanilla PacketDecoder, Connection.exceptionCaught and PacketBundlePacker, and NeoForge SyncAttachmentsPayload.STREAM_CODEC, reject a malformed attachment envelope whether or not it is bundled. Sunrise uses the same network NBT decoder for eager and queued values, following vanilla NbtIo.readAnyTag, CompoundTag.loadCompound and ListTag.loadList. Its queued typed representation takes no more space than the encoded packet, including on the integrated connection (vanilla LocalFrameDecoder). Attachment send refusals are logged on each occurrence, not suppressed for the rest of the connection. Main payloads use the same epoch check and refusal handling inside and outside a bundle, following NeoForge MainThreadPayloadHandler and ClientPayloadContext.enqueueWork. A panic in the Main or Network handler or its enqueued work disables only that callback and reports the owning mod through the shared panic log and toast; it does not cancel unrelated accepted bundle work."
migrate = "No call or wire format changes. Keep reading `state.attachments` and `snapshot.get(&KEY)` in renderers, or `KEY.get(host, holder)` via `Host::attachments` for synced holders such as another player. Those same reads may now observe updates or removals before placement; draw your default when the next render snapshot returns `Ok(None)` after a removal. Do not request a resync on placement. Keep implementing `IPayloadHandler::handle` (and `PayloadWork::run` for queued work) and returning `PayloadHandleError::Failed` for ordinary failures; a panic is now reported separately, without disconnecting the session. Use `cx.disconnect(reason)` from a successful handler to intentionally disconnect."
