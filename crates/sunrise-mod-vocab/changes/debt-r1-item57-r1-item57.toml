ids = ["hook:camera_submersion"]
why = """
Vanilla and NeoForge's `LevelExtractor.extractPlayerState` use the player's tick-sampled eye fluid for water overlay
eligibility, not `Camera.getFluidInCamera`. `EntityFluidInteraction.update` includes an eye at the water surface.
`LocalPlayer.tick` still reaches `Entity.baseTick`'s fluid update on the death screen, so water added or removed
at the eye there affects the overlay after the next player tick. Sunrise still lets camera-submersion listeners
override the overlay, but the input now starts at that tick sample.
The other readers at `Camera.getFluidInCamera` sites still use camera geometry and `state_at_viewpoint`.
"""
migrate = """
Keep assigning `*event.fog_type = FogType::Water` in `Hooks::camera_submersion` to force the first-person water
screen overlay, or `*event.fog_type = FogType::Atmospheric` to clear it. For the overlay read at the player's eye,
the input is now `Water` if the player's tick sampled water there, or `Atmospheric` otherwise, not the result of a
separate camera geometry test. If you used `state_at_viewpoint` to alter this overlay as a side effect of changing
fog, keep it for the fog and set `event.fog_type` in `camera_submersion` at the eye for the overlay.
"""
