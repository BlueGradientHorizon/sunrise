ids = [
    "method:prelude::ClientRenderClientHost::set_block_extra_models",
    "type:BlockExtraModelsError",
]
why = "#2763: Native client mods attach registered standalone models to a position in the World phase, for NeoForge ModelData-style geometry without a block state per combination. A refused call changes nothing: NotLoaded means the position is outside a resident column or the level height, Model means the handle is stale or is not a registered standalone model, and the generated Unavailable response covers calls outside World. A resend of a resident column preserves attachments at unchanged cells; unloading the column clears them. After the block geometry, extra faces draw in block and list order. Drawing stops before the next face whose worst-case expansion cannot fit the section's upload budget, so the last model may be partially drawn. Resolve new handles in client_resources_reloaded and reapply in the next World-phase callback."
