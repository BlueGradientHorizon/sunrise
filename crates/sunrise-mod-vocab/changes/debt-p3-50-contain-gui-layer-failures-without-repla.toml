ids = ["behaviour:gui_layer_failure_containment"]
why = "GUI layer painters and wrappers no longer create HUD paint checkpoints or roll back completed primitives on refusal or panic, matching NeoForge's GuiLayerManager.render and layer callbacks and vanilla's Gui.extractRenderState and Hud.extractRenderState, which submit primitives directly into the shared GUI state without per-layer replayable rollback snapshots. Lexical pose cleanup in gui_paint, lexical scissor cleanup on DrawContext drop, independent malformed draw checks, callback failure reporting (logging every refusal, logging and queueing an error toast and disabling the faulting callback on panic), and isolation of subsequent layers are preserved."
migrate = "No signature change. Do not rely on a refused or panicking HUD layer callback rolling back primitives it already submitted to DrawContext before failing: validate inputs before drawing or group dependent ops in a single DrawContext::gui_paint call. Open push_clip scopes and gui_paint poses still clean up automatically, and later layers still draw independently."
