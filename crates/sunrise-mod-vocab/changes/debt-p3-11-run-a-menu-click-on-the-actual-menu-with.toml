ids = [
    "hook:menu_clicked",
]
why = """Removed the synthetic decided-action wrapper and whole-inventory snapshot/undo around `MenuPart::menu_clicked` (issue #3635, debt p3-11). Matching vanilla 26.3 `ServerGamePacketListenerImpl.handleContainerClick`, `AbstractContainerMenu.clicked`/`doClick`, `AbstractContainerMenu.isValidSlotIndex`, `AbstractContainerMenu.sendAllDataToRemote`/`broadcastChanges`, and `Slot` operations, `menu_clicked` v4 now runs directly on the receiving menu before default click execution. Returning `Flow::Cancel` skips only the default click and resyncs the menu and cursor while keeping prior writes; returning `Flow::Continue` rechecks live receiver preconditions (connected non-dead/non-disconnecting player, same menu generation and window, non-spectator, valid backing slots and slot index) and runs default click execution on the live menu. Opening a replacement menu or closing the menu inside `menu_clicked` runs immediately and skips default click execution on the old menu. A panic in a `MenuPart::menu_clicked` callback aborts any transaction opened by that callback, disables only that mod's `menu_clicked` callback for the session with an error log and error toast naming the mod, and lets remaining parts continue; phase refusals report each time without disabling the callback."""
migrate = """Rebuild `MenuPart::menu_clicked` listeners against hook version 4. Do not expect an enclosing transaction from `host.transaction_current()` inside `menu_clicked`: open one explicitly with `host.transaction(|host, tx| ...)` when you want atomic multi-step edits, and do not rely on a refused default click or `Flow::Continue` after a write rolling back prior unrelated writes. `open_menu`, `PlayerRef::open_mod_menu`, `close_menu`, and `MenuRef::close_container` now execute immediately during `menu_clicked` instead of returning `Ok(None)` / `OpenMenuError::ClickInProgress` or deferring close until commit."""
