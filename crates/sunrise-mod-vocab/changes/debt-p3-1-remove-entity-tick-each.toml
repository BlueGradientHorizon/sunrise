ids = [
    "method:EntitiesRegistrar::entity_tick_each",
    "method:EntitiesRegistrar::entity_tick_each_entity",
]
why = """
Every observed entity is told `entity_tick_pre` and `entity_tick_post` alone, right before and after its own tick, as NeoForge wraps each entity's tick in `ServerLevel.tickNonPassenger` separately. There is no family batching left to opt out of, so asking for a type to be told alone does nothing.
"""
migrate = """
Delete every call to `Registrar::entity_tick_each(type)` and `entity_tick_each_entity()`. A listener of `entity_tick_pre` and `entity_tick_post` already hears each entity alone.
"""
