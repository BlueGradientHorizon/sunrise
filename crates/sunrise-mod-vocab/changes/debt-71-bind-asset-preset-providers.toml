why = "Debt 71: bind asset and preset providers directly at registration instead of registering bare IDs and broadcasting a second hook. Step 1 follows NeoForge ModelEvent.RegisterLoaders / UnbakedModelParser (accepting any valid Identifier namespace, rejecting duplicates and built-in collisions neoforge:composite / neoforge:obj, with no arbitrary quad-count cap) and RegisterBlockStateModels / BlockStateModelHooks (LateBoundIdMapper: accepting any valid Identifier namespace with last-writer-wins replacement). Step 2 follows NeoForge RegisterSpriteSourcesEvent / vanilla SpriteSources (LateBoundIdMapper: accepting any valid Identifier namespace with last-writer-wins replacement, and checking registered providers ahead of hardcoded built-ins minecraft:directory, minecraft:single, minecraft:filter, minecraft:unstitch, and minecraft:paletted_permutations during atlas decode so vanilla overrides take effect). Step 3 follows NeoForge RegisterJsonAnimationTypesEvent / AnimationTypeManager / AnimationParser and vanilla AnimationChannel / KeyframeAnimation: bind custom target (apply + parse-time vector converter) and interpolation callbacks at registration, accept any valid Identifier namespace while rejecting duplicates and collisions with the five built-ins (minecraft:position, minecraft:rotation, minecraft:scale, minecraft:linear, minecraft:catmullrom), resolve and convert custom target vectors directly onto AnimationChannel and Keyframe during parse (deleting the per-file u16 index table, AnimationTypes, TypedKeyframeAnimation, and bake_with), and bake/play directly through AnimationHolder::bake(&root) with no lookup per sample. Callback panics disable that mod's callback for the session with an error log and SystemToast; non-panic refusals report each time without latching."
migrate = "In Hooks::register_model_loaders, replace `event.loaders.push(id)` and Hooks::bake_model_loader with `event.register(Identifier::parse(id)?, |input| Ok(quads))`, reading `input.model`, `input.config`, and `input.textures`. In Hooks::register_block_state_models, replace `event.definitions.push(id)` and Hooks::instantiate_block_state_definition with `event.register(Identifier::parse(id)?, |input| Ok(picks))`, reading `input.block`, `input.config`, and `input.states`, and returning `Err(reason)` to refuse a file. In Hooks::register_sprite_sources, replace `event.sources.push(id)` and Hooks::sprite_source with `event.register(Identifier::parse(id)?, |input| Ok(outputs))`, reading `input.atlas`, `input.config`, and `input.resources` (a borrowed `&dyn ResourceReader`), and returning `Err(reason)` to report a failure without latching. In Hooks::register_json_animation_types (hook version 2), replace `event.types.push(JsonAnimationType::Target(id))` and `AnimationTypes` with `event.register_target(id, |part, value| ..., |raw| ...)` and `event.register_interpolation(id, |keyframes, alpha, current_idx, next_idx, scale| ...)`. Replace `holder.bake_with(&root, types)?` and `holder.bake(&root)?` with `holder.bake(&root)` (now infallible and returning `KeyframeAnimation` directly); remove `AnimationTypes`, `TypedKeyframeAnimation`, `JsonAnimationType`, `RegisteredAnimationType`, `AnimationError`, and `AnimationHolder::types`. Match `AnimationTarget::Custom(bound)` and `Interpolation::Custom(bound)` by reference (`AnimationTarget`, `Interpolation`, and `Keyframe` are `Clone` instead of `Copy`), and note that `AnimationHolder` is no longer `Wire`."
