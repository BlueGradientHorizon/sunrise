why = "Vanilla 26.3 (`Component.java` `getString` and `getVisualOrderText`, `Font.java` `width` and `split`) performs in-memory text resolution and font measurement infallibly without a 512-node tree depth cap or `ExtraCodecs` profile/property bounds; those limits belong to serialization boundaries (`ComponentSerialization.CODEC`, `NbtAccounter`, Wire, and network/NBT writes). Making in-process text reads infallible removes synthetic `TextFormError` results from callers and allows `text_string` to resolve literals and fallbacks directly during pack discovery and startup reload registration."
migrate = """\
Remove `?`, `.unwrap()`, and `Result` pattern matching from calls to `TextHost::text_string`, `ClientTextClientHost::text_visual_order`, `ClientTextClientHost::text_width`, `ClientTextClientHost::text_split`, and `BlockEntityDrawContext::text_width`; they now return `String`, `Vec<VisualTextCharacter>`, `i32`, `Vec<Text>`, and `f32` directly. `TextHost::text_from_json` and network/NBT write boundaries still return `Result<_, TextFormError>`."""
