ids = ["method:ClientSession::client_language_right_to_left"]
why = "Adds a client read of whether the applied language reads right to left (Language.isDefaultRightToLeft, the flag Font.isBidirectional reads), so a mod lays out a row of GUI pieces in reading order (#5354)."
migrate = "Additive. Read it on the client; it is None outside a logged-in client world, as client_language."
