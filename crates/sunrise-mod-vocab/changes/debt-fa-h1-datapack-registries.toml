ids = [
    "type:DatapackHandle",
    "type:DatapackGenerationExhausted",
    "type:DatapackReadError.WrongSession",
    "type:DatapackReadError.StaleGeneration",
    "handle:LevelRef::datapack_handle",
    "handle:LevelRef::datapack_read",
    "type:DatapackSnapshot",
    "type:DatapackRegistrySet",
]
why = "Removed DatapackHandle, DatapackGenerationExhausted, session/generation counters on DatapackRegistrySet and DatapackSnapshot, and DatapackReadError::{WrongSession, StaleGeneration}, making DatapackRegistrySet construction infallible and matching vanilla net.minecraft.network.protocol.configuration.ClientboundRegistryDataPacket (ClientboundUpdateRegistriesPacket) and net.minecraft.world.level.Level#registryAccess. Also allowed parked loaded server dimensions in LevelRef datapack reads on the logical server, matching vanilla net.minecraft.server.level.ServerLevel#registryAccess."
migrate = "Replace `let handle = level.datapack_handle(host, registry, entry)?; level.datapack_read(host, &handle, &mut |e| ...)?;` with `level.datapack_read(host, registry, entry, &mut |e| ...)?;`. Remove match arms on `DatapackReadError::WrongSession` and `DatapackReadError::StaleGeneration`, and drop uses of `DatapackHandle` and `DatapackGenerationExhausted`. Code constructing `DatapackSnapshot` omits the removed `session` and `generation` fields; callers building `DatapackRegistrySet` use `DatapackRegistrySet::from_candidate(candidate)` or `DatapackRegistrySet::received(candidate)` and read entries directly with `set.get(registry, entry)`."
