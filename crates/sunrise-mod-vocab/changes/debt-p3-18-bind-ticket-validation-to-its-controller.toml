why = "NeoForge's RegisterTicketControllersEvent.register binds a TicketController's LoadingValidationCallback. ForcedChunkManager.activateAllDeactivatedTickets lends it only that controller's saved rows in the actual server level before activation, alongside vanilla TicketStorage.activateAllDeactivatedTickets, and TicketHelper.getBlockTickets/getEntityTickets return unmodifiable maps of the original tickets that do not reflect removals made during validation. Sunrise no longer broadcasts validation, filters it by the current caller, or rebuilds owned ticket vectors on each read. A panic disables only that validator for the session; removals already made still apply."
migrate = "Replace register_ticket_controller(name, false) with register_ticket_controller(name, None). Replace register_ticket_controller(name, true) and its Hooks::validate_tickets implementation with register_ticket_controller(name, Some(Arc::new(move |host, level, tickets| { ... }))). Move each event.controller branch into the closure registered for that controller. Use level and level.dimension().id(host) instead of event.dimension (the id is now Option<&str>), and use tickets instead of event.validation. Update block_tickets() and entity_tickets() callers from owned Vec pairs to borrowed &BTreeMap<[i32; 3], TicketSet> and &BTreeMap<u128, TicketSet> views (for example, iterate .keys().copied() or clone keys before removing); those maps show the original staged tickets for the whole callback even after removals. Remove the ValidateTicketsEvent import and keep the returned TicketController as before."
