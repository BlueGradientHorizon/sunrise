ids = ["behaviour:retained_recipe_and_command_panic_containment"]
why = "Keep the owning mod's call at vanilla Ingredient.test (NeoForge ICustomIngredient.test), recipe serialization at Recipe.STREAM_CODEC (NeoForge RecipeContentPayload.create), and command execution at ExecuteCommand.execute and Commands.performCommand (NeoForge RegisterCommandsEvent's Brigadier dispatcher). Those sites do not undo arbitrary partial effects. Sunrise now contains a native panic at those three retained callback sites using the same named log and error toast as hook dispatch. A command already in a transaction uses the existing nested journal, as in NeoForge Transaction.open(parent); the executor does not make an ordinary command transactional."
migrate = "Keep using IngredientDefinition::new and IngredientPredicate::test, CraftingRecipeKind::write or RecipeSerializer::write, and Command::executes; signatures are unchanged. Return false for a normal ingredient non-match, Err(message) for a recipe that cannot be written, or None for a normal command failure, rather than panicking. A panic now disables your predicate for that kind, writer for that serializer ID, or executor for that command usage until the session ends; reloading recipes or registering commands again does not re-enable it. A disabled predicate answers false, a disabled writer's recipes are omitted from sync, and a disabled executor is not run. A panicking command does not run execute-store result callbacks; unjournaled command effects still remain."
