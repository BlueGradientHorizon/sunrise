ids = ["method:Hooks::register", "hook:config_reloading", "hook:config_unloading", "hook:add_pack_finders", "hook:add_client_reload_listeners", "hook:add_server_reload_listeners", "hook:blocks", "hook:items", "method:PackFinders::add_pack_finders", "method:BlocksEvent::register", "method:ItemsEvent::register"]
why = "Vanilla 26.3 PackRepository.discoverAvailable collects packs from each repository source and BuiltInRegistries.bootStrap freezes completed registrations. NeoForge ResourcePackLoader.populatePackRepository posts AddPackFindersEvent, RegisterEvent.register writes to the registry, and its loader’s ConfigWatcher.run and ConfigTracker.unloadConfig deliver reload and unload without undoing live writes. Sunrise contains failures at its shared callback boundary: one panic disables that mod’s callback, reports it by name and lets later callbacks run. Existing startup staging is discarded on a panic; a setting write outside a journal stays in effect."
migrate = "Keep your Hooks::register, config_reloading, config_unloading, blocks and items method signatures. Continue to submit blocks/items through event.register(value) and handle its returned DeclarationError, and keep handling Registrar::refuse and PackFinders errors as before; ordinary errors do not disable your callback. A panicking registration cannot publish its pending entries, and live config writes already made are not undone. For add_pack_finders, use &mut dyn PackDiscoveryContext instead of HostSide and call context.live_host() if you need the live game; continue to submit through event.packs.add_pack_finders(pack). For add_client_reload_listeners, use &dyn ClientReloadListenerContext instead of &dyn ClientHost and call context.published() for the published client resources, when available. For add_server_reload_listeners, use &dyn ReloadContext instead of &dyn Host. Both reload hooks still register through event.listeners. A callback disabled after a panic is not retried until you restart the game."
