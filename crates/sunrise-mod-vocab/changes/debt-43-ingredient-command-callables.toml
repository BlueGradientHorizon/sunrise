why = "Each recipe occurrence now keeps the predicate of the first mod that defines it. Other mods do not run during matching, and the predicate borrows the live stack. An answer with no candidates keeps manual matching but not placement candidates; an unanswered kind fails recipe loading. Native predicates are not recipe JSON or network data."
migrate = "Replace Hooks::ingredient(context, event) and Hooks::ingredient_test(context, event) with Hooks::ingredient(&self, context: &dyn DataLoadContext, event: &mut IngredientEvent<'_>) -> Option<IngredientDefinition>. Return None for an unhandled event.kind. For a handled kind, parse event.data once and return Some(IngredientDefinition::new(items, move |context, stack| ...)), capturing the parsed configuration and returning true to accept the stack or false to reject it. Use stack.item_key() or stack.item_id() instead of the owned stack's item(), stack.damage() for optional damage including Some(0), and stack.stored_component(id) to borrow stored NBT instead of looking in an owned patch. Use stack.has_component(id) for effective presence and stack.component_removed(id) for explicit removal. Do not write candidates into sunrise:resolved_items. Use Ingredient::test(host, stack) to test a resolved ingredient; Ingredient.custom is now an opaque bound predicate, not a kind/metadata tuple. Remove Ingredient, Recipe, PlacementInfo, RecipeRule, FireworkShapeIngredient, RecipeBookCategory and RecipeBookDisplayEntry from Wire payloads or derived Wire fields: keep them in-process and send separate data-only records containing the IDs or display values the receiver needs."
