ids = ["behaviour:hud_layer_registration_refusal"]
why = "Vanilla 26.3 Hud.extractRenderState keeps the built-in paint order. NeoForge's RegisterGuiLayersEvent.register, replaceLayer and wrapLayer apply edits in call order against the layers already registered, and GuiLayerManager.initModdedLayers runs registration once. Sunrise preserves that order and accepts edits from each successful listener as a batch. A refusal while dropping a callback staged and replaced by the same listener also discards that listener's edits. Discarded and retired callbacks are cleaned up under the phase gate and use the shared refusal diagnostic."
migrate = "No signature or call changes: keep event.layers.register(id, placement, draw), event.layers.replace_layer(id, draw) and event.layers.wrap_layer(id, wrap). A true return means the edit is staged; later calls in the listener can use its new anchors. The edits are committed when the listener returns successfully. Do not call Host methods from Drop on a captured value: move that work to a later hook where the method is allowed. Catching a refusal does not save the listener's layer edits."
