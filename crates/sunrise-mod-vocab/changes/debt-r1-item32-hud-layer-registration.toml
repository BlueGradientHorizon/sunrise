ids = ["behaviour:hud_layer_registration_refusal"]
why = "Vanilla 26.3 Hud.extractRenderState keeps the built-in paint order. NeoForge's RegisterGuiLayersEvent.register, replaceLayer and wrapLayer apply edits in call order against the layers already registered, and GuiLayerManager.initModdedLayers runs registration once. Sunrise preserves that order and accepts edits from each successful listener as a batch, so its load-phase gate can refuse a listener without publishing that listener's partial work."
migrate = "No signature or call changes: keep event.layers.register(id, placement, draw), event.layers.replace_layer(id, draw) and event.layers.wrap_layer(id, wrap). A true return means the edit is staged; later calls in the listener can use its new anchors. The edits are committed when the listener returns successfully. Move any phase-forbidden work to an appropriate later hook: catching a phase refusal does not save the listener's layer edits."
