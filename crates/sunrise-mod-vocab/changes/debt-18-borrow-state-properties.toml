`StateProperty::new` is gone. To retain a definition after the host borrow, collect `properties.iter().map(|p| (p.name.to_owned(), p.values.to_vec())).collect::<Vec<_>>()`. Store owned `(String, Vec<String>)` entries in place of constructing `StateProperty` yourself. For matching constraints, continue to use `StateConstraint::new(name, value)`.
`StateProperty` and `FluidDefinition` no longer implement `Wire`. If you send these facts as a typed payload, copy the needed fields into your own owned `#[derive(Wire)]` payload type instead of using the borrowed API definition as the payload.
