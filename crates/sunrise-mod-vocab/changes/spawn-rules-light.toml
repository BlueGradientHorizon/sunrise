ids = ["handle:LevelRef::check_spawn_rules", "type:LightOverride"]
why = "A mod runs a mob type's spawn rules at a position with the light check overridden (#6042): SpawnPlacements.checkSpawnRules with the real light, one light level everywhere, or any level, followed by mob_spawn_placement_check so other mods' spawn checks apply. Apothic Spawners' Ignore Light modifier needs it, where Java wraps the level to report another light. The call draws from a copy of the level random."
migrate = "Additive: nothing to change."
