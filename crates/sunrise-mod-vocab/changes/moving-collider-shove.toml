ids = ["behaviour:moving_collider_shove"]
why = "Turning and combined-motion mod colliders now shove by minimum separation at the final pose. Every mod-collider shove cancels only inward velocity after an actual move, and an upward shove leaves the collider's vertical speed; vanilla pistons and shulkers are unchanged."
migrate = "No source change is needed. Do not rely on a turning collider leaving overlapped bodies in place or on a body keeping velocity that points into a mod-collider shove."
