why = "GUI primitives can draw directly on the current batch in a lexical pose and scissor, with no command buffer. A refusal is local to the call; returning it from the callback discards the whole group."
migrate = "In place of draw.gui_paint(&ops) for primitives, use draw.draw_gui(&mut |gui| { ...; Ok(()) }). Replace Push(ops) through its Pop with gui.scope(&ops, None, &mut |child| { ...; Ok(()) }); pass Some([x, y, w, h]) to set a local scissor. Map Fill and FillGradient corners to [x0, y0, x1 - x0, y1 - y0] and call fill or fill_gradient with the original colours. Replace Text with gui.text(&text, [x, y], color, shadow). Replace Sprite with gui.blit_sprite(name, [x, y, w, h], region.map(|[sw, sh, u, v]| GuiSpriteRegion { size: [sw, sh], offset: [u, v] }), color, blend); replace AtlasSprite with gui.atlas_sprite(name, [x, y, w, h], color); replace Blit with gui.blit(texture, [x, y, w, h], GuiBlitRegion { uv, src, tex }, color, blend). Coordinates passed to the canvas are f32 GUI pixels. Use ? to discard the group on a refused draw or return Err(GuiDrawError::Abort) to discard it explicitly. A caught inner scope error leaves earlier draws in its parent intact."
