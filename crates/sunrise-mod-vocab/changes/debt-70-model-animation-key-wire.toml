- For JSON serialization of model trees or meshes, use `serde_json::to_string` / `serde_json::from_str` (or `String::from(&mesh)` / `MeshDefinition::try_from(json)` and `String::from(&part)` / `ModelPart::try_from(json)`).
- If a network payload needs to synchronize animation triggers, pose angles or binding names, define your own `#[derive(mod_api::Wire)]` record carrying only the primitive fields (for example an animation id string, tick count or rotation angles) and apply them locally on the receiving client.
