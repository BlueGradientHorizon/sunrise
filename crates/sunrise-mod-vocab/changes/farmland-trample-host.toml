ids = ["hook:farmland_trample", "hook:farmland_trample.entity", "hook:farmland_trample.pos", "hook:farmland_trample.state", "hook:farmland_trample.fall_distance", "method:Hooks::farmland_trample", "type:FarmlandTrampleEvent", "type:FarmlandTrampleEvent.entity", "type:FarmlandTrampleEvent.pos", "type:FarmlandTrampleEvent.state", "type:FarmlandTrampleEvent.fall_distance"]
why = "Version 3 fires farmland_trample with the server's own host and the landing entity as a LivingRef, instead of a loop context with an entity id. A listener reads the entity's pose, sneak state and type through the handle, and its writes and the apply run in one transaction: farmland becomes its base block only if the block at pos is still the same farmland state when the listener returns, otherwise the trample is refused and never recomputed. Cancel keeps the farmland and its crop, and the entity takes its fall damage either way. The event now crosses the wasm boundary, as any hook with a host does."
migrate = "Rebuild native and wasm mods. Take a host and read the entity through event.entity (a LivingRef) where the entity id was given; pos, state, fall_distance and cancel work as before."
