why = "Scratch item places are now lent for one transaction scope instead of parked by ID across calls, following NeoForge 26.3's ItemAccess.forStack (StackItemAccess) and DispenseFluidContainer (ItemStacksResourceHandler(2) with ItemAccess.forHandlerIndex(handler, 0).oneByOne()). ItemsServerHost::scratch_stack, scratch_take, scratch_slots, and scratch_take_slots, the separate ItemPlace::ScratchSlots variant, and ItemPlace Wire tags 10 and 14 are removed. HostTransaction::scratch_stack and HostTransaction::scratch_slots open a scoped transaction (nested when one is already open), lend an opaque journal-bound ItemPlace::Scratch(ScratchSlot) that cannot cross Wire, restore lent slots before fallback when a nested transaction aborts, keep committed nested writes provisional until the enclosing scope commits, keep closed loans out of longer-lived outer journals, and publish the resulting stack or slot pair only on commit."
migrate = '''
Import `mod_api::{HostTransaction, ScratchError, ServerHost}`.

For a single fixed-item scratch slot (`ItemAccess.forStack`), replace:
```rust
let place = host.scratch_stack(tx, stack)?.ok_or(err)?;
// work on `place` using `tx`
let final_stack = host.scratch_take(tx, &place);
```
with:
```rust
let (value, final_stack) = host.scratch_stack(stack, |host, tx, place| {
    // work on `place` using `host` and `tx`
    Ok(value)
})?;
```

For a two-slot dispenser scratch copy (`DispenseFluidContainer`), replace:
```rust
let place = host.scratch_slots(tx, stack)?.ok_or(err)?;
// work on `place` using `tx`
let (first, second) = host.scratch_take_slots(tx, &place).ok_or(err)?;
```
with:
```rust
let (value, (first, second)) = host.scratch_slots(stack, |host, tx, place| {
    // work on `place` using `host` and `tx`
    Ok(value)
})?;
```

Handle `ScratchError<E>` from both methods: `ScratchError::Unavailable` when the host could not open a transaction (closure did not run), `ScratchError::Stack(StackWriteError)` when the initial stack failed write validation (closure did not run), and `ScratchError::Aborted(error)` when the closure returned `Err(error)` (writes rolled back and slots discarded).

Update matches on `ItemPlace`: `ItemPlace::Scratch` now carries an opaque `ScratchSlot` instead of `u64`, `ItemPlace::ScratchSlots` is removed, and encoding `ItemPlace::Scratch` with `Wire` fails with `WireError::Invalid` (wire tags 10 and 14 are rejected with `WireError::Tag`). Do not retain or send lent scratch handles outside their callback scope.

For a custom `ServerHost` test double that supports lent scratch slots, implement `ServerHost::with_scratch_stack_scope` and `ServerHost::with_scratch_slots_scope`, returning `Ok(Some(...))` on commit, `Ok(None)` on abort, or `Err(ScratchUnavailable)` when no transaction can open or the initial stack is invalid; the default implementations return `Err(ScratchUnavailable::Transaction(TransactionUnavailable))`.
'''
