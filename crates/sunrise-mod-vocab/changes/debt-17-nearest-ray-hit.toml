ids = ["handle:LevelRef::ray_trace_nearest_entity"]
why = "A nearest-hit query can filter each geometric hit and remember only the best one, without collecting or sorting a list. Ordered all-hit queries are unchanged."
migrate = "If you use `level.ray_trace_entities(host, from, to, margin, exclude)?.into_iter().find(accept)` only to find the nearest match, use `level.ray_trace_nearest_entity(host, from, to, margin, exclude, &mut |hit| accept(&hit))` instead. It returns `Result<Option<EntityRayHit>, LevelReadError>`: `Ok(None)` means no accepted hit, `Stale` means an old level handle, and `Unavailable` means invalid geometry or no world access. The predicate now runs for every geometric hit in spatial traversal order, not nearest-first order. Keep `ray_trace_entities` if you need every hit or depend on the predicate running nearest first."
