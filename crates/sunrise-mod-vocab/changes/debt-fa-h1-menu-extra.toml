ids = ["hook:menu_extra_data", "handle:PlayerRef::open_mod_menu", "type:OpenMenuError"]
why = "Raised menu extra data limit from 32 KiB to 1,048,555 bytes (CLIENTBOUND_LIMIT - 21) to match vanilla net.minecraft.network.protocol.common.ClientboundCustomPayloadPacket.MAX_PAYLOAD_SIZE (1 MiB), removed the silent empty-data fallback on oversize block-menu extra data so oversize opens fail loudly, removed the legacy revision-0 menu_extra wire layout, rejected explicit revision-0 configuration queries and answers, and gated block-backed mod menus on negotiated menu_extra revision >= 1. Malformed clientbound menu_extra payloads now log an error and disconnect the client to match NeoForge net.neoforged.neoforge.client.network.ClientPayloadHandler. Bumped hook:menu_extra_data from version 1 to 2 because output past 32 KiB is now delivered up to 1,048,555 bytes and oversize output now refuses the menu open instead of silently clearing the bytes."
migrate = "If your manifest pins `menu_extra_data`, request `hook_version = 2`: payloads between 32 KiB and 1,048,555 bytes are now delivered to the client instead of discarded, and oversize `menu_extra_data` output now logs an error and refuses the menu open instead of silently clearing the bytes and opening the screen empty. `PlayerRef::open_mod_menu` also accepts up to 1,048,555 bytes; both mod-menu routes require peers to negotiate the `sunrise:menu_extra` revision."
