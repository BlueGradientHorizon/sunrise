ids = ["hook:menu_extra_data", "handle:PlayerRef::open_mod_menu", "type:OpenMenuError"]
why = "Raised menu extra data limit from 32 KiB to 1,048,555 bytes (CLIENTBOUND_LIMIT - 21) to match vanilla net.minecraft.network.protocol.common.ClientboundCustomPayloadPacket.MAX_PAYLOAD_SIZE (1 MiB), removed the silent empty-data fallback on oversize block-menu extra data so oversize opens fail loudly, removed the legacy revision-0 menu_extra wire layout, and made malformed clientbound menu_extra payloads log an error and disconnect the client to match NeoForge net.neoforged.neoforge.client.network.ClientPayloadHandler."
migrate = "No source change is required for mods within the limit. Menu extra data up to 1,048,555 bytes is now accepted by `menu_extra_data` and `PlayerRef::open_mod_menu`; oversize `menu_extra_data` output now logs an error and refuses the menu open instead of silently clearing the bytes and opening the screen empty."
