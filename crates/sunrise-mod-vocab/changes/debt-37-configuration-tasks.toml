why = "Each connection now owns its ordered task instances, so their state stays with them and only the registered task runs (matching NeoForge RegisterConfigurationTasksEvent.register, ServerPayloadContext.finishCurrentTask, and vanilla ServerConfigurationPacketListenerImpl). Registration is an infallible FIFO queue with no empty/duplicate rejection, completion matches the running task's Identifier on the receiving connection across both main-thread and network-thread server configuration handlers without transaction-layer staging, and a refused payload send returns Err without failing the task session."
migrate = """
In `Hooks::register_configuration_tasks` (now version 3), replace \
`event.tasks.push(ConfigurationTask::new(id))` with `event.register(MyTask { id, ... })`. \
Define `MyTask: Send + 'static` and implement `ConfigurationTask`; replace the old record's \
`id` field with your own, returned by `task_type(&self) -> &Identifier`. Registration is \
infallible and appends tasks to the connection's FIFO queue (matching NeoForge's \
`RegisterConfigurationTasksEvent.register`). The event still provides `connection`, `player` \
and `name`, and `event.connection.has_channel(host, channel)` still works in registration.

Move `configuration_task_start` and `configuration_task_tick` into `ConfigurationTask::start` \
and optional `ConfigurationTask::tick`, each taking `&mut self, host: &mut dyn ServerHost, \
context: &mut ConfigurationTaskContext<'_>`. Read your own field instead of `event.task_type` \
and keep state on `self`. In either callback, replace `event.connection.has_channel(host, channel)` \
with `context.has_channel(host, channel)`, and `event.connection.send_payload(host, channel, bytes)` \
with `context.send_payload(host, channel, bytes)`. `host.configuration_send_payload` takes \
`ConfigurationConnection`. A refused send returns `Err(ConfigurationTaskError::Payload(_))` \
without automatically failing the task session. Replace `connection.finish(host, task_type)`, \
`host.configuration_finish(connection, task_type)` or `event.finished = true` with \
`context.finish()`. Replace `connection.fail(host, reason)` and \
`host.configuration_fail(connection, reason)` with `context.fail(reason)`.

For delayed completion, call `cx.finish_configuration_task(&task_type)` in a server \
configuration payload handler (main thread or network thread) with the task's `Identifier` \
(matching NeoForge's `ServerPayloadContext.finishCurrentTask(ConfigurationTask.Type)`), and \
use `cx.reply(channel, bytes)` to send its reply. On the main thread, completion takes effect \
directly in the configuration session without transaction staging (the server advances on the \
next tick after committed replies are queued); on the network thread, completion is bound to \
the validated task turn and publishes inside the active-epoch gate after staged replies, so \
handler failure, an explicit disconnect, or epoch invalidation discards it. Custom \
`IPayloadContext` implementations must implement \
`finish_configuration_task(&mut self, task_type: &Identifier) -> Result<(), ConfigurationTaskError>` \
and return `WrongContext` outside server configuration payload handlers.

Match `WrongType` when the running task on this connection has a different type, `NotRunning` \
when no task is running or this handler already requested completion, `WrongContext` for the \
client or non-configuration phases, and `Disconnected` for an ended connection or configuration \
epoch. Send refusals still use `Payload`. `ConfigurationTask`, `ConfigurationConnection` and \
`ConfigurationTaskError` no longer implement `Wire`; keep task objects, contexts, connection \
capabilities, and errors local. Transmit only your own challenge and reply data.
"""
