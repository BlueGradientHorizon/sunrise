why = "Client commands now bind their executors directly to the current client dispatcher generation via `Command::executes_client` -> `ClientCommandRegistration` in `register_client_commands` (v2), removing the separate `Hooks::command` string-redispatch hook (`CommandEvent`) and matching NeoForge `RegisterClientCommandsEvent` and `ClientCommandHandler.runCommand`, while refusing server-only handle argument kinds (`player`, `players`, `entity`, `entities`, `dimension`) and containing client executor panics under shared `CallbackOwner`. Custom command argument completion now uses one `Suggestion` type (`mod_api::Suggestion`) and one `CommandArgumentType::suggest(&self, request: &SuggestionRequest) -> Vec<Suggestion>` method on both server and client commands (removing `CommandSuggestion`, `SuggestionProvider`, `SuggestionReply`, and `CommandArgumentType::suggestion_provider`), matching Brigadier's unified `Suggestion`/`SuggestionsBuilder`, vanilla 26.3 `ClientboundCommandSuggestionsPacket` per-entry string limits (32,767 UTF-16 code units for text, 65,535 modified UTF-8 bytes for literal NBT tooltip) and `ServerCommandSuggestionsProvider.limitSuggestionCount`'s post-sort 1,000-entry truncation at the packet boundary, with `kind`/`parse`/`suggest` contained under shared `CallbackOwner`. Entity selector registration now returns a scoped `Result<(), EntitySelectorRegistrationError>` using Brigadier's unquoted-string alphabet (`[0-9A-Za-z_.+-]`) without calling `base()` at registration or enforcing a 256 KiB registration budget, matching NeoForge `EntitySelectorManager.register` and Brigadier `StringReader.isAllowedInUnquotedString`; protocol framing (vanilla `ClientboundCustomPayloadPacket` 1 MiB and `STRING_UTF8` 32,767 UTF-16 code units) applies at the `sunrise:selector_tokens` network boundary and `base()`/`matches()` run under shared `CallbackOwner` containment. Brigadier resource command arguments now own their registry names per dispatcher without a leaked `'static` interner or registration budget (vanilla 26.3 `ArgumentTypeInfos.bootstrap`, `ResourceArgument.Info.deserializeFromNetwork`, `Identifier.isValidNamespace`/`isValidPath`, `FriendlyByteBuf.readIdentifier`)."
migrate = """
For client commands, in `Hooks::register_client_commands` change `event.commands.push(Command::new(usage))` to `event.commands.push(Command::new(usage).executes_client(move |host, command| { ... }))` and delete `Hooks::command` (and any `CommandEvent` import). Read parsed arguments from the borrowed `CommandInvocation` instead of re-parsing the raw command string; return `Some(1)` (or `Some(n)`) for success or `None` for failure. Server-only handle argument kinds (`player`, `players`, `entity`, `entities`, `dimension`) and nonzero operator levels are refused on client commands, and a panicking client command executor disables only that command via `CallbackOwner` and shows `command.failed` in chat without forwarding the command to the server.

For custom command argument types, replace `CommandSuggestion`, `SuggestionProvider`, `SuggestionReply`, and `CommandArgumentType::suggestion_provider` with `CommandArgumentType::suggest(&self, request: &SuggestionRequest) -> Vec<Suggestion>`. Read `request.prefix`, `request.arguments` (`Vec<TypedArgument>`), and `request.sender` (`Option<CommandSender>`), and construct entries with `request.suggest(text)`, `request.suggest_with_tooltip(text, tooltip)`, `request.suggest_from(offset, text)`, or `Suggestion::new((start, end), text)` (with `.with_tooltip(...)`, `.with_range(...)`, `.with_int_value(...)`). The same argument type works on both server and client commands, `tab_complete` still observes server completions, oversized entries are dropped individually at the `ClientboundCommandSuggestionsPacket` boundary before vanilla's post-sort 1,000-entry truncation, and a panic in `kind`, `parse`, or `suggest` disables only that argument type for the session and reports an error notice.

For custom entity selectors, handle the `Result<(), EntitySelectorRegistrationError>` returned by `r.register_entity_selector(name, selector)` (for example `r.register_entity_selector("allies", Allies)?;` or `.unwrap()`). Invalid registrations return a typed `EntitySelectorRegistrationError` without poisoning unrelated registrations. Token names accept any non-empty Brigadier unquoted-string characters (`[0-9A-Za-z_.+-]`) other than vanilla's `p`, `a`, `r`, `s`, `e`, `n`. `EntitySelectorType::base()` is evaluated when building command registries and syncing selector metadata rather than during registration, and a panic in `base()` or `matches()` disables only that selector for the rest of the session and reports an error toast.

No mod API code changes are needed for `resource:<registry>` command arguments: keep using `Command::new("pick <kind:resource:minecraft:entity_type>")` and reading `CommandArgumentValue::Id`, with no separate 256-byte or 256-registry registration budget. If a native replacement constructs `sunrise_client::command::ArgType` directly, replace `&'static str` registry names with `RegistryId::from_static("...")` or `RegistryId::parse(name)` and read them with `registry.as_str()`.
"""
