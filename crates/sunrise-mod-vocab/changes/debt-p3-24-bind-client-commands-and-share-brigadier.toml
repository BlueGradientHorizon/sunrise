why = "Command arguments now own registry names when they come from a mod or a server, so replacing a dispatcher frees those names without a global interner or registration budget (vanilla 26.3 ArgumentTypeInfos.bootstrap, ResourceArgument.Info.deserializeFromNetwork, Identifier.isValidNamespace/isValidPath, FriendlyByteBuf.readIdentifier; NeoForge RegisterCommandsEvent and RegisterClientCommandsEvent). Entity selector registration now returns a scoped Result<(), EntitySelectorRegistrationError> using Brigadier's unquoted-string alphabet ([0-9A-Za-z_.+-]) without calling base() at registration or enforcing a 256 KiB registration budget, matching NeoForge EntitySelectorManager.register and Brigadier StringReader.isAllowedInUnquotedString. Protocol framing (vanilla ClientboundCustomPayloadPacket 1 MiB and STRING_UTF8 32,767 UTF-16 code units) is applied at the sunrise:selector_tokens network boundary, and selector base()/matches() callbacks run under shared CallbackOwner containment so a panic disables only that selector for the session and reports an error notice."
migrate = """
No mod API code changes for resource command arguments: keep using `Command::new("pick <kind:resource:minecraft:entity_type>")` and reading `CommandArgumentValue::Id`. Supply a qualified `namespace:path` for the registry as before; remove any application-side workaround for the old 256-byte or 256-registry registration limit.

If a native replacement constructs a dispatcher argument directly, import `sunrise_client::command::RegistryId`. Replace `ArgType::Res("minecraft:entity_type")` with `ArgType::Res(RegistryId::from_static("minecraft:entity_type"))`. Do the same for `ResKey`, `ResOrTag`, `ResOrTagKey`, `ResourceSelector` and `ResourceOrId`. For a runtime name, call `RegistryId::parse(name)`, handle `None` as an invalid name, and pass the `RegistryId` to the variant. Use `registry.as_str()` to read the name from a matched variant.

For custom entity selectors, handle the `Result<(), EntitySelectorRegistrationError>` returned by `r.register_entity_selector(name, selector)` (for example `r.register_entity_selector("allies", Allies)?;` or `.unwrap()`). Invalid registrations return a typed `EntitySelectorRegistrationError` without poisoning unrelated registrations. Token names now accept any non-empty Brigadier unquoted-string characters (`[0-9A-Za-z_.+-]`) other than vanilla's `p`, `a`, `r`, `s`, `e`, `n`. `EntitySelectorType::base()` is evaluated when building command registries and syncing selector metadata rather than during registration, and a panic in `base()` or `matches()` disables that selector for the rest of the session and reports a mod error toast instead of silently dropping individual candidates.
"""
