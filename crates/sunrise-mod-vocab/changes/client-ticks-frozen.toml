ids = ["handle:EntityRef::ticks_frozen"]
why = "EntityRef::ticks_frozen (Entity.getTicksFrozen) now reads on a client too: the synced DATA_TICKS_FROZEN of the local player and tracked mobs, so a HUD mod that draws its own hearts can pick the frozen ones (#5693)."
migrate = "Nothing to change: a client that read None now reads the synced count."
