ids = ["hook:play_sound"]
why = "NeoForge posts PlaySoundEvent from SoundEngine.play and the listener can reach the live client (Minecraft.getInstance()). The hook lent only a loop context, so a listener could not read live client state at a start or a live refresh. The engine now prepares the start (or the live refresh) without side effects, the game fires the hook with the ClientHost, and the engine applies the answer: a cancel, a replacement sound or its volume, pitch and effects."
migrate = "Change the play_sound listener signature to take the ClientHost instead of `&dyn LoopContext`; the event is unchanged. A start is no longer synchronous with the request: with a listener subscribed it plays on the next client tick, and a PlayResult of Pending is returned to engine callers until then."
