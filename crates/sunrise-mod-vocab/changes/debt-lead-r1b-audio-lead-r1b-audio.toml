ids = [
    "trait:AudioStream",
    "method:AudioStream::read",
    "type:AudioRead.Eof",
    "type:AudioStreamState",
    "method:prelude::AudioClientHost::open_audio_stream",
]
why = """
Vanilla 26.3's Channel.pumpBuffers and Channel.destroy report read and close errors at the source; \
NeoForge's SoundEngine.playWithoutEvent takes the stream from SoundInstance.getStream. Sunrise \
isolates panicking sources on its shared worker. If a rejected source panics during destruction on the \
opening thread, the worker wakes after the mod's pull callbacks are disabled. It ignores in-flight \
read results from that mod and stops its live pull sources even with no further output. Normal EOF \
retirement requires successful source destruction with the owner still enabled. Other mods and \
streams that already retired normally at EOF are unaffected."""
migrate = """
No call or signature change. Keep opening with `host.open_audio_stream(&spec, Box::new(source))`. \
Return `AudioRead::Eof` on a separate read after the last frames as before. It is not a guarantee \
of drain: the worker must still drop the source successfully while the owner is enabled. If source \
destruction fails, or if the owner or its pull callbacks are disabled before retirement completes, \
handle `AudioStreamRef::state()` returning `AudioStreamState::Stopped` without draining queued PCM. \
Do not wait for another device callback to retire a disabled owner's live source. A source already \
retired normally at EOF still drains."""
