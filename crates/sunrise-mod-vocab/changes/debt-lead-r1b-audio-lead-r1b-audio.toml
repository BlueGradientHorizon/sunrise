ids = ["trait:AudioStream", "type:AudioStreamState"]
why = "Vanilla 26.3's Channel.pumpBuffers and Channel.destroy report read and close errors at the source; NeoForge's SoundEngine.playWithoutEvent takes the stream from SoundInstance.getStream. Sunrise isolates panicking sources on its shared worker. If a source panics while being dropped on the opening thread after the worker rejects admission, the worker is signaled after the mod's pull callbacks are disabled, so the mod's live pull sources retire even with no further output. Other mods and normal EOF drain are unchanged."
migrate = "No call or signature change. Keep opening with host.open_audio_stream(&spec, Box::new(source)). After a source panics, including during destruction after the worker rejects admission, a live sibling's AudioStreamRef::state() becomes AudioStreamState::Stopped once the worker retires it; do not wait for a further device callback to drive retirement. PCM from a source that already retired normally at AudioRead::Eof still drains."
