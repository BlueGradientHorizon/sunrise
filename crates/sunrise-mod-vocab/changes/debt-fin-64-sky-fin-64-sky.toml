ids = ["hook:render_level_stage"]
why = """
`AfterSky` now follows the logical pass admitted by vanilla 26.3 `LevelRenderer.addSkyPass`,
where NeoForge posts `RenderLevelStageEvent.AfterSky` immediately after the sky work. Only
lava or powder-snow camera fog, a sky-blocking camera mob effect, or a dimension without a
skybox excludes the pass. Sunrise's sky setting, dragon boss fog, and whether the sky produces
visible geometry do not gate the stage. The engine, inline End sky, or classic pack owns
one notification. `render_level_stage` moves to version 4; all other stages are unchanged.
"""
migrate = """
Keep `Hooks::render_level_stage` and its `RenderLevelStage::AfterSky` match arm (still
`StagePass::None`). Do not use that arm as a test that sky geometry was visible. For per-view
preparation that must run whether or not there is a sky pass, move that work from the
`AfterSky` arm to `Hooks::prepare_render_buffers`. No signature or registration change is needed.
"""
