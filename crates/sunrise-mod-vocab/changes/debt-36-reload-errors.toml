ids = [
  "type:ClientReloadContext",
  "type:ReloadOrderError",
  "type:ReloadResourceError",
  "handle:ReloadResourceError::resource",
  "type:ServerReloadContext",
]
why = "Reload preparation runs in-process. Encoding a file error as an ID and message discarded its original cause; prepare contexts and ordering errors no longer need a serialized form either. `ReloadResourceError`'s `Display` walks the full `Error::source()` chain so logs and `/reload` replies preserve nested causes."
migrate = "Replace `ReloadResourceError::from((id, message))` with `ReloadResourceError::new(id, cause)`, passing the original error rather than its formatted message. Instead of converting `&error` to `(Identifier, String)`, use `error.resource()` for the ID, `std::error::Error::source(&error)` for the cause, and `Display` for logging (its formatted output now walks the full `Error::source()` chain automatically). Remove `Wire` encoding and decoding of reload errors and prepare contexts: use the context passed into `prepare` and borrow IDs and bytes with `list()` and `read(&id)`, and match `ReloadOrderError` variants directly. Return the error directly from `prepare`; applying still waits for all prepares to succeed."
