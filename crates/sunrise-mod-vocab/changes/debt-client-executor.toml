ids = ["type:ClientExecutor", "handle:ClientExecutor::execute", "method:prelude::ServicesClientHost::client_executor"]
why = "Vanilla's BlockableEventLoop.execute (Minecraft.execute) moves work from another thread to the client; Minecraft.runTick drains scheduled work and Minecraft.stop ends the loop. NeoForge uses this hop in its ConnectScreen patch, and its ClientPayloadContext.enqueueWork uses the client PacketProcessor for payload-scoped work. Sunrise's executor submits one-shot closures to the same ordered client drain as queued payload work, even when the caller is already on the client thread. Each callback gets a live host. Shutdown drops pending work; a panic logs and toasts the owning mod and disables only that mod's executor callbacks for the session."
migrate = "Additive; existing payload handlers need no change. In a live client callback, obtain the handle with host.client_executor() and clone it into workers. Replace an off-thread client operation with executor.execute(Box::new(move |host| { /* use the live client host */ })). Keep IPayloadContext::enqueue_work when the task needs that payload's epoch or reply context. Native replacements of net::Session::poll move to net::ClientInbox::poll; each receipt now holds a QueuedEvent with an optional physical session serial (None for application-owned executor work)."
