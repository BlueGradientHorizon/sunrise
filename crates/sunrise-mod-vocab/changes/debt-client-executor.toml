ids = ["type:ClientExecutor", "handle:ClientExecutor::execute", "method:prelude::ServicesClientHost::client_executor"]
why = """
Vanilla's `BlockableEventLoop.execute` (`Minecraft.execute`) moves work to the client thread, as in the \
connector started by `ConnectScreen.startConnecting`. `Minecraft.runTick` runs scheduled executables \
after the packet processor, and `Minecraft.shouldRun` accepts every runnable. NeoForge dispatches \
payload-scoped work through `MainThreadPayloadHandler` and `ClientPayloadContext.enqueueWork`, which \
schedules off-thread submissions on the packet processor. Sunrise submits one-shot closures through \
the same ingress but runs them only after the packet phase. Packets and queued payload work \
published during packet handling are part of that phase, even when a task was submitted first. \
If packet work is deferred, all pending tasks wait. Each task gets a live host, even after a \
disconnect. `TitleScreen`'s Quit button calls `Minecraft.stop`; Sunrise closes its task receiver at the \
start of quitting, including from the live title screen. Like `BlockableEventLoop.doRunTask` for \
recoverable errors, a panic ends only that task and logs the mod's name. Its error toast passes \
through `toast_add` before queuing, as NeoForge's `ToastAddEvent` does in `ToastManager.addToast`."""
migrate = """
Existing payload handlers need no change. In `client_setup`, use `let Some(executor) = \
host.client_executor() else { return; };` and clone it into workers. Restricted hosts such as the \
client-side `entity_entering_section` host return `None`. Replace an off-thread client operation with \
`executor.execute(Box::new(move |host| { /* use the live client host */ }))`. Keep \
`IPayloadContext::enqueue_work` when the task needs that payload's epoch or reply context. When the \
closure runs, recheck retained world handles: a packet may have removed the entity or changed the \
level even if that packet was only published after you submitted the task.

In a `[[native.mixin]]` row, change the target from `sunrise_client_lib::net::Session::poll` to \
`sunrise_client_lib::net::client_inbox::ClientInbox::poll`. The Rust signature for the new target is \
`fn poll(&self) -> Vec<sunrise_client_lib::net::QueuedEvent>`. Return a snapshot of published events; \
the game may take several snapshots in one packet phase. Use `QueuedEvent::into_parts()` to split \
the optional physical session serial, event and optional receive credit; executor work has neither a \
serial nor receive credit. Keep the manifest target `sunrise_client_lib::net::receive_brand`; its Rust \
signature is now `fn receive_brand(payload: &sunrise_protocol::packets::configuration::CustomPayload, \
send: &sunrise_client_lib::net::EventSender)`, replacing `&ingress::Producer<Event>` as argument two."""
