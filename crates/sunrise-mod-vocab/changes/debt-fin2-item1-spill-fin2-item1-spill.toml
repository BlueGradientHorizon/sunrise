ids = ["handle:LevelRef::set_block", "handle:LevelRef::remove_block", "handle:BlockEntityRef::set_lock"]
why = """
A block entity installed by a drop's join listener now retires the old entity's saved tag when it
replaces the row. A lock set on the replacement saves with that entity and survives reload.
Vanilla 26.3's LevelChunk.setBlockEntity and LevelChunk.removeBlockEntity retire the previous
instance, and LevelChunk.getBlockEntityNbtForSaving saves the current one. NeoForge keeps that
ownership at those sites and fires EntityJoinLevelEvent in PersistentEntitySectionManager.addEntity.
"""
migrate = """
No call changes: keep using `level.set_block(host, pos, state, flags)` or
`level.remove_block(host, pos, moved)`. In `entity_join_level`, after placing the replacement, get
its fresh handle with `level.block_entity(host, pos)` and call `replacement.set_lock(host, Some(lock))`
on that handle, not the original. A new entity does not inherit the old lock; set the lock explicitly
on the replacement if it should have one.
"""
