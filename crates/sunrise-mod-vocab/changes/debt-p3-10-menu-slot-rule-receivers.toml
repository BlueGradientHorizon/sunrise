ids = [
    "trait:ServerHost",
    "trait:prelude::MenusServerHost",
    "method:prelude::MenusServerHost::open_menu",
    "method:prelude::MenusServerHost::menu",
    "method:prelude::MenusServerHost::close_menu",
    "method:prelude::MenusServerHost::menu_set_items",
    "handle:PlayerRef::back_mod_menu_slots",
    "handle:PlayerRef::open_mod_menu",
    "handle:PlayerRef::open_chest_menu",
    "handle:MenuRef::set_items",
    "handle:MenuRef::back_slots",
    "type:OpenMenuError.Stack",
]
why = "Vanilla 26.3 (`ServerPlayer.openMenu`, `ServerPlayer.closeContainer`, `Player.containerMenu`, `AbstractContainerMenu`, `Slot.mayPlace`, `Slot.mayPickup`, `Slot.getMaxStackSize`) and NeoForge (`IPlayerExtension.openMenu`, `ResourceHandlerSlot`) operate on resolved player and menu instances rather than raw `(uuid, window)` pairs. Removing `MenusServerHost` and `PlayerRef::back_mod_menu_slots`, returning `MenuRef` from `PlayerRef::open_chest_menu` and `PlayerRef::open_mod_menu`, moving `set_items` and `back_slots` onto `MenuRef`, and lending live container slices directly to the same slot-rule path clicks use removes duplicate UUID/window lookups, eliminates four unwinding host methods, and removes temporary `Menu` snapshots from slot-rule asks."
migrate = '''
- `host.open_menu(uuid, rows, title, items, replace)` -> `player.open_chest_menu(host, rows, title, items, replace)` (returns `Result<MenuRef, OpenMenuError>`; active clicks return `Err(OpenMenuError::ClickInProgress)` and invalid stacks return `Err(OpenMenuError::Stack(_))`)
- `player.open_mod_menu(host, request)` now returns `Result<Option<MenuRef>, OpenMenuError>` (call `menu.container_id(host)` if the raw window id is needed)
- `host.menu(uuid, window)` -> `player.container_menu(host)` (check `menu.container_id(host)` if matching a window id)
- `host.close_menu(uuid)` -> `menu.close_container(host)`
- `host.menu_set_items(uuid, window, items)` -> `menu.set_items(host, items)`
- `player.back_mod_menu_slots(host, window, places)` -> `menu.back_slots(host, places)`
'''
