why = "A client window owns one screen built by its menu's registered factory. The factory sees the actual menu metadata and reads opening bytes once; it is not a server hook or a per-frame reader. The layout is checked before the window shows it."
migrate = "In Hooks::register, replace the construction-only MenuPart::screen with r.register_menu_screen(menu, Arc::new(|host: &dyn ClientHost, open: MenuScreenOpen<'_>| -> Option<MenuScreen> { /* build layout */ Some(MenuScreen::new(layout)) })). Remove screen from the MenuPart and keep screen_draw, screen_click and screen_tooltip there if used. Read event.menu and event.block as open.menu and open.block in the factory. Decode host.screen_extra_data() reads from open.extra there instead; no matching payload means an empty slice. Read open.pos there or keep using host.screen_pos() on the shown screen. Keep slot positions at their original backing indices, give every index not in open.excluded_slots finite geometry, and use positive finite width and height. The factory must belong to the content menu's owner; to customize a stock menu, register it for that stock id and it runs only for your package's verified opener. A menu_recipe_book binding also requires a factory from its declaring mod, which puts that book in layout.recipe_book. Existing live data updates and slot-control calls stay unchanged; only the factory's owner controls the window's slots."
