why = "NeoForge's GuiLayerManager.render runs RenderGuiEvent.Pre before the entire HUD sequence and RenderGuiEvent.Post after it, skipping both the layers and Post if Pre cancels. Vanilla Gui.extractRenderState and NeoForge's Hud.extractRenderState render the HUD before Options over a world, not on the title or level-loading screen, and F1 hides individual vanilla layers rather than either event. The duplicate end-of-frame gui_render_post and the shared corner allocator are removed. Mods can position overlays against the geometry actually emitted by the HUD, including visible effects from Hud.extractEffects, clipped to the GUI viewport and the draw scissors used for previews."
migrate = '''
1. Replace `Hooks::gui_render_post(&self, host, event: &mut GuiRenderPostEvent)` with `Hooks::render_gui_post(&self, host, event: &mut RenderGuiPostEvent)` and use `event.draw` instead of `event.batch`. The callback now runs after the in-world HUD, including under F1 and before Options over a world; it is not a title or post-screen callback, and canceled HUD passes do not reach it. Move paint that belongs above an open screen to `Hooks::screen_render_post` with `ScreenRenderPostEvent::draw` instead.
2. Replace `event.focused` with `host.window_focused()`. The removed `event.gui_hidden` exposed the raw hide-GUI flag; there is no raw F1 flag on the new event. To skip your paint when the effective HUD mode is hidden, use `if host.hud_mode() != HudMode::AllVisible { return; }`. `hud_mode()` includes settings a mod made through `set_hud_mode`, so it is not a record of whether F1 was pressed or whether a particular layer painted.
3. `render_gui_pre`, `register_gui_layers`, `gui_layer_pre` and `gui_layer_post` keep their signatures. Pre now runs under F1 and over in-world Options, and still runs when replay hides the ordinary HUD; `Flow::Cancel` skips every HUD layer, including sleep and subtitles, and skips HUD Post without canceling the open screen. Inserted layer painters and their layer hooks now run under F1. Apply the same `hud_mode()` check inside the painter if it should hide its paint. Replacements and wrappers still inherit the vanilla slot's draw conditions.
4. Delete `event.corners`, `Corners::new`, `corners.place`, and imports of `Corner`, `Corner::ALL`, or its variants. For a far edge, subtract the box size and your margin from the corresponding dimension of `event.draw.size()`; for a near edge, use your margin as the coordinate. Keep any per-corner stack offsets, names, labels or side checks in your own mod or library instead of using `Corner::name`, `label`, `top`, and `left`. For example, to stack your own boxes below the active-effect row, start their local y offset at:

   ```rust
   let bottom = match host.hud_layer_bounds("minecraft:effects") {
       Ok(Some([_, y, _, h])) => y + h,
       Ok(None) => 0.0,
       Err(_) => return,
   };
   let y = bottom + margin;
   ```

   `hud_layer_bounds` returns `Ok(None)` for layers that have not drawn visible geometry and outside the HUD pass (including screen callbacks). It returns `Err(LevelReadError::Unavailable)` outside a client window.
'''
