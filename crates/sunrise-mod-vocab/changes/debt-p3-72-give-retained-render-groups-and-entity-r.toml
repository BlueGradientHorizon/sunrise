ids = [
    "method:prelude::ClientRenderClientHost::instance_group_write",
    "method:prelude::ClientRenderClientHost::instance_group_set_len",
    "method:prelude::ClientRenderClientHost::instance_group_set_transform",
    "method:prelude::ClientRenderClientHost::instance_group_destroy",
    "method:prelude::EntitiesHost::entity_residency",
    "handle:EntityRef::residency",
]
why = "Retained render-group operations and entity residency now live only on their real handle receivers (`InstanceGroupRef` and `EntityRef`), removing duplicate and flat host methods from `ClientRenderClientHost` and `EntitiesHost`. Following vanilla 26.3's `SubmitNodeCollection` (explicit submission without per-view handle deduplication) and `Entity.isRemoved` (queried on the entity itself), retained instance groups also drop the thread-local caller-mod gate on handle access and submit every explicit `draw_instance_group` call while keeping handle generation, model/world retirement, and owner-disable cleanup."
migrate = "Call `group.write(host, first, instances)`, `group.set_len(host, len)`, `group.set_group_transform(host, transform)`, and `group.destroy(host)` instead of the removed `ClientRenderClientHost::instance_group_*` methods, and call `entity.residency(host)` instead of `host.entity_residency(entity)`. Do not rely on `WorldDrawContext::draw_instance_group` silently ignoring repeated submissions of the same group in one view; submit each group once per intended draw."
