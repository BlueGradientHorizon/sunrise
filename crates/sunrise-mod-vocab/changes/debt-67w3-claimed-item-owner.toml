ids = ["type:HeldItemSlot", "type:ModEvent", "method:prelude::ClientInputClientHost::claim_items", "method:prelude::ClientInputClientHost::poll", "method:ItemsRegistrar::register_client_item_use", "trait:ClientItemUseBehavior", "method:ClientItemUseBehavior::use_item", "method:ClientItemUseBehavior::release_using", "method:ClientItemUseBehavior::on_stop_using"]
why = "Client main-hand use now binds one behavior to each item at registration instead of scanning claims and queueing SNBT copies. The original owner receives typed stack state directly, and an input release is distinct from a reset. Normal client and server item use is unchanged."
migrate = "Replace host.claim_items(mod_id, ids) with one r.register_client_item_use(key, Arc::new(behavior)) per item in Hooks::register, obtaining key with r.item_key(id). Do not pass a mod ID; duplicate registrations refuse the load. Replace host.poll(mod_id) and ModEvent::UseStart matching with ClientItemUseBehavior::use_item(host, stack, slot). Replace ModEvent::UseStop matching with on_stop_using(host, stack, slot, ticks_held); put actions that require a valid input release in release_using(host, stack, slot, ticks_held), which runs before on_stop_using and not at all on reset. Replace HeldItemSlot.id and .count with stack.item() and stack.count(), and .slot with the slot argument. Replace its SNBT name/data strings with typed reads from stack.get(&descriptor) or stack.components().and_then(|p| p.as_nbt().get(&mod_api::JavaString::from(id))) using minecraft:custom_name or minecraft:custom_data as the component ID."
