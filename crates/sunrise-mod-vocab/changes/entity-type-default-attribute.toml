ids = ["method:prelude::LivingHost::entity_type_default_attribute", "type:EntityTypeReadError"]
why = "A mod reads an entity type's default attribute values (max health, armor, attack damage...) without spawning one: DefaultAttributes.getSupplier(type).getBaseValue(attribute), for vanilla's and mods' types, on both sides. Hostile Neural Networks shows each data model's mob stats from it."
migrate = "New: call host.entity_type_default_attribute(\"minecraft:zombie\", \"minecraft:max_health\") from a world-phase hook; Ok(None) is a type or attribute without a default. A hand-kept table of vanilla mob stats can go."
