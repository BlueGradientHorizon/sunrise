ids = ["method:prelude::ItemsHost::entity_type_default_attribute", "type:EntityTypeReadError"]
why = "A mod reads an entity type's default attribute values (max health, armor, attack damage...) without spawning one: DefaultAttributes.getSupplier(type).getBaseValue(attribute), for vanilla's and mods' registered types, on both sides. It is metadata beside entity_type_in_tag: readable in setup, a reload and a world once the attribute catalog is built, on every host. Hostile Neural Networks shows each data model's mob stats from it."
migrate = "New: call host.entity_type_default_attribute(\"minecraft:zombie\", \"minecraft:max_health\"); Ok(None) is a type or attribute without a default, Err(Unavailable) a read before the catalog is built. A hand-kept table of vanilla mob stats can go."
