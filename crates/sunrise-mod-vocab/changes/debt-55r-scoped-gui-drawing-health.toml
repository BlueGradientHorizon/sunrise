why = "health_hud (hook version 1 -> 2) now returns an owned HealthHudReplacement renderer callback instead of a buffered Vec<GuiDraw> command list. Follows vanilla net.minecraft.client.gui.Hud.extractPlayerHealth and NeoForge GuiLayerManager.renderInner / RegisterGuiLayersEvent.replaceLayer: selection and rendering run inside the minecraft:player_health layer between gui_layer_pre and gui_layer_post, so cancelling minecraft:player_health skips both health_hud and vanilla rows. Returning Ok(()) without drawing leaves the layer blank; returning an Err reports the error without rolling back prior draws, without falling back to vanilla rows, and without latching. A panic in the callback is caught, disables only that mod's health_hud hook for the session, and shows a system error toast naming the mod."
migrate = '''
Change `Hooks::health_hud` to return `Option<HealthHudReplacement>` instead of `Option<Vec<GuiDraw>>`. Construct a renderer with `HealthHudReplacement::new(|host, inputs, canvas| { ... })` (cloning a cached handle each frame if desired) and draw directly through `&mut dyn GuiCanvas` (using `canvas.scope`, `blit_sprite`, `fill`, `text`, etc.).

Do not rely on returning `Err(...)` to roll back earlier draws or fall back to vanilla health rows: `Err` is logged and leaves prior draws in the batch. Return `None` from `Hooks::health_hud` if you want to defer to later listeners or vanilla.
'''
