why = "health_hud (hook version 1 -> 2) now returns an owned HealthHudReplacement renderer callback instead of a buffered Vec<GuiDraw> command list. Follows vanilla net.minecraft.client.gui.Hud.extractPlayerHealth and NeoForge VanillaGuiLayers / GuiLayerManager.renderInner / RegisterGuiLayersEvent.replaceLayer: player_health, armor_level, food_level, vehicle_health and air_level are separate HUD layers stacked by left/right row height, and health_hud selection and rendering run inside minecraft:player_health between gui_layer_pre and gui_layer_post so cancelling or replacing minecraft:player_health affects only player hearts while armor, food, vehicle health and air stay on their own layers. Returning Ok(()) without drawing leaves the layer blank; returning an Err reports the error without rolling back prior draws, without falling back to vanilla hearts, and without latching. Panics in health_hud (selector or renderer), item_bar and item_decorations are contained at each hook boundary, disable only the offending mod's hook for the session, and show a system error toast naming the offending mod and hook."
migrate = '''
Change `Hooks::health_hud` to return `Option<HealthHudReplacement>` instead of `Option<Vec<GuiDraw>>`. Construct a renderer with `HealthHudReplacement::new(|host, inputs, canvas| { ... })` (cloning a cached handle each frame if desired) and draw directly through `&mut dyn GuiCanvas` (using `canvas.scope`, `blit_sprite`, `fill`, `text`, etc.).

Do not rely on returning `Err(...)` to roll back earlier draws or fall back to vanilla health rows: `Err` is logged and leaves prior draws in the batch. Return `None` from `Hooks::health_hud` if you want to defer to later listeners or vanilla.
'''
