why = "Each special item model now decodes typed fields and bakes its own renderer against the chosen resource packs at load time. Drawing reuses that instance, without passing raw NBT. A failed decode or bake refuses only the enclosing item file. A failed nested draw rolls back the outermost special layer but leaves unrelated item layers intact."
migrate = "Replace register(id, policy, Arc::new(renderer)) with register(id, policy, SpecialModelFactory::new(|config| config.decode::<MyConfig>(), |config, bake| Ok(MyRenderer { config }))). Derive serde::Deserialize on MyConfig and declare the inline model fields without type; for no fields, use |_| Ok(()) and |(), _| Ok(MyRenderer). Remove the config: &Tag argument from extract and read the stored fields from self. The registry's into_renderers still returns the registrations and replacement reports, but each map value is (policy, factory), not (policy, renderer). Optional bake_model(model_id) or bake_geometry(&quads) returns a process-local geometry lease you can keep on the baked renderer. The Stack and Frame policies and extract's model/stack recipes are unchanged in this step. If an inner special stack refuses, do not rely on it drawing a missing model alongside other parts of the answer: the enclosing special layer draws one missing model instead."
