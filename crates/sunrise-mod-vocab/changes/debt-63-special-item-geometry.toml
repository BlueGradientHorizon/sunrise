why = "Special item nodes decode typed config and bake once against the selected packs. Each draw now extracts a typed argument from a borrowed stack and submits directly, instead of returning a Wire recipe or retaining a cached answer. A failed draw rolls back the whole special layer without disturbing sibling item layers."
migrate = "Replace register(id, policy, factory) with register(id, factory); if you passed a renderer directly, build it in SpecialModelFactory::new(|config| config.decode::<MyConfig>(), |config, bake| Ok(MyRenderer { ... })). Use |_| Ok(()) for a model with no config fields. into_renderers now returns a map from id to factory, not to (policy, factory). Declare type Argument, move stack and host reads out of extract into extract_argument(host, &SpecialModelStack), then move drawing to submit(&argument, context, collector). Read effective components with stack.get(&descriptor), not an owned component patch. Replace SpecialModelPart::new(id) with a lease from bake.bake_model(id) stored on the renderer and collector.submit_geometry(&lease, tints); custom quads use bake.bake_geometry(&quads). Instead of setting part.content to a Stack or calling SpecialModelPart::stack, call collector.submit_stack(&stack, display). Use collector.with_pose(row_major_affine, |pose| ...) instead of setting part.transform or using with_transform or translated; submit untransformed geometry on the outer collector, without SpecialModelPart::IDENTITY. Replace part.tints or with_tints with SpecialModelTints::Untinted, Uniform(argb) or Indexed(Arc<[u32]>). Remove MAX_SPECIAL_MODEL_PARTS checks and references to SpecialModelContext::STACK: submit gets the real context on every draw, regardless of the former policy. SpecialModelContext, geometry and submission are local Rust values; do not Wire-encode them. Rebuild native mods."
