ids = ["hook:player_destroy_item"]
why = "player_destroy_item version 2 reports the complete original stack (count, damage and components as they were before the use or the wear) and the hand it was in, or none for worn armour and inventory ammunition, and fires on both logical sides for the acting player. Version 1 was server only and named an equipment slot (mainhand through saddle). The notice also covers an item used up by use, consumed on an entity, finished eating or drinking, and ammunition taken from the inventory, besides a durability break, and is sent before a remainder such as an empty bottle replaces the used-up stack."
migrate = "Rebuild native and wasm listeners against this SDK. The slot is replaced by the hand: read the hand instead of matching the equipment slot name, treat no hand as worn equipment or inventory ammunition, and read the original stack from the payload."
