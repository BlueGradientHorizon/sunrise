why = "Removes the duplicate menu_closed hook that advertised NeoForge's PlayerContainerEvent.Close alongside player_container_close. Following NeoForge's ServerPlayer.doCloseContainer patch and vanilla's AbstractContainerMenu.removed, player_container_close v2 is now the single general PlayerContainerEvent.Close event, firing after removed and before containerMenu resets to inventoryMenu with real player: PlayerRef and menu: Option<MenuRef> views instead of raw uuid/name/dimension strings. Menu-owned teardown (detached owned_slots and captured opening_hand) moves onto MenuPart::menu_removed (vanilla AbstractContainerMenu.removed), routed to the owning menu part and preserving teardown with player: Option<PlayerRef> and uuid even when the player is already gone."
migrate = "Move owned_slots and opening_hand teardown from Hooks::menu_closed to MenuPart::menu_removed on the menu type's owning MenuPart, handling event.player == None if the player is already gone. Update Hooks::player_container_close listeners to read event.player (PlayerRef, using player.uuid(), player.name(host), or player.dimension(host)) and event.menu (Option<MenuRef>, live until the hook returns)."
