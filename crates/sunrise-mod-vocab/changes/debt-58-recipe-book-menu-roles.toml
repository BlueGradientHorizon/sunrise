why = "A content menu owns its book and recipe slot roles; screen geometry belongs to the client opening. Content load checks roles against the actual menu and every permanent exclusion mask. Client open checks the layout against the book and backing slots."
migrate = "Change r.menu_recipe_book(menu, &book, recipe_type, roles, screen) to r.menu_recipe_book(menu, &book, recipe_type, roles). Attach a MenuPart for that menu and return the former geometry from MenuPart::screen, with recipe_book: Some(book.clone()). Replace any registered_screen lookup with your own layout construction in that callback. Replace roles.validate_screen(&screen) with roles.validate_exclusions(excluded) for each permanent backing-slot mask; Sunrise validates geometry at client open. Keep every mapped role at its original visible index in every mask. Keep your toggle anchor and big-result setting in the screen layout; local set_screen_slot calls are unchanged once the screen is open."
