why = "Block metadata now takes and returns the copyable BlockState directly. Property reads still borrow from immutable metadata, and property edits return a state without writing to the world."
migrate = """
Replace `BlockStateRecord` with `BlockState`. Read `record.block` and `record.state` as
`state.block()` and `state.ordinal()`. Pass `state` directly in place of either
`BlockState::from(record)` or `BlockStateRecord::from(&state)`.
Replace `BlockStateRecord::new(key, ordinal)` with a state from the registry:
`BlockState::of(&metadata, key, constraints)` for named properties, or
`metadata.states_of(key).and_then(|range| range.iter().nth(usize::from(ordinal)))`
for a local ordinal, where `metadata` is `host.block_states()`.
`BlockMetadata::property` and `BlockMetadata::with` take a `BlockState`; `with` and `of`
return `Result<BlockState, BlockStateError>`. For low-level host test doubles, use those
same types in `block_metadata_property`, `block_metadata_with` and `block_metadata_of`,
and take `BlockState` in the five weathering and wax backend methods.
Calls to `state.property`, `state.with`, `BlockState::of`, and the weathering and wax
queries on `host.block_states()` already use `BlockState` and need no edits.
"""
