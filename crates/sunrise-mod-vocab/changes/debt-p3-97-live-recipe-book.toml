why = "Follows vanilla 26.3 ServerGamePacketListenerImpl.handlePlaceRecipe and handleRecipeBookChangeSettingsPacket, ServerPlaceRecipe.placeRecipe (tryPlaceRecipe, clearGrid, testClearGrid), RecipeBookMenu.handlePlacement, RecipeBookComponent.tryPlaceRecipe/fillGhostRecipe/sendUpdateSettings/init, ClientPacketListener.handlePlaceRecipe, GhostSlots.setSlot, RecipeBookSettings.TypeSettings.codec, CompoundTag.TYPE.loadCompound, Identifier.STREAM_CODEC and Varint21LengthFieldPrepender, plus NeoForge RecipeBookManager.init and CommonHooks.MODDED_RECIPE_BOOK_TYPES_SETTINGS_STREAM_CODEC/makeModdedRecipeBookTypesSettingsCodec. Recipe-book, filter-sprite and menu-binding identifiers share Identifier::parse_namespaced with explicit nonempty namespace:path. Registration, persistence, settings sync, ghosts and linked menu containers rely on physical slot membership and ordinary NBT/network framing limits rather than helper quotas (removing the 1,024-book, 256-byte, 256-ghost and 64-menu-link caps, BookError::Full and per-second budgets). Connection admission uses the placed connection's negotiated capability and schema rather than client brand, with no retry timers, Busy/Resnapshot recovery or click-acknowledgement Frame::Reply; ordinary placement uses live active Menu and backing storage with normal slot sync, and ghosts come directly from the server for the clicked alternative. For RecipeBookLayout::Mod menus, replacing RecipesServerHost::place_recipe_in_grid and the detached snapshot/one-use session with RecipeBookPlacement on recipe_book_place (hook version 2) removes the hidden single-use host callback. Each MenuPart::recipe_book_place callback runs through the shared native callback panic boundary with a nested transaction and candidate placement so panics roll back, discard the candidate answer, name the mod in logs and error toasts, and disable only that callback for the session. recipe_book_ghost and menu_links bump to hook version 2 for their uncapped, GhostSlots.setSlot-matched and uncapped-link observable outputs."
migrate = "Remove any import of RecipesServerHost and calls to host.place_recipe_in_grid(...). In MenuPart::recipe_book_place (hook version 2, RecipeBookLayout::Mod), replace `event.ghost = host.place_recipe_in_grid(event.recipe, width, height, slots, clear, event.use_max_items)?` with `*event.placement = RecipeBookPlacement::Grid { width, height, slots, clear }` (the clicked recipe, Shift `use_max_items` and `creative` flags come from the click; `slots` and `clear` are physical container slot indices placed on the active live menu, sending a server-origin ghost only when ingredients are missing), replace manual `event.ghost = true` with `*event.placement = RecipeBookPlacement::Ghost`, and leave `*event.placement = RecipeBookPlacement::Nothing` when handling placement manually through Host without requesting a ghost or doing nothing. For RecipeBooksRegistrar::recipe_book_type, recipe_book_type_with_fields, recipe_book_filter_look and MenusRegistrar::menu_recipe_book, pass explicit nonempty `namespace:path` identifiers accepted by Identifier::parse_namespaced (slash-separated paths such as `your_mod:kitchen/pot` are valid; `..:pot`, `:cooking`, `your_mod:` and whitespace trimming are rejected), and remove workaround truncation or count checks for >1,024 books or >256-byte IDs, flat field names, sprites and tooltips (NBT modified UTF-8, Identifier.STREAM_CODEC 32,767-byte wire width and packet framing still apply; existing saves keep their layout). Keep PlayerRef::set_recipe_book_settings(host, &book, settings); false now means only that the player or key is unavailable. In MenuPart::recipe_book_ghost (hook version 2), expect no 256-ghost cap: one ghost per actual shown physical slot is drawn in slot order, the last nonempty resolved display for a repeated slot wins in place, an unresolved empty display does not erase an earlier ghost, and missing/hidden slots are omitted. In Hooks::menu_links (hook version 2), all distinct valid live lendable containers beyond 64 are now resolved in first-seen order while skipping the opening container `pos`, duplicates and non-lendable blocks. Upgrade both client and server together for private book protocol version 2 (no shim, alias or old schema acceptance); admission no longer checks client brand and no longer retries on timers or Busy/Resnapshot/Frame::Reply. If your manifest pins recipe_book_place, recipe_book_ghost or menu_links, request hook_version = 2."
