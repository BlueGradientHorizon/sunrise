why = "GUI drawing and clipping now append directly into the HUD batch inside lexical RAII pose and scissor scopes instead of buffering Wire command lists or pairing manual push_clip/pop_clip calls. Follows vanilla net.minecraft.client.gui.GuiGraphicsExtractor (pose, enableScissor/disableScissor, fill, fillGradient, text, blit, blitSprite, item, itemDecorations): each primitive validates its inputs and its actual posed geometry before publishing vertices or blend ranges, refuses invalid calls with GuiDrawError without rolling back prior draws (no transactional rollback or GuiDrawError::Abort), and always restores pose and scissor on return, error, or unwind. DrawContext::with_scissor has no artificial 64-level nesting limit, so GuiClipRefusal::TooDeep and GuiClipRefusal::NoneOpen are removed. Full and partial sprites follow vanilla blitSprite and TiledBlitRenderState using the same pack metadata as the built-in HUD. PoseOp and Blend stay in-process and no longer derive Wire."
migrate = '''
Replace `draw.gui_paint(&[...])` with `draw.draw_gui(&mut |canvas| { ... })` using `GuiCanvas` methods directly:
- `GuiDraw::Push(ops)` ... `GuiDraw::Pop` -> `canvas.scope(&ops, None, &mut |scoped| { ... })?` (pass `Some([x, y, w, h])` for a posed scissor).
- `GuiDraw::Fill { x0, y0, x1, y1, color }` -> `canvas.fill([x0 as f32, y0 as f32, (x1 - x0) as f32, (y1 - y0) as f32], color)?`.
- `GuiDraw::FillGradient { x0, y0, x1, y1, top, bottom }` -> `canvas.fill_gradient([x0 as f32, y0 as f32, (x1 - x0) as f32, (y1 - y0) as f32], top, bottom)?`.
- `GuiDraw::Text { text, x, y, color, shadow }` -> `canvas.text(&text, [x as f32, y as f32], color, shadow)?`.
- `GuiDraw::Item { slot, x, y, seed, scale, pivot }` -> read the stack yourself, draw `canvas.scope(&[PoseOp::Translate(pivot[0], pivot[1]), PoseOp::Scale(scale[0], scale[1]), PoseOp::Translate(-pivot[0], -pivot[1])], None, &mut |s| s.item(&stack, [x as f32, y as f32], seed))?`, then draw `canvas.item_decorations(&stack, [x as f32, y as f32], None)?` outside the squeeze scope so decorations follow the surrounding pose.
- `GuiDraw::Sprite { sprite, x, y, w, h, region, color, blend }` -> `canvas.blit_sprite(&sprite, [x as f32, y as f32, w as f32, h as f32], region.map(|[sw, sh, u, v]| GuiSpriteRegion { size: [sw, sh], offset: [u, v] }), color, blend)?`.
- `GuiDraw::AtlasSprite { sprite, x, y, w, h, color }` -> `canvas.atlas_sprite(&sprite, [x as f32, y as f32, w as f32, h as f32], color)?`.
- `GuiDraw::Blit { texture, blend, x, y, w, h, uv, src, tex, color }` -> `canvas.blit(&texture, [x as f32, y as f32, w as f32, h as f32], GuiBlitRegion { uv, src, tex }, color, blend)?`.

Match each call's `GuiDrawError`, not an error for the whole replay buffer:
- `Text(e)` -> `GuiDrawError::Text(e)`.
- `ItemSlot { slot, .. }` -> no slot argument; resolve the hotbar/offhand stack first, handle an empty slot yourself and pass the stack to `item` (which can return `Stack(e)` for an invalid stack).
- `ItemNotFinite { .. }` -> `NotFinite` from `scope` or the draw call, including for oversized item geometry or pack-modified sprite geometry. Earlier successful calls are unaffected.
- `BlitTexture { .. }` -> `UnknownTexture`; `BlitSize { .. }` -> `BadBlitRegion` for non-positive whole texture size or `NotFinite` for invalid UVs.
- `Sprite { .. }` -> `UnknownSprite`; `SpriteRegion { .. }` -> `BadSpriteRegion`; `SpriteBlend { .. }` -> `UnsupportedSpriteBlend`.
- Delete buffer `index` lookups. If you need a diagnostic, attach the draw's operation name or resource ID to its `Result` at the call site. Past draws remain visible and pose/scissor are restored on return, `Err`, or unwind.
- Remove `GuiDraw`, `GuiPaintError`, `PoseOp` and `Blend` from Wire payload structs and calls to their encode/decode methods. For data that must cross a boundary, define your own Wire-derived enum of blend choices or pose operations with numeric coordinates, and convert to `Blend`/`PoseOp` when calling the local canvas. Direct draw callbacks and engine draw errors are not payload types.

Replace `draw.push_clip(rect)?; ...; draw.pop_clip()?;` with `draw.with_scissor(rect, &mut |clipped| { ... })?;`. Remove match arms for `GuiClipRefusal::NoneOpen` and `GuiClipRefusal::TooDeep`; only `GuiClipRefusal::NotFinite` remains and scissor nesting is unbounded.
'''
