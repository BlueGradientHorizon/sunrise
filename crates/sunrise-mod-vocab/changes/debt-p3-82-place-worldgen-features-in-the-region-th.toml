why = """
`Feature.place`, `StructureStart.placeInChunk`, and `PiecesContainer.load` call generation and
piece-loading code in-process. NeoForge uses the worldgen registries for type dispatch, including
`DeferredRegister` for features and the `STRUCTURE_TYPE` and `STRUCTURE_PIECE` registries for
structures and pieces. The callback errors now keep their original typed causes instead of encoding
strings. Feature config codecs, structure save codecs, and `Structure.findValidGenerationPoint`
are unchanged.

The FEATURES writer now uses `WorldGenRegion.ensureCanWrite` for both checks and writes.
`ChunkPyramid.GENERATION_PYRAMID` gives FEATURES a write radius of one chunk; the center's
`ProtoChunk.getHeightAccessorForGeneration` supplies the vertical restriction during upgrades.
Each far-chunk refusal logs the position and stage. `WorldGenRegion.setBlock` keeps its result even
for admitted no-ops in proto or imposter storage; live writes keep `Level.setBlock`'s result.

`Feature.place` uses its caller's level and random directly, and `WorldGenRegion.getHeight`
reads current chunk heightmaps. Registered callbacks now do the same: we no longer stage writes,
count custom work, or disable the type when a write is refused or a callback returns an error.
Block-entity loading follows `WorldGenRegion.getBlockEntity` and `BlockEntity.loadWithComponents`:
data must fit the current block, which need not have been written by this callback, and
`ImposterProtoChunk(chunk, false)` stays read-only. Each returned error is logged with its source
chain and the actual registering mod. A panic disables only that registration and queues the
mod's error toast, without undoing placement work.

Structure start generation, saved-piece loading, piece metadata (`bounding_box`, `beardifier`)
and `add_additional_save_data` follow `Structure.generate`, `Structure.findValidGenerationPoint`,
`StructurePiece`, `StructurePieceType`, `PiecesContainer.load` and NeoForge `RegisterEvent.register`.
Each operation holds its own retained callback owner bound to the registering mod so a panic
disables only that operation for that registration, leaving other operations and structure types
active. Returned `load_piece` errors report the registering mod, type and full native source chain
each time and omit only that piece without latching. Piece bounding boxes are captured once at
generation or load like `StructurePiece`, and failed saves yield no partial tag.
"""
migrate = """
Replace `FeatureError(message)` with `FeatureError::new(std::io::Error::other(message))` and
`StructureError(message)` with `StructureError::new(std::io::Error::other(message))`. If you
already have a typed error, use `.map_err(FeatureError::new)?` or
`.map_err(StructureError::new)?` instead of formatting it. `BlockStateError` now implements
`std::error::Error` and can be passed directly. Its variants and encoding are unchanged.

Replace `FeatureError::from((id, reason))` with
`FeatureError::new(std::io::Error::other(format!("{id}: {reason}")))`, or pass your own typed
cause that carries the ID. Make the same replacement with `StructureError::new` for structures.
Replace `.0` or tuple destructuring with `error.to_string()` for diagnostics or
`std::error::Error::source(&error)` to inspect or downcast the cause. Return the native error
from the callback; neither wrapper supports `Wire` encoding or decoding anymore.

Keep calling `context.set_block(pos, state, flags)` but handle its immediate world result;
`false` is not a fault and doesn't cancel prior writes. Use `context.ensure_can_write(pos)` to
preflight the region policy; it doesn't guarantee a state change. During FEATURES, keep writes
within one chunk of the center in X and Z. For a below-zero upgrade, write only at Y=-64 through
-1 throughout that region, as set by `BelowZeroRetrogen.UPGRADE_HEIGHT_ACCESSOR`; the target
chunk's own upgrade state does not determine which writes are allowed.

`context.block(pos)`, `context.block_in_tag(pos, tag)` and `context.height(kind, x, z)` read
the current level after completed writes and their effects. Read before modifying the level
if you need the previous value. `context.block_entity(pos, nbt)` validates and applies data to
the current block, so remove a preliminary `set_block` done only to mark it as this call's own.
Callers of `FeatureType::place` need no signature change. When implementing it, don't rely on
returning `Err` to undo writes or draws or skip later placements: finish any checks you need
before writing. An `Err` still fails this invocation and reports the original cause.
"""
