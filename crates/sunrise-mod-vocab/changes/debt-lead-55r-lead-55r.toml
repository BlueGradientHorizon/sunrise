why = "Vanilla Hud.extractChat draws background chat and ChatScreen.extractRenderState paints focused chat separately. NeoForge GuiLayerManager.render/renderInner visits the HUD slot once before HUD Post and skips it when HUD Pre cancels; its Hud.extractChat patch posts CustomizeGuiOverlayEvent.Chat only for background chat. RegisterGuiLayersEvent.replaceLayer/wrapLayer keeps the installed body at that slot, and Hud.extractHealthLevel reserves height only when the original hearts body runs. Sunrise isolates a panicking HUD callback, removes its own partial drawing without replaying completed previous bodies, and names the owner in the log and error toast. The diagnostic uses ToastManager/SystemToast presentation but bypasses NeoForge's ordinary ToastAddEvent and F1 visibility to avoid hiding the failure. Tiled GUI sprites keep the original tile origin from GuiGraphicsExtractor.blitTiledSprite and TiledBlitRenderState.buildVertices; bounded repeats choose the atlas texel after exact wrapping at the active render target's pixel centers."
migrate = '''
Keep `GuiLayerRegistrar::{register, replace_layer, wrap_layer}` and `GuiLayerDraw`/`GuiLayerWrapper` signatures. A panicking installed callback is skipped for the rest of the session, with no fallback body; other callbacks are still called. A wrapper's completed `ctx.draw_previous()` calls now keep their drawing and effects if that wrapper panics afterwards. Return normally on a recoverable failure and report it from your callback instead of panicking. Phase refusals are reported each time and don't disable the callback. HUD layer Post still runs unless layer Pre canceled the slot.

Keep `gui_layer_pre`/`gui_layer_post` ID matches for the background HUD slot `minecraft:chat`. If you previously used its second invocation to draw over focused chat, move that drawing to `gui_render_post` for the chat screen. Canceling `render_gui_pre` skips the whole HUD layer walk, not the focused chat screen. In `customize_chat_overlay`, delete reads and matches of `event.focused`: the event now describes only the original background chat. It cannot move focused chat; use a chat screen render hook for your own focused-screen drawing.

Keep the `health_hud` and `HealthHudReplacement` signatures. Returning `Err` still logs and keeps completed draws; a panic now discards only the failing renderer's draws and disables that mod's `health_hud` for the session. Neither case runs fallback hearts that frame. Keep the `toast_add` signature; no filter can cancel or rename a callback-panic diagnostic now. Other notifications still use `toast_add` as before.

If your manifest pins these hooks, change `gui_layer_pre` from 2 to 3, `gui_layer_post` from 3 to 4, `register_gui_layers` from 3 to 4, `health_hud` from 3 to 4, and `customize_chat_overlay` and `toast_add` from 1 to 2. No call change is needed for `GuiCanvas::blit_sprite`; a device sample just before a tile seam stays in the ending tile, even in a scaled capture.
'''
