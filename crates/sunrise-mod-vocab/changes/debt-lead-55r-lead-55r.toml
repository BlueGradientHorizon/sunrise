ids = ["hook:gui_layer_pre", "hook:gui_layer_post", "hook:register_gui_layers"]
why = "Vanilla Hud.extractChat draws the background chat and ChatScreen.extractRenderState paints focused chat separately. NeoForge GuiLayerManager.render/renderInner visits the HUD slot once before HUD Post and skips it when HUD Pre is canceled. Sunrise now follows that separation. RegisterGuiLayersEvent.replaceLayer/wrapLayer keeps the installed body at that slot; Sunrise contains an installed callback's panic there so it cannot unwind the rest of the HUD, discards the failed invocation's drawing, and identifies the owner in the log and error toast. Tiled GUI sprites keep the original tile origin from GuiGraphicsExtractor.blitTiledSprite and TiledBlitRenderState.buildVertices; bounded repeats now reduce phase before division loses it and sample using the active render target's scale."
migrate = '''
Keep `GuiLayerRegistrar::{register, replace_layer, wrap_layer}` and `GuiLayerDraw`/`GuiLayerWrapper` signatures. A panicking installed callback is skipped for the rest of the session, with no fallback body; other callbacks are still called. Return normally on a recoverable failure and report it from your callback instead of panicking. HUD layer Post still runs unless layer Pre canceled the slot.

Keep `gui_layer_pre`/`gui_layer_post` ID matches for the background HUD slot `minecraft:chat`. If you previously used its second invocation to draw over focused chat, move that drawing to `gui_render_post` for the chat screen. Canceling `render_gui_pre` skips the whole HUD layer walk, not the focused chat screen. If your manifest pins these hooks, change `gui_layer_pre` from 2 to 3, `gui_layer_post` from 3 to 4, and `register_gui_layers` from 3 to 4. No call change is needed for `GuiCanvas::blit_sprite`.
'''
