why = """
Three related client-surface cleanups aligning with vanilla 26.3 and NeoForge:

1. Local client drawing, render-pipeline, input, audio, screen, options, recipe-panel, and pose/model/animation values live only in-process, following vanilla 26.3 (`Camera`, `Options`, `SoundInstance`, `SoundSource`, `HitResult`, `LerpingBossEvent`, `RenderPipeline`, `ModelPart`, `LayerDefinition`, `AnimationState`, `KeyMapping`) and NeoForge (`SubmitCustomGeometryEvent`, `RenderLevelStageEvent`, `RegisterRenderPipelinesEvent`, `EntityRenderersEvent.RegisterLayerDefinitions`, `RegisterJsonAnimationTypesEvent`, `RegisterKeyMappingsEvent`, `InputEvent`, `ToastAddEvent`, `PlaySoundEvent`, `ScreenEvent`, `CustomizeGuiOverlayEvent`, `ViewportEvent`), which never define binary transport codecs for them. Their `Wire` implementations and private transport mirrors (`AnimationHolderWire` and its siblings) are removed while keeping JSON helpers, asset loading, saved modifier bits, timing, pose edits, mesh checks, live `FrameModel` storage, and `Wire` on cross-boundary types (`MenuRef`, `NoteInstrument`, `ParticleStatus`, `BossBarRef`, `BossBarColor`, `BossBarOverlay`).
2. Remove the dead 1024x1024 / atlas-pool `PipelineTextureError::{OverCap, NoSlot}` variants, `PipelineDrawError::{CapacityExceeded, NonFinite}`, the arbitrary 4,096 shared `WorldGeometry` quad cap, `WorldDrawUsage::quad_capacity`, and whole-batch rollback on `WorldDrawContext::pipeline_quads`, letting CPU `Vec`s grow into the already dynamically resized GPU buffers (`ModPipelines::prepare`, `WorldPrimitives::reserve_indices`) to match vanilla 26.3 (`SubmitNodeCollection` / `LevelRenderer`) and NeoForge (`SubmitCustomGeometryEvent` / `RenderLevelStageEvent`).
3. Align `register_render_pipelines` and `register_layer_definitions` (both bumped to hook version 3) with NeoForge: `RenderPipelines.java.patch` stores required and optional pipelines in separate `PIPELINES_BY_LOCATION` and `OPTIONAL_PIPELINES_BY_LOCATION` maps without namespace-ownership gating, and `ClientHooks.registerLayerDefinition` / `ClientHooks.loadLayerDefinitions` with `LayerDefinitions.java.patch` store mod suppliers in a last-writer-wins map before startup freeze, refusing only collisions with existing vanilla layer definitions (`ImmutableMap.Builder.build()`).
"""
migrate = """
1. Remove these local client drawing, render-pipeline, input, audio, screen, options, recipe-panel, key-mapping, model, and animation types from `#[derive(Wire)]` structs and `Writer::put` / `Reader::decode` calls. Keep all in-process client usage unchanged (including JSON loading and `serde_json` / `String::from` / `TryFrom<String>` conversions on `MeshDefinition` and `ModelPart`). When synchronizing data over a typed payload, copy only the owned primitive or cross-boundary fields you intend to send (such as an `Identifier`, `u32` modifier bits, coordinates, tick counts, rotation angles, or `ItemStack`) into your own `#[derive(mod_api::Wire)]` struct and convert at the boundary.
2. Drop match arms on the removed `PipelineTextureError::{OverCap, NoSlot}` and `PipelineDrawError::{CapacityExceeded, NonFinite}` variants (keeping `_` for `#[non_exhaustive]`). `WorldDrawContext::pipeline_quads` now fails only with `PipelineDrawError::Pipeline(RenderPipelineError)` on invalid or stale handles, skips individual quads with non-finite coordinates or UVs, and grows quad storage dynamically. Stop reading `WorldDrawUsage::quad_capacity` and drop its argument from `WorldDrawUsage::new(lines, line_capacity, quads, instances_used, instances_capacity)`. `WorldDrawContext::quads` and `name_tag` no longer return `DrawError::CapacityExceeded` (only `lines` keeps `line_capacity`).
3. Update listeners/manifests pinning `register_render_pipelines` or `register_layer_definitions` to hook version 3: `register_render_pipelines` now accepts any valid `Identifier` and checks required vs optional duplicate IDs separately (resolving an ID shared by both selects the required pipeline), and `register_layer_definitions` now accepts any valid `<namespace>:<path>#<layer>` not colliding with an existing vanilla layer definition with last-writer-wins overwrite for duplicate mod registrations.
"""
