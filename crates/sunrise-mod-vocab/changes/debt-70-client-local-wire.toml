why = "Local client drawing, render-pipeline, input, sound, screen, options and recipe-panel values live only in-process, following vanilla 26.3 (`Camera`, `Options`, `SoundInstance`, `SoundSource`, `HitResult`, `LerpingBossEvent`, `RenderPipeline`) and NeoForge (`SubmitCustomGeometryEvent`, `RenderLevelStageEvent`, `RegisterRenderPipelinesEvent`, `InputEvent`, `ToastAddEvent`, `PlaySoundEvent`, `ScreenEvent`, `CustomizeGuiOverlayEvent`, `ViewportEvent`), which never define binary transport codecs for them. Native client mods use these values directly in-process, so their `Wire` implementations are removed while keeping `Wire` on cross-boundary types (`MenuRef`, `NoteInstrument`, `ParticleStatus`, `BossBarRef`, `BossBarColor`, `BossBarOverlay`)."
migrate = """
Remove these local client drawing, render-pipeline, input, audio, screen, options and recipe-panel types from `#[derive(Wire)]` structs and `Writer::put` / `Reader::decode` calls.

- Keep all local in-process client usage unchanged: `WorldDrawContext`, `RenderAssets::render_pipeline`, `ClientModifiers::bits` and modifier helpers, `ClientHost::play_local_sound` / `SoundRef`, `SoundEffects::valid`, screen hooks, options snapshots and `RecipesClientHost::panel_recipes`.
- If a network payload needs to synchronize a sound id, modifier bits, camera coordinates, screen action or recipe selection, define your own `#[derive(mod_api::Wire)]` record carrying only the primitive or cross-boundary fields (such as an `Identifier`, `u32` modifier bits, coordinates, or `ItemStack`) and convert at the boundary.
"""
