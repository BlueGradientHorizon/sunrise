why = """
Client-surface cleanups aligning with vanilla 26.3 and NeoForge:

1. Local client drawing, render-pipeline, input, audio, screen, options, recipe-panel, and pose/model/animation values live only in-process, following vanilla 26.3 (`Camera`, `Options`, `SoundInstance`, `SoundSource`, `HitResult`, `LerpingBossEvent`, `RenderPipeline`, `ModelPart`, `LayerDefinition`, `AnimationState`, `KeyMapping`) and NeoForge (`SubmitCustomGeometryEvent`, `RenderLevelStageEvent`, `RegisterRenderPipelinesEvent`, `EntityRenderersEvent.RegisterLayerDefinitions`, `RegisterJsonAnimationTypesEvent`, `RegisterKeyMappingsEvent`, `InputEvent`, `ToastAddEvent`, `PlaySoundEvent`, `ScreenEvent`, `CustomizeGuiOverlayEvent`, `ViewportEvent`), which never define binary transport codecs for them. Their `Wire` implementations and private transport mirrors (`AnimationHolderWire` and its siblings) are removed while keeping JSON helpers, asset loading, saved modifier bits, timing, pose edits, mesh checks, live `FrameModel` storage, and `Wire` on cross-boundary types (`MenuRef`, `NoteInstrument`, `ParticleStatus`, `BossBarRef`, `BossBarColor`, `BossBarOverlay`).
2. Remove the dead 1024x1024 / atlas-pool `PipelineTextureError::{OverCap, NoSlot}` variants, `PipelineDrawError::{CapacityExceeded, NonFinite}`, the arbitrary 4,096 shared `WorldGeometry` quad cap, `WorldDrawUsage::quad_capacity`, and whole-batch rollback on `WorldDrawContext::pipeline_quads`, letting CPU `Vec`s grow into dynamically sized, device-limit-respecting chunked GPU buffers (`ModPipelines::prepare`, `WorldPrimitives::prepare`) to match vanilla 26.3 (`SubmitNodeCollection` / `LevelRenderer`) and NeoForge (`SubmitCustomGeometryEvent` / `RenderLevelStageEvent`). Both draw hooks (`submit_custom_geometry` and `render_level_stage`) bump to hook version 2, and all callbacks sharing `WorldDrawContext` (including `DebugRenderer` callbacks registered through `register_debug_renderers`) observe the same uncapped quad and per-quad non-finite-skipping semantics.
3. `register_render_pipelines` (v3) accepts any valid ID, fails startup for duplicate mod pipeline IDs, and checks vanilla collisions in the matching required or optional table from `RenderPipelines.requiredPipelines` and `optionalPipelines`. Mod pipeline lookup remains by ID alone. `ModelLayerLocation` pairs an `Identifier` with an unrestricted layer string. The registration accepts its fully qualified `namespace:path#layer` form, even when a half of the `Identifier` is empty. Like NeoForge's `ClientHooks.registerLayerDefinition` / `ClientHooks.loadLayerDefinitions` and `LayerDefinitions.java.patch`, it stores mod suppliers last-writer-wins and rejects a collision with a vanilla layer at freeze (`ImmutableMap.Builder.build()`). An unreadable or invalid `LayerDefinitions.createRoots` export is a startup error rather than an empty vanilla registry.
4. Keep the direct, unjournaled world submissions used by vanilla `SubmitNodeCollection.submitCustomGeometry` and NeoForge's `LevelRenderer` posts of `SubmitCustomGeometryEvent` and `RenderLevelStageEvent`: the shared panic boundary disables the failing listener and reports its mod without undoing geometry already submitted by it. Following vanilla `LayerDefinitions.createRoots` / `EntityModelSet.bakeLayer` and NeoForge `ClientHooks.loadLayerDefinitions`, suppliers run at freeze, not when baked. A supplier panic now uses the same attributed error log and client toast as hook dispatch, skips that definition, and leaves other suppliers runnable.
"""
migrate = """
1. Remove these local client drawing, render-pipeline, input, audio, screen, options, recipe-panel, key-mapping, model, and animation types from `#[derive(Wire)]` structs and `Writer::put` / `Reader::decode` calls. Keep all in-process client usage unchanged (including JSON loading and `serde_json` / `String::from` / `TryFrom<String>` conversions on `MeshDefinition` and `ModelPart`). When synchronizing data over a typed payload, copy only the owned primitive or cross-boundary fields you intend to send (such as an owned `String` bounded by `PAYLOAD_MAX_STRING_BYTES`, parsed via `Identifier::parse` at the receiving boundary, `u32` modifier bits, coordinates, tick counts, rotation angles, or `ItemStack`) into your own `#[derive(mod_api::Wire)]` struct; `Identifier` itself uses `ordinary_only` Wire routes rather than typed payloads.
2. Update listeners/manifests pinning `submit_custom_geometry` or `render_level_stage` to hook version 2. Drop match arms on the removed `PipelineTextureError::{OverCap, NoSlot}` and `PipelineDrawError::{CapacityExceeded, NonFinite}` variants (keeping `_` for `#[non_exhaustive]`). `WorldDrawContext::pipeline_quads` now fails only with `PipelineDrawError::Pipeline(RenderPipelineError)` on invalid or stale handles, skips individual quads with non-finite coordinates or UVs without rolling back valid quads in the same slice, and grows quad storage dynamically. Stop reading `WorldDrawUsage::quad_capacity` and drop its argument from `WorldDrawUsage::new(lines, line_capacity, quads, instances_used, instances_capacity)`. `WorldDrawContext::quads` and `name_tag` no longer return `DrawError::CapacityExceeded` (only `lines` keeps `line_capacity`). Callbacks sharing `WorldDrawContext` (including `DebugRenderer` callbacks registered via `register_debug_renderers`, already on version 2) follow the same updated `WorldDrawContext` semantics.
3. For `register_render_pipelines` (v3), use unique mod pipeline IDs even across required and optional registrations; `RenderAssets::render_pipeline(&id)` is unchanged. Collisions with vanilla in the matching table fail startup. If the startup error names missing or damaged `render-pipelines.json`, regenerate the prepared client resources. `register_layer_definitions` takes the full `namespace:path#layer` form (write `:` even if a half is empty) and preserves any suffix after the first `#`. Duplicate mod registrations keep the last supplier; startup freeze fails on malformed IDs, collisions with vanilla layers or unreadable or invalid `entity-models.json`.
4. No call changes for panic handling. A panicking `register_layer_definitions` supplier is reported as `<mod id>` in `build_layer_definition`; fix that supplier before expecting its layer to be available from `ClientHost::bake_layer`. For the two world draw hooks, a panic stops that mod's listener for the session, not an already submitted draw in the active view.
"""
