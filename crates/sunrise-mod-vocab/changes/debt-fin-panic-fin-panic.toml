why = '''
Keep one mod's failed callback from publishing unfinished work or stopping unrelated listeners. FMLModContainer.onEventFailed reports failures on the per-mod loading bus; it is not the NeoForge.EVENT_BUS recovery policy. Discarding the failed proposal and disabling only the panicking callback for the session are Sunrise's isolation policy. Vanilla 26.3's IntegratedServer.reportChunkLoadFailure/reportChunkSaveFailure, SystemToast, Gui.handleKeybinds and Options.keyToggleGui, and ToastManager.update/extractRenderState anchor presentation, not disablement. NeoForge's ToastAddEvent controls ordinary admission and RenderGuiEvent.Pre/Post control HUD rendering. NeoForge's RegisterEvent still anchors block/item admission and RegisterConfigurationTasksEvent anchors the per-connection task queue in ServerConfigurationPacketListenerImpl.

The registration moments follow NeoForge's RegisterColorHandlersEvent, EntityRenderersEvent.RegisterRenderers/AddLayers, RegisterParticleProvidersEvent, RegisterCauldronFluidContentEvent, RegisterCauldronInteractionEvent.Interaction, RegisterClientExtensionsEvent, RegisterSpecialModelRendererEvent, RegisterGameTestsEvent, RegisterEvent and RegisterGuiLayersEvent. Vanilla 26.3 sites include BlockColors.register, ClientLevel's tint caches, EntityRenderers.register, EntityRenderDispatcher.onResourceManagerReload, LivingEntityRenderer.addLayer, HumanoidArmorLayer.renderArmorPiece, ParticleResources.register, CauldronInteraction.Dispatcher.put, EnchantmentEffectComponents.register, VillagerProfession.bootstrap, SpecialModelRenderers.bootstrap, TestFunctionLoader.runLoaders, ResourceManagerRegistryLoadTask.load and Hud.extractRenderState. The pack, geometry, POI and ticket boundaries follow PackRepository.discoverAvailable, SectionCompiler.compile, PoiTypes.registerBlockStates and TicketStorage activation with NeoForge's AddPackFindersEvent, AddSectionGeometryEvent, ExtendPoiTypesEvent and LoadingValidationCallback.validateTickets/TicketHelper. Successful calls keep their admission and ordering rules.

Reload registration follows NeoForge's AddClientReloadListenersEvent, AddServerReloadListenersEvent and SortedReloadListenerEvent.addListener/addDependency at vanilla's ReloadableResourceManager.createReload and ReloadableServerResources.loadResources (SimpleReloadInstance). Movement and trampling still occur at Entity.move, Player.travel/LivingEntity.travel and FarmlandBlock.fallOn (NeoForge's CommonHooks.onFarmlandTrample). Contents notices keep Container.setChanged/BlockEntity.setChanged and use the existing nested journal as in NeoForge's Transaction.open(parent). AbstractContainerMenu.clickMenuButton and quickMoveStack anchor the checked menu actions. NeoForge's ChunkDataEvent.Load/Save are at ChunkMap's SerializableChunkData read and save boundaries; a failed Sunrise disk job still cannot publish, independently of whether its other callbacks run.
'''
migrate = '''
Keep the hook and Part callback signatures for these failure-policy changes. Do not panic to cancel, replace or report a recoverable error. Use the hook's normal `Flow::Cancel`, output flag, replacement result or returned error. A panic discards the current staged proposal and aborts writes covered by an existing journal; effects outside a journal are not undone. The panic is logged and shown in a client error toast naming your mod and hook, and disables only that callback for the session. An ordinary phase or output refusal is reported every time without disabling the listener. Later eligible listeners see the last accepted output, not the failed proposal. A successful cancel still respects `receive_cancelled`; a successful replacement still ends the search where the hook is first-answer-wins.

In `blocks` and `items`, continue to call `event.register(Block::new(...))` and `event.register(Item::new(...))`, respectively. Handle `DeclarationError` at the call site as before. A panicking declaration hook publishes no definitions or diagnostics from that listener; a returning listener's invalid declaration still refuses startup. In `register_configuration_tasks`, keep `event.register(task)`. A panicking listener's tasks and journaled Host edits are discarded; other mods' tasks can still admit the same peer, and only the panicking registration listener is skipped for later peers. Registration itself is infallible FIFO. Explicit task and connection failures still follow the normal admission rules. A discarded Part or task's destructor cannot escape the panic fence.

Keep the existing registrar methods: `event.sources.register`, `event.resolvers.register`, `event.contents.register`, `event.effects.register`, `event.professions.register`, `event.renderers.register` (including special models), `event.providers.register`, `event.functions.register`/`register_test`, and `event.conditions.register`/`register_handler`. Use colour-resolver handles only from accepted registrations: a rejected entry does not reserve its slot. A failed callback publishes no factories, providers, definitions, functions, replacements or preparation diagnostics. A completed load-condition callback that ignores a built-in or duplicate ID error can still refuse preparation.

Keep `event.layers.add` for entity layers, `event.extensions.register_model`/`register_texture`/`client_item_extensions` for equipment, and `event.interactions.register`/`register_tag`/`register_to_all`/`register_tag_to_all` for cauldrons. Failed batches publish no layers, armour bindings, providers or queued interactions; do not keep the handles issued to a rejected batch. A completed callback's preparation errors are still reported and can reject the candidate. Keep `event.layers.register`/`replace_layer`/`wrap_layer` for HUD layers; calls see that callback's pending order, and a failed callback changes neither the installed order nor earlier layers' bodies. Keep `event.validation.remove_block_tickets`/`remove_entity_tickets`/`remove_block_ticket`/`remove_entity_ticket`; a failed callback's tentative removals do not publish, and other controllers still validate.

Keep `event.listeners.add_listener` and `event.listeners.add_dependency`, and `event.listeners.add_retained_listener` on the server. Replace `VanillaClientListeners::first()` and `VanillaClientListeners::last()` with `VanillaClientListeners::model_manager()`. Replace `VanillaServerListeners::first()` and `VanillaServerListeners::last()` with `VanillaServerListeners::functions()`. Replace literal `minecraft:first`/`minecraft:last` dependencies with the same side's real anchor. `add_dependency(my_listener, anchor)` runs your prepare before the vanilla build and your apply before its publication; `add_dependency(anchor, my_listener)` runs you after that step in both phases. Every prepare still finishes before any apply. The client atlas upload precedes model publication; the model manager's apply publishes on both the initial load and a live reload. A failed registration callback publishes none of its listeners, edges or retained entries, at startup or on a later reload. Handle the returned `ReloadOrderError` from the call: it is logged on each refusal and does not latch a reload error. A cycle in the completed graph still rejects the reload. Keep calling `event.packs.add_pack_finders`, `event.renderers.register` for section geometry, and `event.extensions.extend` for POIs. Failed callbacks publish none of those entries; a rejected pack still returns its `PackFinderError`. `extend_poi_types` is classified as a listen hook; its Rust callback still returns `()`.

In `entity_move`, keep editing `event.delta`; in `living_travel`, keep editing `event.input` and `event.velocity`. Use `event.cancelled` or return `Flow::Cancel` for a veto. A failed proposal does not reset to the original request or clear an earlier veto. Invalid move or travel output rejects the entire proposal, including any attempted veto, and reports the mod and refused field each time. Unchanged game values are not subject to replacement limits. In `farmland_trample`, keep using the `ServerHost` and `host.transaction` for writes: only a completed callback's writes join the trample action. An explicit veto or stale state still aborts that whole action; a panic alone does not. Fall damage still runs. In `contents_changed`, keep using `host.transaction`: a panicking Part's nested writes no longer publish, but the backing edit that raised the notice is not rolled back and the same position does not re-enter.

In `menu_button`, keep editing `event.entity` and `event.carried`; a panicking callback publishes neither detached output nor queued one-shot updates. In `menu_quick_move`, keep editing `event.entity`, `event.stack` and `event.handled`. A panicking callback refuses the entire move, including the detached block entity, remainder and queued updates; none of those edits can commit. Keep `render_gui_post` and `gui_render_post` signatures and draw through `event.draw` or `event.batch` as before; a failed listener publishes no drawable geometry or corner reservations. Keep `toast_add` and `render_gui_pre` signatures; mandatory mod-error diagnostics do not enter `toast_add`, and neither a HUD veto nor `set_hud_mode(NoHud)` hides them. The player's F1 preference still hides them. Dedicated servers log rather than showing a toast.

In `chunk_data_load` and `chunk_data_save`, keep calling `event.data.get`/`set`/`remove` (and `event.data.transaction` for a local batch). Each `get`/`set`/`remove` evaluates independently and returns and reports its own refusal, including after an earlier failure in the same listener. Use `event.data.failure()` only to inspect the first failure in your callback, not as the error from your latest operation. Later listeners see the last accepted envelopes. A panic or codec failure prevents publication of the entire captured job even if a later listener succeeds. The job returns the first terminal failure. A phase refusal on its own discards only the current proposal and does not fail the job.

