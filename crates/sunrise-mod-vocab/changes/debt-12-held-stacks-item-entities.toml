ids = ["handle:ItemEntityRef::stack", "handle:ItemEntityRef::with_stack"]
why = "Dropped item handles lend the live stack or the current tick's replacement without copying it or encoding its components on every read. A proposed removal or unavailable item cannot fall back to the live stack. Native item-place reads also use resident storage without initializing players or unpacking pending vehicle loot."
migrate = "Replace item.stack(host).map(|stack| stack.count()) with item.with_stack(host, |stack| stack.count()), or move other scalar reads into the callback. For the former owned result, use item.with_stack(host, |stack| stack.project()).flatten(). The callback does not run for an unavailable item or a proposed removal. ItemEntityRef::set_stack and native ItemPlace reads need no call-site changes for this step; reading a vehicle's slot no longer unpacks its loot."
