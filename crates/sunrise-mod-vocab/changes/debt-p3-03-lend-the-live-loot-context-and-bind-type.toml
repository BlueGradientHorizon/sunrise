ids = ["trait:LootTypeContext", "method:LootTypeContext::snapshot", "method:LootTypeContext::params", "trait:LootModifierContext", "method:LootModifierContext::snapshot", "method:LootModifierContext::params", "type:LootContext", "handle:LootContext::new", "type:LootEntity", "type:LootDamage", "type:LootTool", "handle:LootTool::new", "type:LootPlace", "type:LootLevel", "type:LootParamsView", "type:LootEntityView", "type:LootDamageView", "type:LootToolView", "type:LootLevelView", "type:LootStackView", "type:LootExplorationView"]
why = "Loot codecs and global modifiers now borrow the parameters of the running evaluator instead of copying a second context tree. Vanilla LootContext.getOptional, LootParams.contextMap and LootTable.getRandomItems read the same parameters throughout a roll; NeoForge IGlobalLootModifier.apply receives that context and CanItemPerformAbility.test reads its optional TOOL. A read does not draw randomness or manufacture an absent parameter."
migrate = "Replace context.snapshot() with context.params(). Replace queried_table_id, queried_stack, entity, damage, tool, block, biome and luck field reads with getters of the same names, and player with last_damage_player(). Replace place.origin, place.block_entity and place.level with params.origin(), params.block_entity() and params.level(); read level dimension, game_time, day_time, raining and thundering through methods. Read entity and damage fields with same-named getters, e.g. params.damage().and_then(|d| d.source()); use entity.equipment(slot) for a slot or entity.equipment_iter() for all. The equipment stack's item() is an optional ItemKey (item_id() always lends the id), count() and damage() are signed; components(), enchantments() and stew_effects() lend ordered iterators. Use name(index) for an explicitly projected name; exploration() lends settings whose zoom() remains u8. A queried inventory stack uses ItemStackView; call project() only when retaining it. Tool item() is optional, item_id() lends its id, and enchantments() iterates borrowed identifiers with levels. Remove imports and constructions of LootContext, LootEntity, LootDamage, LootTool, LootPlace and LootLevel; no replacement owned or Wire context exists. Use the corresponding views within the callback and copy only the facts you need to retain. Delete reads of seed and draw from context.random() after releasing any parameter borrow. Owned LootStack and ExplorationMap still serve explicit creation and the function/modifier write interfaces."
