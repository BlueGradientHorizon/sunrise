why = "Loot codecs and global modifiers now borrow the parameters of the running evaluator instead of copying a second context tree. Vanilla LootContext.getOptional, LootParams.contextMap and LootTable.getRandomItems read the same parameters throughout a roll; NeoForge IGlobalLootModifier.apply receives that context and CanItemPerformAbility.test reads its optional TOOL. A read does not draw randomness or manufacture an absent parameter. ItemPart::can_perform_action (hook version bumped from 1 to 2) now receives an ItemAbilityContext and a lazily borrowed ItemStackView instead of a fabricated panicking Host during loot predicates and an eagerly projected &ItemStack: gameplay action sites lend the live read-only Host and its merged Tags (context.host(), context.tags()), while neoforge:can_item_perform_ability loot predicates lend the evaluator's merged Tags and LootParamsView (context.tags(), context.loot()) with context.host() == None, matching NeoForge CanItemPerformAbility.test and IItemExtension.canPerformAction. ModLootFunction::apply now mutates the active candidate stack in place via a scoped LootStackEditor instead of copying an owned LootStack across the boundary; each write validates its own input (including vanilla NbtAccounter.MAX_STACK_DEPTH = 512 for NBT component patches and the text boundary for names) before touching its field, and earlier valid edits and random draws are kept on failure, matching vanilla LootItemFunction.apply. GlobalLootModifier::apply now mutates the evaluator's live generated list in place via a scoped LootList instead of converting Vec<LootStack> in and out on every modifier; LootModifierContext::roll_raw lends raw stacks via a LootStackView visitor and LootModifierContext::append_raw appends raw engine output directly into the live list (shared with neoforge:add_table) without an API round-trip, matching NeoForge IGlobalLootModifier.doApply(ObjectArrayList<ItemStack>, LootContext). Registered global loot modifier serializers retain one per-registration CallbackOwner across prepared instances and reloads. LootStack, ExplorationMap, LootModifierError and LootModifierSettings drop their Wire derives as in-process types. Registered loot function and condition codecs now decode each resource entry once at load/preparation time (including inline loot tables, enchantment equipment_drops requirements and global loot modifier conditions) into immutable bound ModLootFunction/ModLootCondition instances, deleting LootEntryData and per-roll JSON cloning/re-validation to match vanilla LootItemFunction, LootItemCondition, LootItemConditionalFunction, LootContextUser.getReferencedContextParams and NeoForge IGlobalLootModifier."
migrate = "Replace context.snapshot() with context.params(). Replace queried_table_id, queried_stack, entity, damage, tool, block, biome and luck field reads with getters of the same names, and player with last_damage_player(). Replace place.origin, place.block_entity and place.level with params.origin(), params.block_entity() and params.level(); read level dimension, game_time, day_time, raining and thundering through methods. Read entity and damage fields with same-named getters, e.g. params.damage().and_then(|d| d.source()); use entity.equipment(slot) for a slot or entity.equipment_iter() for all. The equipment stack's item() is an optional ItemKey (item_id() always lends the id), count() and damage() are signed; components(), enchantments() and stew_effects() lend ordered iterators. Use name(index) for an explicitly projected name; exploration() lends settings whose zoom() remains u8. A queried inventory stack uses ItemStackView; call project() only when retaining it. Tool item() is optional, item_id() lends its id, and enchantments() iterates borrowed identifiers with levels. Remove imports and constructions of LootContext, LootEntity, LootDamage, LootTool, LootPlace, LootLevel and LootEntryData; no replacement owned or Wire context or entry wrapper exists. Use the corresponding views within the callback and copy only the facts you need to retain. Delete reads of seed and draw from context.random() after releasing any parameter borrow. Split registered loot types into a load-time codec implementing ModLootFunctionCodec or ModLootConditionCodec (move old `validate(data)` and `data.value()` field reads to `decode(&serde_json::Value)`, returning `Result<Arc<dyn ModLootFunction>, String>` for functions or `Result<Arc<dyn ModLootCondition>, String>` for conditions; move `conditional()` to ModLootFunctionCodec) and a bound rule implementing ModLootFunction or ModLootCondition (`referenced_context_params(&self)` and `apply(stack: &mut LootStackEditor<'_>, context: &mut dyn LootTypeContext) -> Result<(), String>` or `test(context: &mut dyn LootTypeContext) -> Result<bool, String>`, with no runtime JSON parameter). Register the codec via `Registrar::register_loot_function_type` / `Registrar::register_loot_condition_type`. Update ModLootFunction::apply to read fields via `stack.view()`, edit in place (`set_item`, `set_count`, `set_damage`, `push_component`, `remove_component`, `set_name`, etc.), or explicitly copy/replace with `stack.to_owned()?` and `stack.replace(owned)?`. `LootStackEditError` converts to `String` and `LootModifierError` via `?`. Update GlobalLootModifier::apply to take `generated: &mut LootList<'_>` and return `Result<(), LootModifierError>`, mutating the list in place (`get`, `get_mut`, `iter`, `push`, `insert`, `replace`, `remove`, `pop`, `clear`, `truncate`, `swap`, `reverse`, `reorder`, `retain`). Replace `let extra = context.roll_raw(&table)?;` with `context.append_raw(&table, generated)?;` when appending unmodified raw table drops, or `context.roll_raw(&table, &mut |stack| ...)?;` when inspecting borrowed `LootStackView<'_>` stacks (calling `stack.to_owned()?` only when retaining a copy). Owned LootStack, ExplorationMap, LootModifierError and LootModifierSettings no longer derive Wire; they remain in-process types. For ItemPart::can_perform_action (version 2), replace the `host: &dyn Host` parameter with `context: &ItemAbilityContext<'_>`: read merged tags through `context.tags()`, gameplay services through `if let Some(host) = context.host()`, and loot parameters during `neoforge:can_item_perform_ability` predicates through `if let Some(params) = context.loot()`. `event.stack` is now `ItemStackView<'_>`: read `event.stack.item()`, `count()`, `damage()` and `damage_component()` directly and call `event.stack.project()` only when you need components or an owned `ItemStack`."
