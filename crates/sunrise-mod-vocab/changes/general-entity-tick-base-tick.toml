ids = ["hook:general_entity_tick"]
why = "general_entity_tick version 3 runs after vanilla's Entity.commonTick and Entity.baseTick for the row: the tick count goes up, the boarding cooldown counts down, and the fluid step can change the row's velocity (a current pushes it unless it rides or has no_physics) and its fall distance (water resets it, lava halves it). A row below the world (y < min_y - 64) is discarded there and its tick does not run. Version 2 listeners saw the velocity and fall distance exactly as the previous tick left them, and no row was discarded before the listener ran. The engine still applies no gravity and makes no move: the listener's own gravity, drag and move_by do. A collided move of a general row, whatever its cause, now sets on_ground and zeroes the velocity a blocked axis loses, and the row's NoGravity, OnGround and fall_distance are saved and NoGravity is synced as Entity.DATA_NO_GRAVITY."
migrate = "Rebuild native listeners against the version 3 hook. A listener that read the velocity or fall distance at the top of its tick now sees them after the fluid step; one that moved a row below the world no longer runs for it."
