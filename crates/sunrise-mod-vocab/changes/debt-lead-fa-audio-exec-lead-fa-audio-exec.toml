ids = ["handle:ClientExecutor::execute"]
why = "Vanilla's Minecraft.runTick drains PacketProcessor.processQueuedPackets before runAllTasks; NeoForge's MainThreadPayloadHandler uses ClientPayloadContext.enqueueWork in that packet phase. Sunrise now finishes the whole packet phase, including packets and queued payload work published during dispatch, before running any executor task. If packet work is deferred, the executor phase waits."
migrate = "Keep executor.execute(Box::new(move |host| { ... })). Inside the closure, resolve retained handles against that live host and handle missing entities rather than assuming an earlier submission will run before a removal. For audio, check the result of stream.set_entity(host, entity); false means the retarget was refused and the placement did not change."
