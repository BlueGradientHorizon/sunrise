ids = [
    "handle:ClientExecutor::execute",
    "method:prelude::ServicesClientHost::client_executor",
    "handle:AudioStreamRef::set_entity",
    "handle:AudioStreamRef::set_flat",
    "handle:AudioStreamRef::set_position",
]
why = """
Vanilla's Minecraft.runTick drains PacketProcessor.processQueuedPackets before runAllTasks; \
NeoForge's MainThreadPayloadHandler uses ClientPayloadContext.enqueueWork in that packet phase. \
Sunrise finishes the whole packet phase, including packets and queued payload work published during \
dispatch, before running executor tasks. If packet work is deferred, executor tasks wait. \
BlockableEventLoop.doRunTask reports failures and continues unrelated work. For a native mod panic, \
Sunrise additionally disables that mod's executor for the client session. Like NeoForge's \
SnapshotJournal.onRootCommit, a task publishes stream placement only after success, so a panicking \
task never changes the mixer's placement. Ordinary phase refusals are reported without disabling \
the mod's executor."""
migrate = """
Keep executor.execute(Box::new(move |host| { ... })). Inside the closure, resolve retained handles \
against that live host, not before submitting the task. Use let Some(executor) = host.client_executor() \
else { return; }; as before, but None also means this mod's executor already panicked. Do not use a \
second handle or another task from the same mod to recover from a panic: queued and future work for \
that mod won't run until a new client session. Handle expected failures in the task without panicking.

Keep stream.set_entity(host, entity), stream.set_flat() and stream.set_position(at). Check their \
bool return: false refuses the placement; in an executor task, true accepts a placement to publish \
after the task returns successfully, not during the task. The client logs a refusal if the stream \
stops between acceptance and publication."""
