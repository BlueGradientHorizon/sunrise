why = """
NeoForge RegisterEvent declares a particle type separately from the logical client's RegisterParticleProvidersEvent.registerSpriteSet factory. Vanilla ParticleDescription.fromJson and ParticleResources.reload distinguish a missing description from an empty one and substitute the atlas missing sprite for unresolved artwork. ClientLevel.doAddParticle admits both built-in and mod spawns through the same entry, while ParticleEngine.createParticle/makeParticle lends the level even when called directly; TrackingEmitter lends it on its constructor tick too. ClientLevel owns its ClientExplosionTracker, so pending debris does not carry over on level replacement. ClientPacketListener.handleParticleEvent multiplies zero-count packet fields as floats before widening, and draws count-positive spread from its own stream, independent of the random lent by ParticleEngine.makeParticle. Following ParticleProvider.createParticle and ParticleEngine.makeParticle/add/tick with ParticleGroup.add, a provider creates one owned instance with the live level and random before the engine admits it to its render group from the pending FIFO. Particle.tick/remove govern previous pose and lifetime, and SingleQuadParticle.extract builds a frame from that pose without changing the particle. Live views replace batch copies and fixed scratch storage; neither render output nor the shape of a batch decides when a particle dies. Registered ParticleOptions and their Wire and network encodings are unchanged.
"""
migrate = '''
For a native type, replace `registrar.particle_key(name)` in `Hooks::register` with `registrar.declare_particle(&Identifier::parse_namespaced(name).unwrap())` and retain the returned key. Declare the identity on both logical sides; keep `particle_key(name)` for references to existing types. The type stays registered even if the client lacks its sprite description.

Keep `Hooks::register_particle_providers(&self, context: &RegistrationContext, event: &mut RegisterParticleProvidersEvent<'_>)`. Replace `event.providers.register(name, Arc::new(P))` with `event.register_sprite_set(Identifier::parse_namespaced(name).unwrap(), |sprites| P { ... })` (pass `&name` if you still have a `String`; unwrap only known namespaced IDs). Return a concrete `ParticleProvider`; the factory captures only owned `Send + Sync + 'static` data. Use `sprites.frame_count()` for the frame count of this load. The last accepted factory for an ID binds once per sprite load on the logical client. An unresolved texture keeps its declared frame with the atlas missing sprite; an empty description binds with one missing sprite. A missing description or failed bind is reported and refuses native spawns without falling back to declarative motion. A Polytone pack definition still wins when it overrides the type. Drop `ParticleProviders`, `ParticleProviderRegistry` and `into_providers`; there is no registry to drain or edit.

Replace `ParticleProvider::tick(&self, particles: &mut ParticleBatch, level: &dyn ParticleLevelView)` with `create_particle(&self, spawn: &mut ParticleSpawn<'_>, particle: &mut dyn ParticleTickView) -> Option<Box<dyn CustomParticle>>`. Read the typed request and raw arguments from `spawn.options`, `spawn.position` and `spawn.velocity`; use `spawn.level` and `spawn.random` during construction. `particle` starts with the declaration's spawn defaults. Move the four scratch numbers in `ModParticle::state` into ordinary fields of your own `Instance` and return `Some(Box::new(Instance { ... }))`. Return `None` to deliberately decline just this spawn: nothing is queued and no error is reported. A returned instance still goes through group admission. It must own its data and be `Send + Sync + 'static`; it cannot retain callback loans.

Move the old batch loop body into `CustomParticle::tick(&mut self, particle: &mut dyn ParticleTickView, level: &dyn ParticleLevelView)` on `Instance`. Remove `ParticleBatch`, `len`, `is_empty`, `get_mut`, `iter_mut`, `into_iter` and both batch conversion helpers; there is no batch to inspect or return. The default tick calls `particle.tick_base()`. For your own motion, first use `if !particle.advance_age() { return; }` to record previous position and roll and increment age; then update the particle. Age starts at zero. Both tick operations expire the particle when its pre-increment age reaches its lifetime. An override that uses neither operation controls expiry itself with `remove()`.

Replace the old `position`, `previous`, `velocity`, `age` and `lifetime` fields with `position()`, `previous_position()`, `velocity()`, `age()` and `lifetime()`; write with the corresponding `set_position`, `set_previous_position`, `set_velocity`, `set_age` and `set_lifetime`. Use `move_by(delta)` for collision-aware motion. After teleporting with `set_position`, use `set_previous_position` too if you want to snap rather than interpolate. Replace `removed` reads with `!particle.is_alive()` and writes of `true` with `particle.remove()`; there is no write to revive it.

Replace appearance fields `size`, `rgba`, `frame`, `facing` and `roll` with `size()`, `rgba()`, `sprite_index()`, `facing()` and `roll()` and their corresponding `set_*` methods. `set_sprite_index` takes an exact `usize` and does not clamp to the last frame; use `set_sprite_from_age()` for vanilla's age-driven selection. `previous_roll()` exposes the interpolation origin; a current roll of zero renders without a turn. Invalid setter input is reported and does not change that field or expire the particle. Do not encode `ParticleFacing`, `ModParticle` or `ParticleBatch` with `Wire`; only the facing vocabulary remains, as local presentation data.

For frame-only drawing, implement `CustomParticle::extract(&self, particle: &dyn ParticleView, partial_tick: f32, quad: &mut ParticleQuad)`. Edit `quad.size`, `quad.rgba`, `quad.facing` and `quad.roll`, or set `quad.visible = false` to hide just this draw. Omit the override to draw the configured quad. The engine interpolates position from previous to current, and nonzero roll from previous roll, at `partial_tick`. Sprite, light and render group still come from the particle. A hidden quad, refused callback or non-finite geometry skips the draw, not the tick or lifetime; use the tick view for simulation changes. A panic is logged and shown in the client error toast under the mod's name and disables that registration's panicking callback kind for the session; ordinary refusals do not latch. Resource reload discards existing native instances and binds new providers.

Keep the same sprite description (`assets/<namespace>/particles/<path>.json`), `ParticleOptions` constructors and mod-API send calls. Local providers see the original typed fields. The unchanged named network particle codec sends only the registered ID: the receiver constructs `ParticleOptions::simple(key)` with default fields. The options' Wire form is also unchanged; a provider instance and its views never cross the wire. Drawing from `spawn.random` does not change later spawns' positions or velocities in the same packet.

For a native function replacement, keep target `sunrise_client_render::particles::ParticleEngine::add_with`. Its signature changes from `fn(&mut ParticleEngine, &ParticleOptions, [f64; 3], [f64; 3], bool, bool)` to `fn(&mut ParticleEngine, &ParticleOptions, [f64; 3], [f64; 3], ParticleSpawnFlags, SpawnScope<'_, '_>)`, with those types in `sunrise_client_render::particles`. Read the old booleans from `flags.override_limiter` and `flags.always_show`. Forward both `flags` and `scope` to the next implementation so scoped spawns keep their borrowed level and original typed options. For your own calls, construct `ParticleSpawnFlags { override_limiter, always_show }` and pass `SpawnScope::with_level(&level, mod_options)` for named options, or `SpawnScope::BARE` for built-ins when no level loan is needed. Both paths reach the same replacement.

On the native route, `sunrise_client_render::particles::Particle` no longer implements `Clone`. Replace `engine.push(particle.clone())` with `engine.push(particle)` when queuing it once, or construct a fresh owned particle for each additional spawn. `ParticleController` no longer requires `Clone`; remove that bound from code that only needs to tick or move the controller. Its `tick` signature is unchanged.

`ParticleEngine::create(options, pos, velocity)` becomes `create(options, pos, velocity, scope)` and still bypasses level admission. `send_particles(options, at, spread, speed, count)` becomes `send_particles(options, at, spread, speed, count, scope)`. `tracking_emitter(options, target, body)` becomes `tracking_emitter(options, target, body, scope)`; `tracking_emitter_for(options, target, body, life)` becomes `tracking_emitter_for(options, target, body, life, scope)`. For each, pass `SpawnScope::with_level(&level, mod_options)` from the current client level for named options, including the tracking emitter's immediate first burst. Pass `None` for `mod_options` if you only have the engine options. Reserve `SpawnScope::BARE` for built-ins that do not need the level.

`ParticleEngine::explosion(center, emitter, block_count, radius, particles)` becomes `explosion(center, emitter, block_count, radius, particles, &level)`. `sunrise_client_gameplay::remote::projectiles::cloud_client_tick(engine, at, radius, waiting, options)` becomes `cloud_client_tick(engine, &level, at, radius, waiting, options)`. In both cases `level` is the owning `sunrise_client_render::particles::ParticleLevel` loan, constructed with `ParticleLevel::new(&world, facts, collision)` when the caller does not already hold one.
'''
