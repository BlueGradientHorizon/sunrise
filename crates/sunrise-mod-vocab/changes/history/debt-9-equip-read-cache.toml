why = "The unused guest read cache and its Wire row are gone. The native host still lends the same target snapshot and checks it before applying the decision."
migrate = "No change to ItemPart::can_equip or the hook version. Remove any use of the hidden EquipReadRow, EquipReadSet, EquipReadGuard and enter_equip_reads. Inside the part, use the supplied host with event.entity: cached_equip_kind becomes event.entity.entity().kind(host), cached_equip_position becomes event.entity.entity().position(host), and cached_equip_living becomes host.living(event.entity.entity()). For the other cached_equip_* reads, call event.entity.health(host), .max_health(host), .alive(host), .equipment(host, slot) or .hand_item(host, hand), respectively. The getters return the read result directly, not an extra Option for a cache hit."
