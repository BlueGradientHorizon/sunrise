why = """
Built-in and mod-defined capability keys now both bind typed native callbacks instead of carrying
separate provider enum cases inherited from the guest runtime. This follows NeoForge's typed
RegisterCapabilitiesEvent and BlockCapability.getCapability, ItemCapability.getCapability and
EntityCapability.getCapability. As in NeoForge's CapabilityRegistry.create, registrations agree
on both handler and context type by type identity, not by their displayed names. Conflicts refuse
registration and name both mods. Capability names and raw item/entity target IDs use the character
rules in vanilla 26.3's Identifier.isValidNamespace and Identifier.isValidPath, with the required
explicit namespace. Lookup precedence and the vanilla container path (HopperBlockEntity.getBlockContainer)
are unchanged.
Stock mod block containers (`block_container`) validate that their declared slot count fits in a
nonnegative 32-bit integer, matching NeoForge's `ResourceHandler.size` and `getResource(int)` (Java
`int`), while vanilla containers keep `ContainerHelper.saveAllItems`/`loadAllItems` and
`ItemStackWithSlot.CODEC`'s unsigned-byte slot encoding and mod-only saved `Items` rows encode
extended indices (`>= 256`) in NBT `Int` `Slot` fields without wrapping, following NeoForge's
`ItemStacksResourceHandler`/`StacksResourceHandler.serialize`.
Stock mod block storage declarations (`block_container`, `block_fluids`, `block_energy`) now keep
their declared slot counts, tank counts, tank capacities, zero-capacity buffers and transfer rates
instead of clamping them to 256 slots, 16 tanks, `1..=1_000_000` mB, `capacity >= 1` or
`0..=capacity`. Container face/input/output indices and `insert_rules` length, fluid
face/input/output indices, and nonnegative energy `capacity`/`max_insert`/`max_extract` are
validated once at registration (following NeoForge's `SimpleEnergyHandler` constructor and
`FluidStacksResourceHandler`), refusing malformed registrations once with the registering mod and
block instead of silently rewriting shapes.
"""
migrate = """
Do not construct or match BlockProviderOf, ItemProviderOf, EntityProviderOf or OwnProvider.
Replace direct calls with the typed registrar helpers:
- provide_block_capability -> r.block_capability(&key, &block, callback)
- provide_block_entity_capability -> r.block_entity_capability(&key, &kind, callback)
- provide_item_capability -> r.item_capability(&key, item_id, callback)
- provide_entity_capability -> r.entity_capability(&key, kind_id, callback)
Use the matching _before_game helper when the old before_game argument was true. Pass the typed
key instead of key.name. Keep using the typed helpers with valid namespace:path identifiers:
replace malformed names or raw item/entity IDs (for example, "test:Robot" -> "test:robot").
For a shared capability, import the defining mod's key instead of redeclaring it with another
handler or entity context. For example, use the published EntityCapabilityKey<Handler, ()>
with a |host, entity, ()| callback, not a same-named EntityCapabilityKey<Handler, Option<Direction>>.
Pass a key from block_key, block_entity_type_key, item_key or entity_type_key for registration
calls and coverage queries that take a registry key. A failed key request cannot be used to ask
whether the target is covered without also recording a refusal.
Mock or forwarding Registrar implementations replace the provider argument type of each raw
provide_*_capability method with NativeCapabilityProvider and may pass it through unchanged.
Implementations of CapabilityRegistrationRegistrar change the receiver on item_capability_registered
and entity_capability_registered from &self to &mut self. Calls using the typed
is_item_capability_registered and is_entity_capability_registered helpers are unchanged.
Keep `ModContainer::slots` passed to `r.block_container(&block, container)` within `0..=i32::MAX`,
every index in `faces`, `inputs` and `outputs` strictly below `slots`, and `insert_rules.len() <= slots`.
Keep every index in `ModFluidTanks::{faces, inputs, outputs}` strictly below `tanks.len()`; zero-capacity
tanks remain 0 mB and refuse fill instead of being promoted to 1 mB.
Pass nonnegative (`>= 0`) `capacity`, `max_insert` and `max_extract` to `r.block_energy(&block, buffer)`;
negatives are refused at registration, while zero capacity and transfer rates above `capacity` are kept
as declared.
"""
