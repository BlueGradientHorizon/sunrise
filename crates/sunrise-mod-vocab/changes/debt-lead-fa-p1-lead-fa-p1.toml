ids = ["hook:menu_quick_move"]
why = "Like vanilla 26.3 AbstractContainerMenu.doClick, Slot.getItem and CraftingMenu.quickMoveStack, the authoritative shift-click checks pickup on the same live menu that moves the stack, with linked slots and the shown crafting result installed. NeoForge's AbstractContainerMenu and Slot patches leave this order unchanged; a Java menu supplies its own quickMoveStack override. An override reads the clicked source and puts its remainder back there, not into unrelated owner storage."
migrate = "Rebuild and repack with menu_quick_move version 4 instead of 3. Keep the same callback signature. Read the clicked stack from event.stack, not event.entity.items[event.slot]: a container slot may now reach the hook with a linked stack or the shown crafting result. To handle the move, put what you move into its destination and leave the remainder in event.stack (None empties that source); do not also write the remainder into the owning entity's items for a linked slot or crafting result. If you handle a crafting result, consume its inputs yourself. If you leave the move unhandled, listener writes are undone and the same menu continues without asking the source pickup rule again."
