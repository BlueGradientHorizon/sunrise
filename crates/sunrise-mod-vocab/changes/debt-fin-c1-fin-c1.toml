ids = ["trait:IPayloadHandler", "method:IPayloadHandler::handle", "trait:PayloadWork", "method:PayloadWork::run"]
why = "Vanilla PacketDecoder.decode still validates packet framing, and ClientPacketListener.handleBundlePacket delivers the subpackets in order. Like NeoForge NetworkRegistry.handleModdedPayload and MainThreadPayloadHandler.handle, Sunrise checks the negotiated channel before scheduling its callback. A repeat delivery to a callback already disabled by a panic now skips callback ingress and Main receipt admission, so it cannot disconnect the peer or stop the rest of an accepted bundle."
migrate = "No call or wire format changes. Keep implementing IPayloadHandler::handle and PayloadWork::run as before. A panic in either disables that receiving callback for the session and reports the owning mod once. Its later valid packets are skipped; other callbacks and bundle steps still run. Keep returning PayloadHandleError::Failed or Err(String) for ordinary errors, and call cx.disconnect(reason) when a successful handler intentionally needs to end the connection."
