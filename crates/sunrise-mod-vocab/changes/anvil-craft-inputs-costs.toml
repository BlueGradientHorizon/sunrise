ids = ["type:item::menu::AnvilCraftInputs.xp_cost"]
why = "`AnvilCraftInputs` gains `xp_cost`, the raw pre-take level cost `AnvilMenu.onTake` reads as `cost` before it changes anything (NeoForge listeners reach it as `AnvilMenu.getCost()`), so a listener that cancels `anvil_craft_pre` can do the take itself and charge the levels. `anvil_craft_pre` and `anvil_craft_post` borrow the same struct and see the same value. The material count is not added: the take consumes the count the final `anvil_update` left, its `edits.material_cost`. Hook versions stay: existing listeners read the same fields with the same meaning, and the cancel contract is unchanged."
migrate = "Rebuild against the current SDK. A mod that builds an `AnvilCraftInputs` literal adds the field; a listener that only reads `left`, `right` and `output` compiles unchanged."
