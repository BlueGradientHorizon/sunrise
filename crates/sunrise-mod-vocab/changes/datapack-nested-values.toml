ids = ["type:DatapackFieldKind", "type:DatapackValue", "type:DatapackKeyKind", "type:DatapackDecodeError", "type:DatapackRegistrationError", "type:DatapackLoadReason"]
why = "A mod's datapack registry holds nested values, as vanilla's codec-backed registries do: List { of, min_len, max_len } (Codec.list, sizeLimitedListOf), Map { key, value } with Text, Identifier or Reference keys (Codec.unboundedMap, in key order), nested Record { fields }, and optional fields with no default (DatapackField::optional, optionalFieldOf), absent as DatapackValue::Absent which get reports as None. DatapackValue gains List, Map, Record and Absent with as_list, as_map, get and scalar accessors. Decode errors name the full path (drops[3].item, tiers.basic.data_per_kill), a list of the wrong length is DatapackDecodeError::WrongLength, and references resolve at any depth, the unresolved one's path in UnresolvedReference.field. Sync and reload are unchanged: the decoded tree travels in the registry snapshot."
migrate = "Nothing to migrate: the kinds and values are non_exhaustive and only grow. A match over DatapackValue or DatapackFieldKind already has a wildcard arm. A mod that compiled nested data into itself can declare it as a schema instead, so data packs add and override entries."
